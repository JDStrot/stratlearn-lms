nimation:pop .3s}\n  @keyframes pop{50%{transform:scale(1.06)}}\n}\n@media (prefers-reduced-motion:reduce){.node .start{animation:none}.flip .in{transition:none}}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n/* ===== Extra interaction types ===== */\n.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}\n.mcol{display:grid;gap:8px;align-content:start}\n.match .opt{min-height:66px;justify-content:center;text-align:center;font-size:15px;padding:10px 8px}\n.match .opt.lock{color:var(--ink);opacity:1}\n.rush{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;color:var(--sea)}\n.rush svg{width:44px;height:44px;transform:rotate(-90deg)}\n.rush .rb{fill:none;stroke:var(--line);stroke-width:5}\n.rush .rt{fill:none;stroke:var(--sea);stroke-width:5;stroke-linecap:round;stroke-dasharray:113.1;stroke-dashoffset:0;transition:stroke-dashoffset .1s linear}\n.rush b{font-size:26px;font-variant-numeric:tabular-nums;min-width:30px}\n.rush span{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.rush.low,.rush.low span{color:var(--bad)} .rush.low .rt{stroke:var(--bad)}\n.gauge{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px}\n.gnum{display:flex;justify-content:center;align-items:baseline;gap:4px}\n.gnum b{font-family:var(--display);font-size:60px;line-height:1;font-variant-numeric:tabular-nums}\n.gnum span{font-family:var(--display);font-size:22px;color:var(--muted)}\n.gzone{justify-self:center;font-family:var(--display);font-weight:600;padding:4px 14px;border-radius:99px;color:#1F2B3A}\n.gtxt{text-align:center;font-weight:700;min-height:44px}\n.gbar{display:flex;height:12px;border-radius:99px;overflow:hidden}\n.gticks{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}\n.tri{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:8px}\n.tri svg{width:100%;max-width:300px;margin:0 auto;height:auto}\n.tlab{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:17px;letter-spacing:.06em}\n.tri .side{transition:opacity .3s} .tri .side.gone{opacity:.1}\n#tfl{transition:transform .45s,opacity .45s;transform-box:view-box;transform-origin:150px 200px}\n#tfl.out{transform:scale(.05);opacity:0}\n.tb .k{width:22px;height:22px;border-radius:50%}\n.passsteps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}\n.passsteps span{text-align:center;font-family:var(--display);font-weight:600;font-size:14px;padding:6px 2px;border-radius:12px;background:var(--surface);border:2px solid var(--line);color:var(--muted)}\n.passsteps span.on{background:var(--pink);border-color:var(--pink);color:#fff}\n.sim svg{touch-action:none;cursor:pointer}\n.zone{fill:rgba(26,159,203,.12);stroke:var(--sea);stroke-width:2.5;stroke-dasharray:6 5;cursor:pointer}\n.zlab{font-family:Nunito,sans-serif;font-weight:800;font-size:12px;fill:var(--seaD)}\n.tapme{cursor:pointer}\nsvg [hidden]{display:none}\n.agent{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}\n.abar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}\n.abar i{display:block;height:100%;width:100%;background:#D93A2B;border-radius:99px}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.mapbox svg{cursor:default}\n.rlab text{font-family:Nunito,sans-serif;font-weight:800;font-size:11px;fill:var(--muted);text-anchor:middle}\n.mlab{font-family:Nunito,sans-serif;font-weight:800;font-size:12px;fill:var(--ink)}\n.mt{cursor:pointer}\n.mring{fill:rgba(238,95,138,.15);stroke:var(--pink);stroke-width:3;stroke-dasharray:5 4}\n.mt.nope .mring{fill:rgba(235,79,71,.18);stroke:var(--bad);stroke-dasharray:none}\n.mt:focus-visible{outline:none} .mt:focus-visible .mring{stroke-width:5}\n.cupbox{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px}\n.hour{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--muted)}\n.hour i{flex:1;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--line),var(--sea))}\n.cuprow{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}\n.cupi{width:100%;height:auto}\n.cupi .cs{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-linejoin:round}\n.cupi .cw{fill:transparent;transition:fill .2s}\n.cupi.full .cs{stroke:var(--sea)} .cupi.full .cw{fill:#6CC4EE}\n.cupread{display:flex;justify-content:center;gap:12px;align-items:baseline;font-variant-numeric:tabular-nums}\n.cupread b{font-family:var(--display);font-size:30px}\n.cupread span{font-weight:800;color:var(--muted)}\n.cool svg{cursor:pointer}\n.plancard{background:var(--surface);border:2px solid var(--good);border-radius:20px;padding:16px;display:grid;gap:12px;box-shadow:0 5px 0 var(--good)}\n.plancard .ph{display:flex;gap:8px;align-items:center;color:var(--goodInk)}\n.plancard .ph svg{width:26px;height:26px}\n.plancard .ph b{font-family:var(--display);font-size:20px}\n.plancard input{font-size:16px}\n.pledge{display:grid;justify-items:center;gap:16px;text-align:center;padding-top:8px}\n.pledge p{font-family:var(--display);font-weight:600;font-size:20px;max-width:30ch}\n.hold{position:relative;width:132px;height:132px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-family:var(--display);font-weight:600;font-size:17px;box-shadow:0 6px 0 var(--pinkD);user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none;transition:transform .1s}\n.hold svg{position:absolute;inset:-8px;width:148px;height:148px;transform:rotate(-90deg);pointer-events:none}\n.hold .hbg{fill:none;stroke:var(--line);stroke-width:6}\n.hold .hfg{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round}\n.hold.on{transform:scale(.95)}\n.hold.done{background:var(--good);box-shadow:0 6px 0 var(--goodD)}\n.hold span{position:relative}\n@media (prefers-reduced-motion:no-preference){\n  #pfire path,#tfl path{animation:flick .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}\n  #pfire path:nth-child(2),#tfl path:nth-child(2){animation-duration:.37s}\n  @keyframes flick{to{transform:scale(1.04,.93)}}\n  .mring{animation:breathe 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}\n  @keyframes breathe{50%{transform:scale(1.12)}}\n}\n<\/style>\n\n<div id=\"app\"><\/div>\n<script>document.documentElement.lang=\"es\";<\/script>\n<canvas id=\"badgeCanvas\" width=\"1080\" height=\"1080\" hidden><\/canvas>\n\n<script>\n/* ============ Lottie (from the mascot sheet, unchanged art) ============ */\nconst C={body:'#FAD3DF',dark:'#EFAFC0',belly:'#FFEFF4',gill:'#E8919F',gillD:'#D97586',fin:'#FCE0E9',ink:'#2A1A4A',cheek:'#F27FA0',gold:'#FFC83D',goldD:'#D99A12',tear:'#5EC8FF'};\nconst heart=(x,y,s,c)=>`<path d=\"M${x},${y+s*.9} C${x-s*1.4},${y} ${x-s*.9},${y-s} ${x},${y-s*.35} C${x+s*.9},${y-s} ${x+s*1.4},${y} ${x},${y+s*.9}Z\" fill=\"${c}\"/>`;\nconst note=(x,y,c)=>`<g fill=\"${c}\"><ellipse cx=\"${x}\" cy=\"${y}\" rx=\"5\" ry=\"4\" transform=\"rotate(-20 ${x} ${y})\"/><rect x=\"${x+3.5}\" y=\"${y-18}\" width=\"2.6\" height=\"18\"/><path d=\"M${x+3.5},${y-18} q8,2 10,9 q-4,-3 -10,-4Z\"/><\/g>`;\nconst spark=(x,y,s,c)=>`<path d=\"M${x},${y-s} Q${x+s*.18},${y-s*.18} ${x+s},${y} Q${x+s*.18},${y+s*.18} ${x},${y+s} Q${x-s*.18},${y+s*.18} ${x-s},${y} Q${x-s*.18},${y-s*.18} ${x},${y-s}Z\" fill=\"${c}\"/>`;\nfunction gills(){\n  const stalk='M0,-3.5 C12,-4.5 24,-4 36,-8 C33,-1 22,4 0,3.5 Z';\n  let fr='';\n  [[7,8],[13,8],[19,7.5],[25,6.5],[31,5]].forEach(([x,l])=>{const y=-(x/36)*4;\n    fr+=`<path d=\"M${x},${y-2} L${x+l*.55},${y-2-l}\" /><path d=\"M${x},${y+2} L${x+l*.55},${y+2+l}\" />`;});\n  const g=[[52,64,-142,1],[44,84,-172,.95],[48,104,160,.85]];let out='';\n  for(const s of [1,-1]) for(const [x,y,a,k] of g){const X=s===1?x:200-x, A=s===1?a:180-a;\n    out+=`<g transform=\"translate(${X} ${y}) rotate(${A}) scale(${k})\"><g><animateTransform attributeName=\"transform\" type=\"rotate\" values=\"0;${7*s};0;${-5*s};0\" dur=\"${(2.6+Math.random()).toFixed(2)}s\" begin=\"-${(Math.random()*3).toFixed(2)}s\" repeatCount=\"indefinite\"/><g stroke=\"${C.dark}\" stroke-width=\"4\" stroke-linecap=\"round\">${fr}<\/g><path d=\"${stalk}\" fill=\"${C.gill}\"/><\/g><\/g>`;}\n  return out;\n}\nfunction eyes(type){\n  const L=76,R=124,Y=88;\n  const open=(x,big)=>{const s=big?1.12:1,wx=11*s,wy=15*s,px=8*s,py=11.5*s,cy=Y+1.5;\n    const blink=`<animateTransform attributeName=\"transform\" type=\"scale\" values=\"1 1;1 1;1 .08;1 1\" keyTimes=\"0;.93;.965;1\" dur=\"${(4+Math.random()*2).toFixed(2)}s\" begin=\"-${(Math.random()*4).toFixed(2)}s\" repeatCount=\"indefinite\"/>`;\n    const look=`<animateTransform attributeName=\"transform\" type=\"translate\" values=\"0 0;1.6 -.4;1.6 -.4;-1.2 .4;0 0\" dur=\"6s\" begin=\"-${(Math.random()*6).toFixed(2)}s\" repeatCount=\"indefinite\"/>`;\n    return `<g transform=\"translate(${x} ${Y})\"><g>${blink}<g transform=\"translate(${-x} ${-Y})\"><ellipse cx=\"${x}\" cy=\"${Y}\" rx=\"${wx}\" ry=\"${wy}\" fill=\"#fff\"/><g>${look}<ellipse cx=\"${x+1}\" cy=\"${cy}\" rx=\"${px}\" ry=\"${py}\" fill=\"${C.ink}\"/><circle cx=\"${(x+1-px*.62).toFixed(1)}\" cy=\"${(cy-py*.62).toFixed(1)}\" r=\"${(px*.52).toFixed(1)}\" fill=\"#fff\"/><circle cx=\"${(x+1+px*.4).toFixed(1)}\" cy=\"${(cy+py*.42).toFixed(1)}\" r=\"${1.6*s}\" fill=\"#fff\"/><\/g><\/g><\/g><\/g>`;};\n  switch(type){\n    case 'happy': return [L,R].map(x=>`<path d=\"M${x-10},${Y+3} Q${x},${Y-10} ${x+10},${Y+3}\" stroke=\"${C.ink}\" stroke-width=\"3.2\" fill=\"none\" stroke-linecap=\"round\"/>`).join('');\n    case 'heart': return [L,R].map((x,i)=>`<g transform=\"translate(${x} ${Y}) rotate(${i?8:-8})\"><g><animateTransform attributeName=\"transform\" type=\"scale\" values=\"1;1.16;1;1.1;1;1\" keyTimes=\"0;.12;.2 }\"/>`:`<g fill=\"${c}\" opacity=\".85\">${[[70,118],[78,126],[88,130],[100,132],[112,130],[122,126],[130,118],[64,110],[136,110],[94,126],[106,126],[84,122],[116,122]].map(([x,y])=>`<circle cx=\"${x}\" cy=\"${y}\" r=\"1.9\"/>`).join('')}<\/g>`,\n    ouch:()=>`<path d=\"M150 40l8-10 2 12 10-6-4 12\" stroke=\"#EB4F47\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>`,\n    sweat:()=>`<path d=\"M156 56c-5 8-5 13 0 15 5-2 5-7 0-15z\" fill=\"#5EC8FF\"/>`\n  };\n  const gloves=(pose,c,cuff)=>(ARMS[pose]||ARMS.default).map(([x,y,r])=>`<g transform=\"translate(${x} ${y}) rotate(${r})\"><path d=\"M-9.5 1C-9.5 11-6 18 0 18C6 18 9.5 11 9.5 1Z\" fill=\"${c}\"/><rect x=\"-10.5\" y=\"-3\" width=\"21\" height=\"7\" rx=\"3.5\" fill=\"${cuff||c}\"/><\/g>`).join('');\n  const ring=(pose,i=1)=>{const [x,y,r]=(ARMS[pose]||ARMS.default)[i];return `<g transform=\"translate(${x} ${y}) rotate(${r})\"><circle cx=\"0\" cy=\"9\" r=\"6\" fill=\"none\" stroke=\"#FFC83D\" stroke-width=\"3.5\"/><circle cx=\"-3\" cy=\"5\" r=\"2\" fill=\"#fff\"/><\/g>`};\n  const box=(x,y,w,h)=>`<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"4\" fill=\"#D9A066\"/><rect x=\"${x+w*.62}\" y=\"${y}\" width=\"${w*.38}\" height=\"${h}\" rx=\"4\" fill=\"#C98E55\"/><path d=\"M${x} ${y+h*.45}h${w}\" stroke=\"#B07A45\" stroke-width=\"4\"/><path d=\"M${x+7} ${y+7}h${w*.28}\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\".45\"/>`;\n  const limb=(x1,y1,x2,y2)=>`<path d=\"M${x1} ${y1}L${x2} ${y2}\" stroke=\"${dark}\" stroke-width=\"17\" stroke-linecap=\"round\"/>`;\n  /* x,y,w: where to place her (nested svg). o: axo options + wear:[...gear strings drawn on her body], front: extra art in her own coordinates, arms:'none' hides her arms */\n  function at(x,y,w,o={}){\n    const tilt=o.tilt||0;let s=axo(Object.assign({still:1,mouth:'open',label:o.label||'acting it out'},o,{front:''}));\n    s=s.replace(/<circle cx=\"(24|182|196)\" cy=\"(70|40)\" r=\"[46 [203,96,18]]},\n      {id:'sign',name:'Letrero de salida apagado',spots:[[318,26,20]]}],\n    why:'Las puertas de salida se deben abrir desde adentro sin llave. Las rutas siempre libres. Los letreros de salida siempre encendidos. Las puertas cortafuego siempre cerradas para detener el humo.'},\n  {t:'mc',kind:'Tu decisión',scene:'Tu equipo pone una tarima frente a la salida de atrás “solo por hoy”.',q:'¿Qué haces?',\n    opts:['La dejo, es solo por hoy','La muevo si puedo hacerlo sin peligro, o le aviso a mi líder de inmediato','Le pego un letrero que diga “Salida bloqueada”'],a:1,\n    why:'Las rutas de salida deben estar libres todo el tiempo. Un incendio no va a esperar hasta mañana.'}\n ]},\n {id:'l3',title:'Cuando suena la alarma',icon:'bell',steps:[\n  {t:'rush',secs:8,q:'Suena la alarma. Vas a la mitad de un trabajo. ¿Qué haces primero?',\n    opts:['Termino el trabajo, solo es un minuto','Paro, dejo mis cosas y me voy a la salida segura más cercana','Espero a ver si es solo un simulacro'],a:1,\n    why:'Cada segundo cuenta. Trata cada alarma como real. Tus cosas se pueden reponer. Tú no.'},\n  {t:'map',q:'Sal del edificio.',why:'Nunca camines hacia el humo y nunca uses el elevador. Usa tu otra salida y luego ve directo al punto de reunión para que te cuenten.'},\n  {t:'swipe',q:'¿Hazlo o no lo hagas? Clasifica cada acción.',left:'Hazlo',right:'No lo hagas',items:[\n    ['Cerrar las puertas detrás de ti','door',0],['Usar el elevador','x',1],['Regresar por tu teléfono','x',1],\n    ['Ayudar a un visitante a encontrar la salida','users',0],['Agacharte bajo el humo','run',0],['Irte a tu casa en el carro desde el estacionamiento','x',1]],\n    why:'Cierra puertas, agáchate y ayuda a otros a salir. Nunca uses elevadores, nunca regreses y nunca te vayas antes de que te cuenten.'}\n ]},\n {id:'l4',title:'No toda emergencia es un incendio',icon:'storm',steps:[\n  {t:'tiles',pose:'talk',say:'Pon atención a la alarma o al aviso. Algunas emergencias significan <b>salir<\/b>. Otras significan <b>quedarse adentro<\/b>.',tiles:[\n    {icon:'storm',c:'',b:'Tornado',s:'Ve a un cuarto interior en el piso más bajo. Aléjate de las ventanas.'},\n    {icon:'home',c:'o',b:'Nube química afuera',s:'Quédate adentro. Cierra puertas y ventanas. Apaga ventiladores y ventilas de aire.'},\n    {icon:'quake',c:'p',b:'Sismo',s:'Agáchate, cúbrete y sujétate hasta que deje de temblar.'},\n    {icon:'run',c:'g',b:'Tirador activo',s:'Corre si puedes. Escóndete si no puedes. Pelea solo como último recurso.'}]},\n  {t:'match',q:'Relaciona cada emergencia con lo que debes hacer.',pairs:[['Incendio','Salir por la salida segura más cercana'],['Alerta de tornado','Cuarto interior, piso más bajo'],['Nube química afuera','Quedarse adentro y sellar'],['Sismo','Agáchate, cúbrete y sujétate'],['Un compañero se desmaya','Llamar al 911 y traer el DEA']],\n    why:'La alarma o el aviso de tu lugar de trabajo te dice cuál es. ¿No estás seguro? Sigue a las personas que dirigen el plan.'}\n ]},\n {id:'l5',title:'Que te cuenten',icon:'flag',steps:[\n  {t:'mc',kind:'Tu decisión',scene:'Estás en el punto de reunión. Marco no está. Crees que estaba en la bodega de atrás.',q:'¿Qué haces?',\n    opts:['Regreso corriendo a buscarlo','Le aviso al encargado de inmediato y le digo dónde lo vi por última vez','Le mando un mensaje y espero'],a:1,\n    why:'Los bomberos necesitan esa información, y tienen el equipo para entrar de forma segura. Si tú regresas, ahora tienen que salvar a dos personas.'},\n  {t:'order',q:'Pon los pasos en orden, desde la alarma hasta que ya es seguro regresar.',items:['Deja de trabajar','Avisa a la gente cerca de ti','Sal por la salida segura más cercana','Ve al punto de reunión','Repórtate para el conteo','Espera el aviso de que ya es seguro'],\n    why:'Para, avisa, sal, reúnete, repórtate, espera. No regreses hasta que alguien a cargo diga que ya es seguro.'},\n  {t:'plan',q:'Haz tu tarjeta del plan.',sub:'Llena lo que sabes. ¿No estás seguro? Pregúntale a tu supervisor. Eso también es parte del plan. Solo se guarda en este dispositivo.'},\n  {t:'pledge',say:'¡Lo último! Mantén presionado el botón para hacer tu promesa.',promise:'Conozco mis dos salidas. Voy a salir al oír la alarma y siempre me voy a reportar.'}\n ]},\n {id:'final',title:'Prueba final',icon:'trophy',final:1,pass:4,steps:[\n  {t:'blank',q:'Completa las tres cosas que debes recordar.',parts:[0,' tu salida.',1,' al oír la alarma.',2,' para que te cuenten.'],answer:['Conoce','Sal','Preséntate'],bank:['Conoce','Sal','Preséntate','Espera','Escóndete'],\n    why:'Conoce tu salida. Sal al oír la alarma. Preséntate para que te cuenten.'},\n  {t:'mc',q:'¿Puedes usar el elevador durante un incendio?',opts:['Sí, si está cerca','No, usa las escaleras','Solo desde un piso alto'],a:1,noShuffle:1,why:'Los elevadores se pueden parar o abrirse justo donde está el fuego. Siempre usa las escaleras.'},\n  {t:'mc',q:'Suena una alerta de tornado. ¿A dónde vas?',opts:['Al estacionamiento','A un cuarto interior en el piso más bajo','Junto a una ventana grande para ver'],a:1,noShuffle:1,why:'Cuarto interior, piso más bajo, lejos de las ventanas.'},\n  {t:'mc',kind:'Tu decisión',scene:'Estás a salvo en el punto de reunión. Dejaste tu teléfono en tu escritorio.',q:'¿Qué haces?',opts:['Entro corriendo y lo agarro rápido','Me quedo ahí hasta que digan que es seguro','Le pido a un compañero que lo traiga'],a:1,\n    why:'Nunca regreses hasta que digan que es seguro. Un teléfono se puede reponer.'},\n  {t:'mc',q:'Las puertas de salida deben…',opts:['Estar cerradas con cadena en la noche','Abrirse desde adentro sin llave','Servir para guardar cosas cuando hay mucho trabajo'],a:1,noShuffle:1,why:'Las puertas de salida siempre se deben abrir desde adentro sin llave ni herramientas.'}\n ]}\n];\n\n/* ============ State (per learner, this device) ============ */\nconst KEY=COURSE.id+'-v1';\nconst def=()=>({xp:0,done:{},streak:0,lastDay:'',name:'',mute:false,seen:false,passed:false,passedOn:''});\nlet S=(()=>{try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v)return Object.assign(def(),v)}catch(e){}return def()})();\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};\nconst app=document.getElementById('app');\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nconst dayStr=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();\nconst reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n/* ============ Sound (tiny Web Audio chimes, after a tap only) ============ */\nlet AC=null;\nfunction tone(seq){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;\n  seq.forEach(([f,t,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+t);g.gain.linearRampToValueAtTime(.18,t0+t+.01);g.gain.exponentialRampToValueAtTime(.001,t0+t+d);o.connect(g).connect(AC.destination);o.start(t0+t);o.stop(t0+t+d+.05)})}catch(e){}}\nconst sfx={good:()=>tone([[660,0,.15],[990,.09,.25]]),bad:()=>tone([[220,0,.22,'triangle'],[180,.1,.25,'triangle']]),tap:()=>tone([[520,0,.06]]),win:()=>tone([[523,0,.2],[659,.12,.2],[784,.24,.2],[1047,.36,.4]])};\n\n/* ============ Map ============ */\nfunction curIndex(){const i=LESSONS.findIndex(l=>!S.done[l.id]);return i}\nfunction hud(){\n  return `<div class=\"hud band\"><div class=\"name\">${esc(COURSE.title)}<\/div>\n    <div class=\"pill\" title=\"Day streak\">${flameSvg}<span>${S.streak}<\/span><span class=\"sr\">días de racha<\/span><\/div>\n    <div class=\"pill\" title=\"XP\">${boltSvg}<span>${S.xp}<\/span><span class=\"sr\">XP<\/span><\/div>\n    <button class=\"iconbtn\" id=\"muteBtn\" aria-label=\"${S.mute?'Activar sonido':'Silenciar sonido'}\">${ico(S.mute?'mute':'sound')}<\/button><\/div>`;\n}\nfunction bindHud(){const m=document.getElementById('muteBtn');if(m)m.onclick=()=>{S.mute=!S.mute;save();renderMap()}}\nfunction renderMap(){\n  if(!S.seen)return renderWelcome();\n  const ci=curIndex(), doneN=LESSONS.filter(l=>S.done[l.id]).length, pct=doneN/LESSONS.length;\n  const offs=[0,62,74,10,-60,-10];\n  let nodes='';\n  LESSONS.forEach((l,i)=>{\n    const st=S.done[l.id]?'done':(i===ci?'cur':(ci===-1?'done':'lock'));\n    const icon=st==='lock'?(l.final?'trophy':'lock'):(st==='done'&&!l.final?'check':l.icon);\n    nodes+=`<div style=\"transform:translateX(${offs[i%offs.length]}px);position:relative\">\n      <button class=\"node ${st==='lock'?'':st} ${l.final?'final':''}\" data-i=\"${i}\" aria-label=\"${esc(l.title)}${st==='lock'?' (bloqueada)':st==='done'?' (lista)':''}\">\n        ${st==='cur'?`<span class=\"start\">${i===0&&!doneN?'Empezar':'Siguiente'}<\/span>`:''}${ico(icon,2.6)}<\/button>\n      <div class=\"nodelabel\">${esc(l.title)}<\/div>${i===(ci===-1?LESSONS.length-1:ci)?`<div class=\"pathlottie lottie\" style=\"${offs[i%offs.length]>0?'right:96px':'left:96px'}\">${lottie(ci===-1?'love':'hello')}<\/div>`:''}<\/div>`;\n  });\n  app.innerHTML=`${hud()}\n  <div class=\"band\" style=\"padding-block:4px 0\">\n    <div class=\"unit\"><small>Seguridad en el trabajo · ${COURSE.minutes} min<\/small><h1>${esc(COURSE.title)}<\/h1>\n      <div class=\"meta\">${doneN} de ${LESSONS.length} listas<\/div>\n      <svg class=\"ring\" viewBox=\"0 0 56 56\" aria-hidden=\"true\"><circle cx=\"28\" cy=\"28\" r=\"23\" fill=\"none\" stroke=\"rgba(255,255,255,.3)\" stroke-width=\"7\"/><circle cx=\"28\" cy=\"28\" r=\"23\" fill=\"none\" stroke=\"#fff\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-dasharray=\"${(144.5*pct).toFixed(1)} 200\" transform=\"rotate(-90 28 28)\"/><text x=\"28\" y=\"33\" text-anchor=\"middle\" font-family=\"Fredoka,sans-serif\" font-weight=\"600\" font-size=\"15\" fill=\"#fff\">${Math.round(pct*100)}%<\/text><\/svg>\n    <\/div>\n    <div class=\"motto\" aria-label=\"Tres cosas para recordar\">${COURSE.motto.map(m=>`<span>${m}<\/span>`).join('')}<\/div>\n  <\/div>\n  <div class=\"band\"><div class=\"path\" id=\"path\">${nodes}<\/div><\/div>\n  ${S.passed?`<div class=\"band\" style=\"padding-block:0 28px\"><button class=\"btn sea\" id=\"seeBadge\">Ver mi insignia<\/button><\/div>`:''}`;\n  bindHud();\n  app.querySelectorAll('.node').forEach(b=>b.onclick=()=>openSheet(+b.dataset.i));\n  const sb=document.getElementById('seeBadge');if(sb)sb.onclick=renderBadge;\n  window.scrollTo(0,0);\n}\nfunction lessonMins(l){return Math.max(1,Math.round(l.steps.length*18/60))}\nfunction openSheet(i){\n  const l=LESSONS[i], ci=curIndex(), locked=ci!==-1&&i>ci, done=!!S.done[l.id];\n  const sc=document.createElement('div');sc.className='scrim';\n  sc.innerHTML=`<div class=\"sheet band\" role=\"dialog\" aria-label=\"${esc(l.title)}\">\n    <div class=\"kicker\">${l.final?'Prueba final':'Lección '+(i+1)}<\/div>\n    <h2>${esc(l.title)}<\/h2>\n    <div class=\"meta\">${locked?'Termina las lecciones anteriores para desbloquear esta.':(l.final?`${l.steps.length} preguntas · necesitas ${l.pass} correctas para ganar tu insignia`:`Unos ${lessonMins(l)} min · ${l.steps.length} pasos`)}<\/div>\n    ${locked?`<button class=\"btn\" disabled>${ico('lock')} Bloqueada<\/button>`:`<button class=\"btn\" id=\"go\">${done?'Practicar otra vez':(l.final?'Hacer la prueba final':'Empezar lección')}<\/button>`}\n    <button class=\"link\" id=\"cl\">Cerrar<\/button><\/div>`;\n  document.body.appendChild(sc);\n  const close=()=>sc.remove();\n  sc.onclick=e=>{if(e.target===sc)close()};\n  sc.querySelector('#cl').onclick=close;\n  const g=sc.querySelector('#go');if(g){g.onclick=()=>{close();startLesson(i)};g.focus()}\n}\nfunction renderWelcome(){\n  app.innerHTML=`<div class=\"center band\">\n    <div class=\"lottie\" style=\"width:220px\">${lottie('hello')}<\/div>\n    <div class=\"kicker\">Seguridad en el trabajo · unos ${COURSE.minutes} minutos<\/div>\n    <h1 style=\"font-size:34px\">${esc(COURSE.title)}<\/h1>\n    <p class=\"sub\" style=\"max-width:34ch\">${COURSE.intro}<\/p>\n    <div class=\"motto\">${COURSE.motto.map(m=>`<span>${m}<\/span>`).join('')}<\/div>\n    <div style=\"width:100%;margin-top:8px\"><button class=\"btn\" id=\"go\">¡Vamos!<\/button><\/div><\/div>`;\n  document.getElementById('go').onclick=()=>{S.seen=true;save();sfx.tap();renderMap()};\n}\n\n/* ============ Lesson player ============ */\nlet P=null;\nfunction startLesson(i){\n  const L=LESSONS[i];\n  P={i,L,queue:L.steps.map((s,k)=>Object.assign({},s,{k})),total:L.steps.length,doneN:0,xp:0,first:0,right:0,qs:L.steps.filter(s=>!['video','talk','tiles','flip','triangle','plan','pledge'].includes(s.t)).length,combo:0,best:0,missed:new Set()};\n  renderStep();\n}\nfunction renderStep(){\n  if(!P.queue.length)return finishLesson();\n  const st=P.queue[0];\n  app.innerHTML=`<div class=\"ptop band\">\n      <button class=\"iconbtn\" id=\"quit\" aria-label=\"Salir de la lección\">${ico('x',2.6)}<\/button>\n      <div class=\"bar\" role=\"progressbar\" aria-valuemin=\"0\" aria-valuemax=\"${P.total}\" aria-valuenow=\"${P.doneN}\"><i style=\"width:${(P.doneN/P.total*100).toFixed(1)}%\"><\/i><\/div>\n      <div class=\"combo\" aria-live=\"polite\">${P.combo>=2?flameInline()+P.combo:''}<\/div><\/div>\n    <div class=\"stage band\" id=\"stage\"><\/div>\n    <div class=\"foot band\" id=\"foot\"><\/div>`;\n  document.getElementById('quit').onclick=askQuit;\n  const stage=document.getElementById('stage'), foot=document.getElementById('foot');\n  if(st.retry)stage.insertAdjacentHTML('beforeend',`<div class=\"kicker\" style=\"color:var(--flame)\">Intentemos esta otra vez<\/div>`);\n  const T=TYPES[st.t];\n  P.cur={st,api:null};\n  P.cur.api=T(st,stage,ready=>setReady(ready));\n  if(P.cur.api.info){foot.innerHTML=`<button class=\"btn\" id=\"cont\">${P.cur.api.label||'Continuar'}<\/button>`;\n    const b=document.getElementById('cont');b.disabled=!!P.cur.api.locked;b.onclick=()=>{sfx.tap();advance(true,true)};}\n  else if(P.cur.api.auto){foot.innerHTML=`<button class=\"btn\" id=\"chk\" disabled>${P.cur.api.label||'Revisar'}<\/button>${P.cur.api.extra||''}`;P.cur.api.bindFoot&&P.cur.api.bindFoot(foot)}\n  else{foot.innerHTML=`<button class=\"btn\" id=\"chk\" disabled>Revisar<\/button>`;document.getElementById('chk').onclick=check}\n  window.scrollTo(0,0);\n}\nfunction flameInline(){return `<span style=\"display:inline-block;width:18px;vertical-align:-3px\">${flameSvg}<\/span>`}\nfunction setReady(r){const b=document.getElementById('chk')||document.getElementById('cont');if(b)b.disabled=!r}\nfunction check(){const res=P.cur.api.check();feedback(res.ok,res.why)}\nfunction feedback(ok,why){\n  const st=P.cur.st, foot=document.getElementById('foot');\n  let gained=0;\n  if(ok){P.combo++;P.best=Math.max(P.best,P.combo);P.right++;if(!st.retry&&!P.missed.has(st.k)){P.first++;gained=10}else gained=5;\n    if(P.combo>=3)gained+=5;P.xp+=gained;sfx.good();flyXp(gained)}\n  else{P.combo=0;P.missed.add(st.k);sfx.bad()}\n  const comboMsg=ok&&P.combo>=3?`${P.combo} seguidas. ¡Bono de combo!`:'';\n  const pose=ok?(P.combo>=5?'love':P.combo>=3?'party':'happy'):'calm';\n  const head=ok?pick(['¡Bien!','¡Lo lograste!','¡Eso es!','¡Buen ojo!','¡Exacto!']):pick(['No exactamente.','¡Casi!','Buen intento.']);\n  foot.className='foot band '+(ok?'good':'bad');\n  foot.innerHTML=`<div class=\"fb\"><div class=\"lottie\">${lottie(pose)}<\/div><div><h3>${head}<\/h3><p class=\"fbtext\">${comboMsg?esc(comboMsg)+' ':''}${why||''}<\/p><\/div><\/div>\n    <button class=\"btn ${ok?'good':'bad'}\" id=\"cont\">${ok?'Continuar':'Entendido'}<\/button>`;\n  const c=document.getElementById('cont');c.focus();c.onclick=()=>advance(ok);\n  const cb=document.querySelector('.combo');if(cb)cb.innerHTML=P.combo>=2?flameInline()+P.combo:'';\n  if(!ok){const s=document.getElementById('stage');s.classList.add('shake');}\n}\nfunction pick(a){return a[Math.floor(Math.random()*a.length)]}\nfunction flyXp(n){if(reduced)return;const d=document.createElement('div');d.className='xpfly';d.textContent='+'+n+' XP';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}\nfunction advance(ok,info){\n  const st=P.queue.shift();\n  if(ok||P.L.final){P.doneN++}\n  else{P.queue.push(Object.assign({},st,{retry:1}))}\n  if(info&&st.t!=='video'){}\n  renderStep();\n}\nfunction askQuit(){\n  const sc=document.createElement('div');sc.className='scrim';\n  sc.innerHTML=`<div class=\"sheet band\" role=\"dialog\" aria-label=\"Salir de la lección\"><div style=\"display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:center\"><div class=\"lottie\">${lottie('think')}<\/div><div><h2 style=\"font-size:22px\">¿Salir de esta lección?<\/h2><p class=\"sub\">Vas a perder tu avance en esta lección.<\/p><\/div><\/div>\n    <button class=\"btn\" id=\"stay\">Seguir<\/button><button class=\"link\" id=\"leave\" style=\"color:var(--bad)\">Salir de la lección<\/button><\/div>`;\n  document.body.appendChild(sc);\n  sc.querySelector('#stay').onclick=()=>sc.remove();\n  sc.querySelector('#leave').onclick=()=>{sc.remove();P=null;renderMap()};\n}\nfunction finishLesson(){\n  const L=P.L, acc=P.qs?Math.round(P.first/P.qs*100):100;\n  if(L.final){\n    const firstTry=P.first, pass=firstTry>=L.pass;\n    if(!pass){\n      app.innerHTML=`<div class=\"center band\"><div class=\"lottie\" style=\"width:200px\">${lottie('calm')}<\/div>\n        <h1 style=\"font-size:28px\">¡Casi lo logras!<\/h1><p class=\"sub\" style=\"max-width:32ch\">Acertaste ${firstTry} de ${P.qs}. Necesitas ${L.pass} para aprobar. Repasa y vuelve a intentarlo.<\/p>\n        <div class=\"row2\"><button class=\"btn\" id=\"again\">Intentar otra vez<\/button><button class=\"btn ghost\" id=\"map\">Volver a las lecciones<\/button><\/div><\/div>`;\n      document.getElementById('again').onclick=()=>startLesson(P.i);\n      document.getElementById('map').onclick=renderMap;r e(f);else c.remove()})();}\n\n/* ============ Badge ============ */\nlet DL=null;\ntry{window.claude?.use?.('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}\nfunction fmtDate(iso){try{return new Date(iso||Date.now()).toLocaleDateString('es',{year:'numeric',month:'short',day:'numeric'})}catch(e){return ''}}\nasync function drawBadge(name){\n  const cv=document.getElementById('badgeCanvas'), x=cv.getContext('2d'), W=1080;\n  try{await Promise.all([document.fonts.load('700 64px Fredoka'),document.fonts.load('600 40px Fredoka'),document.fonts.load('800 30px Nunito')])}catch(e){}\n  const g=x.createLinearGradient(0,0,0,W);g.addColorStop(0,'#24A9D4');g.addColorStop(1,'#0C5E80');x.fillStyle=g;x.fillRect(0,0,W,W);\n  x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=5;[[120,240,30],[960,180,22],[900,640,40],[160,700,18],[980,880,16],[90,930,26]].forEach(([a,b,r])=>{x.beginPath();x.arc(a,b,r,0,7);x.stroke()});\n  x.fillStyle='#fff';x.textAlign='center';x.font='600 40px Fredoka, Nunito, sans-serif';x.fillText('CURSO COMPLETO',540,120);\n  // scalloped medallion\n  const cx=540,cy=440;x.beginPath();for(let i=0;i<=72;i++){const t=i/72*Math.PI*2,r=i%2?300:318;x.lineTo(cx+r*Math.cos(t),cy+r*Math.sin(t))}x.closePath();x.fillStyle='#FFC83D';x.fill();x.lineWidth=10;x.strokeStyle='#D99A12';x.stroke();\n  x.beginPath();x.arc(cx,cy,258,0,7);x.fillStyle='#FFF4F7';x.fill();x.lineWidth=8;x.strokeStyle='#FAD3DF';x.stroke();\n  // Lottie\n  const svg=axo(Object.assign({},POSE.badge,{still:1,shadow:'rgba(30,60,80,.18)'})).replace('<svg ','<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"488\" height=\"432\" ');\n  await new Promise(res=>{const im=new Image();im.onload=()=>{x.drawImage(im,cx-250,cy-235,500,443);res()};im.onerror=res;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});\n  // ribbon\n  const ry=730;x.fillStyle='#C2416A';x.beginPath();x.moveTo(110,ry+20);x.lineTo(200,ry+20);x.lineTo(200,ry+130);x.lineTo(110,ry+130);x.lineTo(150,ry+75);x.closePath();x.fill();\n  x.beginPath();x.moveTo(970,ry+20);x.lineTo(880,ry+20);x.lineTo(880,ry+130);x.lineTo(970,ry+130);x.lineTo(930,ry+75);x.closePath();x.fill();\n  x.fillStyle='#EE5F8A';x.beginPath();x.roundRect?x.roundRect(170,ry,740,120,20):x.rect(170,ry,740,120);x.fill();\n  x.fillStyle='#fff';x.font='700 64px Fredoka, Nunito, sans-serif';x.fillText(COURSE.title,540,ry+82,700);\n  x.font='700 56px Fredoka, Nunito, sans-serif';x.fillText(name||'Pro de la seguridad',540,940,960);\n  x.font='800 30px Nunito, sans-serif';x.fillStyle='rgba(255,255,255,.88)';x.fillText(`${fmtDate(S.passedOn)}  ·  ${S.xp} XP  ·  ${COURSE.motto.join('. ')}.`,540,996,1000);\n  return cv;\n}\nasync function renderBadge(){\n  app.innerHTML=`<div class=\"center band\" style=\"justify-content:flex-start\">\n    <div class=\"kicker\">Tu insignia<\/div><h1 style=\"font-size:28px\">¡Preséntala!<\/h1>\n    <img class=\"badgeimg\" id=\"bimg\" alt=\"${esc(COURSE.title)}: insignia del curso con Lottie y una medalla de oro\">\n    <div class=\"field\"><label for=\"bname\">Nombre en tu insignia<\/label><input id=\"bname\" maxlength=\"28\" placeholder=\"Tu nombre\" value=\"${esc(S.name)}\" autocomplete=\"given-name\"><\/div>\n    <div class=\"row2\"><button class=\"btn\" id=\"save\">Guardar imagen de la insignia<\/button><button class=\"btn sea\" id=\"copy\">Copiar mensaje para compartir<\/button><button class=\"btn ghost\" id=\"back\">Volver al curso<\/button><\/div>\n    <p class=\"note\" id=\"bnote\" aria-live=\"polite\"><\/p>\n    <textarea id=\"sharetxt\" class=\"sr\" readonly><\/textarea><\/div>`;\n  const img=document.getElementById('bimg'), inp=document.getElementById('bname'), note=document.getElementById('bnote');\n  const shareText=()=>COURSE.share;\n  let tmr;const redraw=async()=>{const cv=await drawBadge(inp.value.trim());img.src=cv.toDataURL('image/png')};\n  inp.oninput=()=>{S.name=inp.value.trim();save();clearTimeout(tmr);tmr=setTimeout(redraw,250)};\n  await redraw();\n  if(!DL)note.textContent='Consejo: mantén presionada la insignia para guardarla en tu teléfono.';\n  document.getElementById('save').onclick=async()=>{\n    if(!DL){note.textContent='Mantén presionada la imagen de la insignia para guardarla.';return}\n    const cv=await drawBadge(inp.value.trim());\n    cv.toBlob(async b=>{try{await DL.save({filename:COURSE.id+'-badge.png',data:b});note.textContent='Insignia guardada.'}\n      catch(e){note.textContent=e&&e.code==='declined'?'No se guardó.':'Aquí no se puede guardar. Mantén presionada la insignia para guardarla.'}},'image/png');\n  };\n  document.getElementById('copy').onclick=()=>{const t=shareText();\n    const done=()=>note.textContent='Copiado. Pégalo junto con la imagen de tu insignia.';\n    try{navigator.clipboard.writeText(t).then(done,()=>{const ta=document.getElementById('sharetxt');ta.value=t;ta.classList.remove('sr');ta.select();note.textContent='Selecciona y copia el mensaje de arriba.'})}catch(e){}\n  };\n  document.getElementById('back').onclick=renderMap;\n  sfx.tap();\n}\n\n/* ============ Boot ============ */\nrenderMap();\nif(reduced)setTimeout(()=>document.querySelectorAll('svg').forEach(s=>{s.querySelectorAll('animateTransform').forEach(a=>{/1 [.]08/.test(a.getAttribute('values')||'')&&a.remove()});s.pauseAnimations&&s.pauseAnimations()}),50);\n<\/script>\n\n<\!--LAKE-START-->\n<style id=\"lake-css\">\n/* ============ Lottie's Lake theme (shared by all 10 off-the-shelf courses) ============\n   Source of truth: LMS/brand/lottie-lake-style-sheet.html. Injected after each course's own CSS by _lake/lake.py.\n   Colors: Lottie pinks, lake teals, bubble blues; Sunny only for wins; Hazard orange only for real danger.\n   Shapes: uneven round corners, no outlines, one shine streak, soft teal-tinted shadows, wet-pebble buttons. */\n:root{\n  --bg:#EAF7F4; --surface:#FFFFFF; --ink:#1D3540; --muted:#557079; --line:#D3EAE8;\n  --pink:#D2557A; --pinkD:#B23F64; --pinkSoft:#FFE8EF;\n  --sea:#1C9C9A; --seaD:#137F7E; --seaSoft:#DDF4F1;\n 0)],f=v=>v.toFixed(1);\n  const step=(a1-a0)/N;let out='',edge='';\n  for(let i=0;i<N;i++){const s=a0+i*step,e=s+step,[x1,y1]=pt(s,R),[x2,y2]=pt(e,R),[qx,qy]=pt(s+step/2,R+13);\n    edge+=(i?'':`M${f(x1)},${f(y1)}`)+` Q${f(qx)},${f(qy)} ${f(x2)},${f(y2)}`;\n    if(i){const g=s,[gx,gy]=pt(g,R-4),[lx,ly]=pt(g-2.6,R*.42),[rx,ry]=pt(g+2.6,R*.42);\n      out+=`<path d=\"M${f(lx)},${f(ly)} L${f(gx)},${f(gy)} L${f(rx)},${f(ry)} Z\" fill=\"${sd}\" opacity=\".42\" stroke=\"${sd}\" stroke-opacity=\".42\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>`}}\n  const [sx,sy]=pt(a0,R);\n  const base=`<path d=\"M${cx},${cy} L${f(sx)},${f(sy)}${edge.replace(/^M\\S+/,'')} Z\" fill=\"${sh}\" stroke=\"${sh}\" stroke-width=\"3\" stroke-linejoin=\"round\"/>`;\n  const [hx,hy]=pt(-125,R-6);\n  return base+out+`<path d=\"M${f(hx-8)},${f(hy+10)} Q${f(hx)},${f(hy-6)} ${f(hx+16)},${f(hy-12)}\" stroke=\"#fff\" stroke-width=\"4\" stroke-linecap=\"round\" fill=\"none\" opacity=\".55\"/><path d=\"M38,98 Q60,90 82,98 L86,108 Q86,113 80,113 L40,113 Q34,113 34,108 Z\" fill=\"${sd}\"/><path d=\"M44,104 L76,104\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" opacity=\".35\"/>`;\n}\nconst PP={pink:['#FFD9E4','#E8919F','#FFF6F9','#F4CAD7'],gold:['#FFD9E4','#E8919F','#FFE08A','#FFC83D']};\nfunction pearlBadge(golden,attrs){const [sh,sd,p,ps]=PP[golden?'gold':'pink'];return `<svg viewBox=\"-6 16 132 102\" role=\"img\" aria-label=\"${golden?'Perla dorada':'Perla del curso'} de ${esc(COURSE.title)}\" ${attrs||''}>${fan(sh,sd)}${pearlSvgBits(60,72,25,p,ps,iconSvg())}<\/svg>`}\nconst shellSvg=`<svg viewBox=\"16 14 96 92\" aria-hidden=\"true\"><path d=\"M20,96 C10,70 22,30 58,18 C88,8 110,30 106,58 C102,84 82,100 56,102 C40,104 28,102 20,96Z\" fill=\"#5EC8FF\"/><path d=\"M58,92 C36,92 28,72 34,56 C40,40 58,34 72,40 C86,46 88,64 78,74 C70,82 56,80 52,70\" stroke=\"#2FA6E0\" stroke-width=\"9\" stroke-linecap=\"round\" fill=\"none\"/><\/svg>`;\nflameInline=function(){return `<span class=\"shellin x=\"23\" ry=\"20\" fill=\"#A9E3FF\"/><path d=\"M66,104 Q85,110 104,104 M68,117 Q85,123 102,117\" stroke=\"#5EC8FF\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/>\n  <path d=\"M58,52 C58,32 70,22 85,22 C100,22 112,32 112,52Z\" fill=\"#fff\"/><rect x=\"52\" y=\"48\" width=\"66\" height=\"8\" rx=\"4\" fill=\"#DCE9EC\"/><rect x=\"81.5\" y=\"21\" width=\"7\" height=\"30\" rx=\"3.5\" fill=\"#DCE9EC\"/>\n  ${feye(72,74,1)}${feye(98,74,1)}<path d=\"M78,90 Q85,96 92,90\" stroke=\"${INK}\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"/>${fcheek(61,88)}${fcheek(109,88)}<\/g><\/svg>`;\nconst FRIEND={\n  shelby:{who:'Shelby dice',svg:(window.LAKE_HOSTS&&LAKE_HOSTS.shelby.svg)||SHELBY,types:['order','loto','mn','plan','build','pass','cooldown','breather','sim','tempo'],\n    lines:['Despacio y sin parar. Pon cada paso en su orden.','Un paso a la vez. Sin atajos.','Manos con cuidado, pasos con cuidado. Tómate tu tiempo.']},\n  cruz:{who:'Cruz, líder de equipo',svg:(window.LAKE_HOSTS&&LAKE_HOSTS.cruz.svg)||CRUZ,types:['spot','multi','explore','tabhunt','zone','dress','scan','meter'],\n    lines:['Mira arriba, mira abajo, mira a tu alrededor.','¿Ves un peligro? Avísale a tu líder.','Mira bien antes de seguir.']}\n};\n/* Soft skills courses (LAKE.soft): friends talk about people, not hazards. */\nif(LAKE.soft){\n  FRIEND.shelby.types=['order','mn','breathe','checkin','tone','sim','budget','sched'];\n  FRIEND.shelby.lines=['Ve despacio. Respira una vez antes de contestar.','Sin prisa. Léelo dos veces antes de mandarlo.','Los pasos pequeños también cuentan.'];\n  FRIEND.cruz.types=['multi','texts','post','bins','report'];\n  FRIEND.cruz.lines=['A todos nos ha pasado. Siempre hay una primera vez.','La neta: cómo lo dices importa tanto como lo que dices.','Piensa cómo se ve desde el otro lado.'];\n}\nfunction friendFor(st){\n  if(st.t==='mc'&&st.kind==='Tu decisión')return 'cruz';\n  for(const k in FRIEND)if(FRIEND[k].types.includes(st.t))return k;return null;\n}\n\n/* ---------- player: depth, friends, kind feedback ---------- */\nconst rsOld=renderStep;\nrenderStep=function(){\n  if(!P)return;\n  if(!P.queue.length)return finishLesson();\n  const st=P.queue[0];\n  setDepth(st.kind==='Tu decisión'||st.t==='stand'||st.t==='talkback'?'reeds':'shallow');\n  rsOld();\n  const stage=document.getElementById('stage');if(!stage)return;\n  stage.querySelectorAll('.kicker').forEach(k=>{if(/flame/.test(k.getAttribute('style')||'')){k.removeAttribute('style');k.classList.add('retry')}});\n  const f=P.friend!=null&&P.friend!==st.k?null:friendFor(st); /* one friend moment per lesson, so it stays fresh */\n  if(f){P.friend=st.k;const F=FRIEND[f];stage.insertAdjacentHTML('afterbegin',`<div class=\"friendtip\">${F.svg}<p><b>${F.who}<\/b>${F.lines[(st.k||0)%F.lines.length]}<\/p><\/div>`);\n    if(reduced||CALM)stage.querySelectorAll('.friendtip svg').forEach(s=>{s.querySelectorAll('animateTransform').forEach(a=>{/1 [.]08/.test(a.getAttribute('values')||'')&&a.remove()});s.pauseAnimations&&s.pauseAnimations()})}\n};\nfeedback=function(ok,why){\n  const st=P.cur.st, foot=document.getElementById('foot');\n  let gained=0;\n  if(ok){P.combo++;P.best=Math.max(P.best,P.combo);P.right++;if(!st.retry&&!P.missed.has(st.k)){P.first++;gained=10}else gained=5;\n    if(P.combo>=3)gained+=5;P.xp+=gained;sfx.good()}\n  else{P.combo=0;P.missed.add(st.k);sfx.bad()}\n  const comboMsg=ok&&P.combo>=3&&!CALM?`${P.combo} seguidas, bono de combo.`:'';\n  const head=ok?pick(CALM?['Correcto.','Así es.','Sí, eso es.']:['¡Bien!','¡Eso es!','¡Exacto!','¡Eso es!','¡Buen ojo!'])\n               :pick(CALM?['No exactamente.','Veamos otra vez.']:['No exactamente.','Casi.','Buen intento.']);\n  foot.className='foot band '+(ok?'good':'bad');\n  foot.innerHTML=`<div class=\"fb\"><div class=\"lottie\">${lottie(ok?'happy':'calm')}<\/div><div><h3>${head}${ok?`<span class=\"xpchip\">+${gained} XP<\/span>`:''}<\/h3><p class=\"fbtext\">${comboMsg?esc(comboMsg)+' ':''}${why||''}<\/p><\/div><\/div>\n    <button class=\"btn ${ok?'good':'bad'}\" id=\"cont\">${ok?'Continuar':'Entendido'}<\/button>`;\n  const c=document.getElementById('cont');c.focus();c.onclick=()=>advance(ok);\n  const cb=document.querySelector('.combo');if(cb)cb.innerHTML=P.combo>=2&&!CALM?flameInline()+P.combo:'';\n  if(!ok){const s=document.getElementById('stage');s&&s.classList.add('shake')}\n  else if(!CALM)bubbles(c,5); /* a small pop, not a party */\n};\n\n/* ---------- map, welcome ---------- */\nconst goalsList=()=>`<ul class=\"goallist\">${LAKE.goals.map(g=>`<li>${esc(g)}<\/li>`).join('')}<\/ul>`;\nhud=function(){\n  return `<div class=\"hud band\"><div class=\"name\">${esc(COURSE.title)}<\/div>\n    <div class=\"pill\" title=\"Day streak\">${shellSvg}<span>${S.streak}<\/span><span class=\"sr\">días de racha<\/span><\/div>\n    <div class=\"pill\" title=\"XP\">${boltSvg}<span>${S.xp}<\/span><span class=\"sr\">XP<\/span><\/div>\n    <button class=\"iconbtn\" id=\"muteBtn\" aria-label=\"${S.mute?'Activar sonido':'Silenciar sonido'}\">${ico(S.mute?'mute':'sound')}<\/button><\/div>`;\n};\nrenderWelcome=function(){\n  setDepth('shallow');\n  const intro=(COURSE.intro||COURSE.blurb||'').replace(/\\s*Short lessons[^.]*\\.\\s*$/,'');\n  app.innerHTML=`<div class=\"center band\">\n    <div class=\"lottie\" style=\"width:200px\">${lottie('hello')}<\/div>\n    <div class=\"kicker\">${LAKE.cat||'Seguridad en el trabajo'} · unos ${COURSE.minutes} minutos<\/div>\n    <h1 style=\"font-size:34px\">${esc(COURSE.title)}<\/h1>\n    <p class=\"sub\" style=\"max-width:36ch\">${intro}<\/p>\n    <div class=\"goalbox\"><h2>Al terminar, vas a poder:<\/h2>${goalsList()}<\/div>\n    <div class=\"motto\">${COURSE.motto.map(m=>`<span>${m}<\/span>`).join('')}<\/div>\n    <p class=\"note\">${LESSONS.length-1} lecciones cortas y una prueba final. Pasa la prueba para ganar tu perla y tu certificado.<\/p>\n    <div style=\"width:100%;margin-top:4px\"><button class=\"btn\" id=\"go\">Empezar el curso<\ s.js) ============\n   Fixed layout, changing art. --tt1 main, --tt3 deep, --ttsoft soft come from the course's color story. */\n.th-hero{position:relative;width:100%;aspect-ratio:16/10;max-height:250px;border-radius:var(--r1);overflow:hidden;margin:0 0 6px;box-shadow:0 10px 26px -14px var(--shadow);isolation:isolate}\n.th-scene{position:absolute;inset:0;width:100%;height:100%;display:block}\n.th-prop{position:absolute;bottom:35%;width:25%;transform:translateX(-50%);z-index:1}\n.th-prop svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 4px 0 rgba(29,53,64,.14))}\n.th-bob{animation:thbob 3.8s ease-in-out infinite;transform-origin:50% 100%}\n.th-bub{position:absolute;width:11%;transform:translateX(-50%);z-index:1;animation:thfloat 5s ease-in-out infinite}\n.th-bub svg{width:100%;height:auto;display:block}\n.th-host{position:absolute;bottom:7%;width:25%;transform:translateX(-50%);z-index:2}\n.th-host svg{width:100%;height:auto;display:block;overflow:visible}\n.th-lot{position:absolute;bottom:7%;width:38%;transform:translateX(-50%);z-index:3}\n.th-lot svg{width:100%;height:auto;display:block;overflow:visible}\n.th-calm .th-bob,.th-calm .th-bub{animation-duration:7s}\n@keyframes thbob{50%{transform:translateY(-4px)}}\n@keyframes thfloat{50%{transform:translate(-50%,-6px)}}\n@media (prefers-reduced-motion:reduce){.th-bob,.th-bub{animation:none}}\n/* color story on the welcome text: same spots, the course's own colors */\n.th-welcome .kicker{color:var(--tt3)}\n.th-welcome .goalbox{border-top:5px solid var(--tt1)}\n.th-welcome .goallist li::before{background-color:var(--tt3)}\n.th-welcome .motto span{color:var(--tt3);background:var(--ttsoft)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) .th-welcome .kicker,:root:not([data-theme=\"light\"]) .th-welcome .motto span{color:var(--ink)}\n  :root:not([data-theme=\"light\"]) .th-welcome .motto span{background:color-mix(in srgb,var(--tt1) 30%,var(--surface))}}\n:root[data-theme=\ g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return [h,s,l]}\nfunction hsl(h,s,l){h=((h%360)+360)%360;s=Math.max(0,Math.min(1,s));l=Math.max(0,Math.min(1,l));\n  const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));\n  return '#'+[f(0),f(8),f(4)].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('')}\nconst [h0,s0]=toHsl(hx(T.base)), H=h0+T.shift, SAT=Math.min(.62,Math.max(.32,s0))*(CALMT?.72:1);\n/* sky moods (2026-11-23, Jesse: more variety in skies, clouds and water). [top, bottom, sun, water hue, water light, clouds] */\nconst SKIES=[\n  ['#AEE3EC','#EAF9FA','#FFF1B8',186,.74,'wisp'], ['#BFDDF5','#FFE3D3','#FFE08A',200,.76,'puffy'],  ['#FFE6A8','#FFF7E0','#FFF6D0',176,.74,'few'],\n  ['#DCD3F5','#F4F0FC','#FFF4CF',208,.78,'puffy'], ['#CDEFE0','#EFFAF5','#FFF1B8',168,.74,'row'],   ['#F9D3DF','#FFF0F4','#FFE7A0',194,.79,'few'],\n  ['#8EC5EE','#D6ECFA','#FFF6D0',204,.70,'big'],   ['#D4CBF0','#FFE1D2','#FFF1B8',220,.74,'row'],   ['#FFB3A0','#FFE6B8','#FFF1B8',214,.70,'wisp'],\n  ['#E2F0BE','#F7FBEA','#FFF1B8',178,.74,'big'],   ['#E9E1CF','#F8F4EA','#FFE7A0',172,.76,'puffy']];\nconst NIGHTS=[['#22284F','#4A4F86',214,.38],['#3A2350','#7A4E86',236,.36],['#17383F','#356B6E',188,.34],['#2B2F5E','#8A5A7C',222,.40]];\nconst SK=T.dusk?NIGHTS[(T.sky||0)%NIGHTS.length]:SKIES[(T.sky||0)%SKIES.length];\nconst WH=T.dusk?SK[2]:SK[3], WLT=T.dusk?SK[3]:SK[4];\nconst PAL={\n  sky1:SK[0], sky2:SK[1], clouds:T.dusk?'none':SK[5],\n  sun:T.dusk?'#FFF4CF':SK[2],\n  far:hsl(H,SAT*.55,T.dusk?.40:.76), mid:hsl(H,SAT*.75,T.dusk?.34:.62), main:hsl(H,SAT,.5), deep:hsl(H,SAT*.85,.32),\n  water1:hsl(WH,.46,WLT), water2:hsl(WH+6,.48,WLT-.13), water3:hsl(WH+10,.5,WLT-.21),\n  wood:hsl(28,.42,.50), woodD:hsl(24,.42,.36), stone:hsl(H+190,.10,.80), stoneD:hsl(H+190,.12,.66), leaf:hsl(140,.42,.50), leafD:hsl(146,.45,.38),\n  soft:hsl(H,SAT*.8,.93)\n};\nconst root=document.documentElement;\nroot.style.setProperty('--tt1',PAL.main);root.style.setProp (70,66,.7,.8)+puff(250,60,.8,.85)+puff(318,52,.7,.8);\n  if(c==='big')return puff(10+sx*.3,20,1.5)+puff(248,40,1.1)+wisp(150,84,40,.5);\n  return '';\n}\nconst sunAt=()=>{if(T.dusk||T.setting==='flats'||!/few|wisp/.test(PAL.clouds))return '';const x=/rock|reeds/.test(T.setting)?64:[300,64,286,80,300,52,270,90,304,60,290][(T.sky||0)%11];return `<circle cx=\"${x}\" cy=\"40\" r=\"30\" fill=\"${PAL.sun}\" opacity=\".45\"/><circle cx=\"${x}\" cy=\"40\" r=\"20\" fill=\"${PAL.sun}\"/>`};\nconst _unused=(x,y,s=1)=>T.dusk?'':`<g transform=\"translate(${x} ${y}) scale(${s})\" opacity=\".9\"><path d=\"M0,16 C0,6 10,2 18,6 C22,-2 38,-2 42,8 C52,6 58,12 56,18 Z\" fill=\"#fff\"/><\/g>`;\nconst sunOrMoon=(x,y)=>T.dusk?`<circle cx=\"${x}\" cy=\"${y}\" r=\"17\" fill=\"#FFF4CF\"/><circle cx=\"${x+9}\" cy=\"${y-6}\" r=\"15\" fill=\"${PAL.sky1}\"/>${[[40,26],[96,52],[170,22],[230,44],[300,70]].map(([a,b])=>`<circle cx=\"${a}\" cy=\"${b}\" r=\"1.8\" fill=\"#fff\" opacity=\".8\"/>`).join('')}`\n  :`<circle cx=\"${x}\" cy=\"${y}\" r=\"20\" fill=\"${PAL.sun}\"/><circle cx=\"${x}\" cy=\"${y}\" r=\"30\" fill=\"${PAL.sun}\" opacity=\".35\"/>`;\nconst reed=(x,h,c)=>`<path d=\"M${x},${WL+6} C${x-2},${WL-h*.5} ${x+3},${WL-h*.8} ${x+1},${WL-h}\" stroke=\"${c}\" stroke-width=\"4\" stroke-linecap=\"round\" fill=\"none\"/>`;\nconst cattail=(x,h)=>reed(x,h,PAL.leafD)+`<rect x=\"${x-3}\" y=\"${WL-h-2}\" width=\"8\" height=\"20\" rx=\"4\" fill=\"${PAL.woodD}\"/>`;\nconst lily=(x,y,r,flower)=>`<path d=\"M${x},${y} m-${r},0 a${r},${r*.36} 0 1,0 ${r*2},0 a${r},${r*.36} 0 1,0 -${r*2},0Z\" fill=\"${PAL.leaf}\"/><path d=\"M${x},${y} L${x+r*.9},${y-r*.12} L${x+r*.9},${y+r*.12}Z\" fill=\"${PAL.water1}\"/>`+\n  (flower?`<g transform=\"translate(${x-r*.4} ${y-4})\"><path d=\"M0,0 C-6,-4 -6,-12 0,-16 C6,-12 6,-4 0,0Z\" fill=\"#F4A6BD\"/><path d=\"M0,0 C-10,-2 -14,-8 -10,-12 C-4,-10 -1,-5 0,0Z M0,0 C10,-2 14,-8 10,-12 C4,-10 1,-5 0,0Z\" fill=\"#FAD3DF\"/><\/g>`:'');\nconst post=(x,top,w=16)=>`<rect x=\"${x-w/2}\"
