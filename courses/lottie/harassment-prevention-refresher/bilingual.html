position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--pink);border:2px solid var(--line);font-family:var(--display);font-weight:600;font-size:14px;padding:4px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}\n.node .start::after{content:\"\";position:absolute;bottom:-7px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--surface);border-bottom:0}\n@keyframes bob{50%{transform:translate(-50%,-5px)}}\n.nodelabel{position:absolute;top:84px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap;text-align:center}\n.pathlottie{position:absolute;top:-22px;width:108px;pointer-events:none}\n\n/* Bottom sheet */\n.scrim{position:fixed;inset:0;background:rgba(10,25,35,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}\n.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:24px 24px 0 0;padding-top:22px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .25s ease-out}\n.sheet h2{font-size:24px}\n.sheet .meta{color:var(--muted);font-weight:700;font-size:14px}\n@keyframes up{from{transform:translateY(40px);opacity:0}}\n@keyframes fade{from{opacity:0}}\n\n/* Player */\n.ptop{display:flex;align-items:center;gap:12px;padding-block:14px 6px}\n.bar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}\n.bar i{display:block;height:100%;width:0;background:var(--good);border-radius:99px;transition:width .45s cubic-bezier(.3,1.3,.6,1);position:relative}\n.bar i::after{content:\"\";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}\n.combo{font-family:var(--display);font-weight:600;color:var(--flame);font-size:15px;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}\n.stage{flex:1;padding-block:14px 28px;display:flex;flex-direction:column;gap:16px}\n.kicker{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--sea)}\n.q{font-size:22px}\n.sub{color:var(--muted);font-size:15px}\n.foot{position:sticky;bottom:0;padding-top:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line);display:grid;gap:12px;z-index:4}\n.foot.good{background:var(--goodSoft);border-color:transparent}\n.foot.bad{background:var(--badSoft);border-color:transparent}\n.fb{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;animation:up .2s ease-out}\n.fb h3{font-size:22px}\n.foot.good h3,.foot.good .fbtext{color:var(--goodInk)}\n.foot.bad h3,.foot.bad .fbtext{color:var(--badInk)}\n.fbtext{font-size:15px;font-weight:700}\n.xpfly{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:30px;color:var(--gold);text-shadow:0 2px 0 var(--goldD);pointer-events:none;z-index:40;animation:fly 1s ease-out forwards}\n@keyframes fly{to{transform:translate(-50%,-80px);opacity:0}}\n\n/* Speech / learn */\n.talk{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:end}\n.bubble{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;position:relative;font-weight:700}\n.bubble::before{content:\"\";position:absolute;left:-10px;bottom:18px;border:9px solid transparent;border-right-color:var(--line);border-left:0}\n.bubble::after{content:\"\";position:absolute;left:-7px;bottom:19px;border:8px solid transparent;border-right-color:var(--surface);border-left:0}\n.tiles{display:grid;gap:10px}\n.tile{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px}\n.tile b{display:block;font-family:var(--display);font-weight:600;font-size:17px}\n.tile span{color:var(--muted);font-size:15px}\n.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--seaSoft);color:var(--sea)}\n.ic svg{width:26px;height:26px}\n.ic.p{background:var(--pinkSoft);color:var(--pink)}\n.ic.g{background:var(--goodSoft);color:var(--good)}\n.ic.o{background:var(--orangeSoft);color:var(--flame)}\n.big{font-family:var(--display);font-size:28px;font-weight:700;color:var(--pink);line-height:1.1}\n.rule{background:var(--surface);border:2px dashed var(--sea);border-radius:16px;padding:12px 14px;font-weight:700}\n.rule b{color:var(--sea)}\n\n\n/* Options */\n.opts{display:grid;gap:10px}\n.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 3px 0 var(--line);font-weight:700;font-size:16px;transition:transform .08s}\n.opt:active{transform:translateY(2px)}\n.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:14px;color:var(--muted)}\n.opt.sel{border-color:var(--sea);background:var(--seaSoft);box-shadow:0 3px 0 var(--sea)}\n.opt.sel .k{border-color:var(--sea);color:var(--sea)}\n.opt.right{border-color:var(--good);background:var(--goodSoft);box-shadow:0 3px 0 var(--good)}\n.opt.wrong{border-color:var(--bad);background:var(--badSoft);box-shadow:0 3px 0 var(--bad)}\n.opt:disabled{cursor:default}\n.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\n.pick{flex-direction:column;text-align:center;padding:10px 6px;gap:6px;font-size:14px}\n.pick svg{width:100%;height:auto;max-width:110px}\n\n/* Flip cards */\n.flips{display:grid;gap:12px}\n.flip{perspective:900px;border:0;background:none;padding:0;height:110px;width:100%}\n.flip .in{position:relative;height:100%;transition:transform .45s;transform-style:preserve-3d}\n.flip.on .in{transform:rotateX(180deg)}\n.flip .f,.flip .b{position:absolute;inset:0;border-radius:18px;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:12px 16px;backface-visibility:hidden;text-align:left}\n.flip .f{background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}\n.flip .f b{font-family:var(--display);font-size:24px;font-weight:600}\n.flip .f small{display:block;color:var(--muted);font-weight:700;font-size:13px}\n.flip .b{background:var(--sea);color:#fff;transform:rotateX(180deg);font-weight:700;font-size:15px;grid-template-columns:1fr}\n.flip .b b{font-family:var(--display);font-size:18px;display:block}\n\n/* Swipe cards */\n.deck{position:relative;height:250px;display:grid;place-items:center}\n.card{position:absolute;width:min(100%,300px);height:220px;background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);display:grid;place-items:center;align-content:center;gap:10px;padding:18px;text-align:center;font-weight:800;font-size:19px;touch-action:none;user-select:none;transition:transform .3s,opacity .3s}\n.card .ic{width:64px;height:64px;border-radius:18px}\n.card .ic svg{width:38px;height:38px}\n.card.back1{transform:translateY(10px) scale(.95);opacity:.7}\n.card.back2{transform:translateY(20px) scale(.9);opacity:.4}\n.card.res-good{border-color:var(--good);box-shadow:0 6px 0 var(--good)}\n.card.res-bad{border-color:var(--bad);box-shadow:0 6px 0 var(--bad)}\n.card .verdict{font-size:14px;font-weight:800}\n.swbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.swcount{text-align:center;color:var(--muted);font-weight:800;font-size:14px}\n\n/* Spot scene */\n.scene{position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--line);background:var(--wall);touch-action:manipulation}\n.scene svg{width:100%;height:auto;cursor:crosshair}\n.found{display:flex;flex-wrap:wrap;gap:8px}\n.found span{font-size:13px;font-weight:800;padding:5px 10px;border-radius:99px;border:2px dashed var(--line);color:var(--muted)}\n.found span.y{border-style:solid;border-color:var(--good);background:var(--goodSoft);color:var(--goodInk)}\n.ping{animation:ping .6s ease-out forwards;transform-box:fill-box;transform-origin:center}\n@keyframes ping{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}\n\n/* Order + blanks chips */\n.slots{display:grid;gap:8px}\n.slot{min-height:52px;border:2px dashed var(--line);border-radius:14px;display:flex;align-items:center;gap:10px;padding:6px 10px}\n.slot .n{font-family:var(--display);font-weight:600;color:var(--muted);width:20px;flex:none}\n.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}\n.chip{border:2px solid var(--line);background:var(--surface);border-radius:12px;box-shadow:0 3px 0 var(--line);padding:9px 14px;font-weight:800;font-size:15px}\n.chip.ghost{visibility:hidden}\n.chip.inslot{flex:1;text-align:left}\n.chip.right{border-color:var(--good);background:var(--goodSoft)}\n.chip.wrong{border-color:var(--bad);background:var(--badSoft)}\n.sentence{font-family:var(--display);font-weight:600;font-size:24px;line-height:2.1;text-align:center}\n.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--line);margin:0 4px;vertical-align:bottom;line-height:1.4}\n.blank .chip{font-family:var(--body);font-size:18px}\n\n/* Sort rows */\n.rows{display:grid;gap:10px}\n\n/* Ladder */\n.ladderbox{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px}\n.ladderbox svg{width:100%;height:auto}\n.range{width:100%;accent-color:var(--pink);height:32px}\n.readout{display:flex;justify-content:space-between;font-weight:800;font-variant-numeric:tabular-nums}\n\n/* Results */\n.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding-block:24px}\n.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}\n.stat{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}\n.stat small{display:block;font-fa harassment prevention + 1 hr bystander, annual          180 min seat time\n   CALM MODE. Any industry. Grade 8 or below. Young frontline audience.\n   Motto: Know it. Stop it. Report it.  Mnemonics: SAFE (if it happens to you), the 5 Ds (if you see it), LEAD (supervisors).\n\n   Legal sources (cite here, not on screen). HAVE EMPLOYMENT COUNSEL REVIEW STATE DETAILS BEFORE SALE; laws change yearly.\n   Federal: Title VII, ADEA, ADA, GINA, PWFA; EEOC Enforcement Guidance on Harassment in the Workplace (2024). EEOC charge: 180 days, 300 days where a state agency also covers it.\n   California: Gov. Code 12950.1 (SB 1343; 1 hr employees / 2 hrs supervisors every 2 years, within 6 months of hire or promotion; employers with 5+ employees),\n     2 CCR 11024 (required content: FEHA + Title VII definitions, statutes and case law, types of conduct, remedies, prevention strategies, supervisor duty to report,\n     practical examples incl. gender identity, gender expression and sexual orientation, limited confidentiality, resources for victims, duty to investigate,\n     what to do if a supervisor is accused, elements of an effective policy, abusive conduct; e-learning must let learners ask a trainer and get an answer within 2 business days).\n     Gov. Code 12923 (SB 1300: one incident can be enough; no need to show productivity dropped). Gov. Code 12940(j) (harassment by non-employees; individual liability).\n     Civil Rights Department (CRD): 3 years to file (AB 9). 800-884-1684, calcivilrights.ca.gov. Abusive conduct definition: Gov. Code 12950.1(h)(2).\n   New York: Labor Law 201-g (annual interactive training; model policy and training, 2023 update): explanation of sexual harassment, examples, federal and state law and remedies,\n     rights of redress and all forums, supervisor responsibilities; interactive = questions with feedback, way to ask questions, feedback survey.\n     Executive Law 296 (NYSHRL; 2019: harassment need not be severe or pervasive; protects non-employees such as contractors and vendors). DHR: 3 years to file.\n     DHR sexual harassment hotline 1-800-HARASS-3 (1-800-427-2773), free pro bono legal help. NYC Admin. Code 8-107(30) (Stop Sexual Harassment Act, employers 15+); NYC CCHR (call 311).\n   Illinois: 775 ILCS 5/2-109 (annual training; content: explanation of sexual harassment, examples, summary of federal and state law incl. remedies, employer responsibilities\n     in prevention, investigation and corrective measures). 775 ILCS 5/2-102(D), 5/2-101 (working environment not limited to a physical location). IDHR charge: 2 years\n     (from Jan 1, 2025). IDHR Sexual Harassment and Discrimination Helpline 1-877-236-7703. Restaurants and bars also need the supplemental 2-110 training (not included here).\n   Connecticut: Conn. Gen. Stat. 46a-54(15) (Time's Up Act: employers with 3+ employees, 2 hours within 6 months of hire, supplemental every 10 years; info on federal and state law\n     and remedies; CHRO model training). CHRO: 300 days to file. ct.gov/chro.\n   Delaware: 19 Del. C. 711A (50+ employees, interactive training every 2 years incl. legal remedies, complaint process, retaliation, Delaware Department of Labor contact; supervisors extra).\n   Maine: 26 MRSA 807 (15+ employees, within 1 year of hire; Maine Human Rights Commission contact info; supervisors extra).\n   Delaware: 19 Del. C. 711A(g) content: illegality, definition with examples, legal remedies and complaint process, retaliation, how to contact DDOL.\n     DDOL Office of Anti-Discrimination (302) 761-8200, dia.delawareworks.com/discrimination. Charge: 300 days (19 Del. C. 712). Supervisors: extra training (SUP_SHORT).\n   Maine: 26 MRSA 807(3): illegality, definition under state and federal law, examples, internal complaint process, legal recourse and MHRC complaint process,\n     MHRC contact info, retaliation. MHRC (207) 624-6290, maine.gov/mhrc. 300 days. Supervisors: extra training (SUP_SHORT).\n   Washington: RCW 49.60.515 (isolated workers: janitors, security guards, hotel/motel housekeepers, room service attendants alone for most of their hours).\n     Employer must give panic buttons, a sexual harassment policy, a resource list (EEOC, WSHRC, local advocacy groups) and train managers, supervisors and\n     isolated workers on preventing sexual harassment, assault and discrimination, using and responding to panic buttons, and protections for reporting.\n     L&I takes isolated-worker complaints (from Jan 1, 2026): isolatedworkers@lni.wa.gov. WSHRC 1-800-233-3247, hum.wa.gov, 6 months (RCW 49.60.230); court 3 years.\n   New York City: Admin. Code 8-107(30) (Local Law 96 of 2018; 15+ employees, annual, interactive). Content: unlawful under local, state and federal law, examples,\n     internal complaint process, CCHR + DHR + EEOC complaint processes with contact info, retaliation with examples, bystander intervention, supervisor duties.\n     CCHR (212) 416-0197 or 311. 1 year, 3 years for gender-based harassment. NYC uses \"treated less well\" (Williams v. NYC Housing Auth.).\n   Chicago: Human Rights Ordinance 6-10-040 (amended June 4, 2022): annual 1 hr harassment prevention (2 hr supervisors) + 1 hr bystander for all employees.\n     Definition adds sexual misconduct (coercion, abuse of authority, misuse of position). CCHR 365 days, chicago.gov/cchr, (312) 744-4111.\n     chi = EMPLOYEE version (2 hr seat time). chi-supervisor = 2 hr supervisor harassment (core + supervisor lessons s1-s9, s10) + 1 hr bystander = 3 hr seat time.\n     Supervisor lines: Illinois strict employer liability for supervisor sexual harassment (Sangamon County Sheriff's Dept. v. IDHR, 2009); 775 ILCS 5/2-102(D) individual liability;\n     Chicago 6-10-040 written policy content and 5-year record keeping. Lawyer review needed.\n   Added 2026-11-16 (all need counsel review before sale):\n     il-rest  Illinois restaurants and bars: 775 ILCS 5/2-110 supplemental training (industry conduct, manager liability, English AND Spanish) on top of 2-109.\n     dc       DC employers of tipped workers: Tipped Wage Workers Fairness Amendment Act of 2018 (D.C. Code 32-1341 et seq.). Training must be OHR-developed or given by an\n              OHR-CERTIFIED trainer (OHR keeps a certified trainer list), within 90 days of hire, every 2 years; employers also report harassment complaints to OHR yearly.\n              THIS COURSE IS NOT OHR-CERTIFIED. DC Human Rights Act (Human Rights Enhancement Amendment Act of 2022: harassment need not be severe or pervasive). OHR 1 year, (202) 727-4559.\n     ma       Massachusetts G.L. c.151B s.3A (policy required 6+; training ENCOURAGED: new hires within 1 year, extra for supervisors). MCAD 300 days, (617) 994-6000; court 3 years.\n     vt       Vermont 21 V.S.A. 495h (policy required; training ENCOURAGED within 1 year, extra for supervisors). Private employers: AG Civil Rights Unit (802) 828-3171; state employers: HRC.\n     ri       Rhode Island Gen. Laws 28-51 (policy required 50+; training ENCOURAGED within 1 year). RICHR 1 year, (401) 222-2661.\n     co       Colorado POWR Act (SB 23-172): harassment need not be severe or pervasive; employer affirmative defense needs a prevention program incl. supervisor training,\n              reporting options and policy. CCRD 300 days, (303) 894-2997.\n     or       Oregon Workplace Fairness Act (SB 726, ORS 659A.375): written policy required (names who takes reports, 5-year deadline); training not required. BOLI 5 years, (971) 673-0761.\n     nj       New Jersey Law Against Discrimination; training required for public employers, recommended (Lehmann/Aguas defense) for private. DCR 180 days, court 2 years. 1-833-NJDCR4U.\n     refresh  Yearly refresher (~15 min, any state): fresh scenarios for the years between full trainings. Does NOT replace full annual training where NY, NYC, IL or Chicago require it.\n   Bystander 5 Ds: Right To Be. No videos (Lottie series); longer seat-time versions use extra practice instead.  gender-based harassment.'},\n    {icon:'users',c:'g',b:'Court or police',s:'You can go to court. If there was a crime, like assault, call the police.'}],\n   deadlineQ:{q:'How long do you have to file a complaint with the New York State Division of Human Rights?',opts:['3 years','30 days','90 days'],a:0,why:'Three years. You can also call 1-800-HARASS-3 for free legal help.'}},\n il:{name:'Illinois',law:'the Illinois Human Rights Act and federal Title VII',agency:'the Illinois Department of Human Rights (IDHR)',\n   extra:'Illinois also protects ancestry, marital status, military status and unfavorable discharge, order of protection status, citizenship and work authorization status, arrest record, family responsibilities and reproductive health decisions.',\n   standard:'In Illinois, <b>sexual harassment is illegal on its own<\/b>, and your workplace isn’t just the building. It counts online, at events and anywhere you’re doing your job.',\n   standardOk:0,\n   agencies:[\n    {icon:'scale',c:'',b:'Illinois Dept. of Human Rights',s:'dhr.illinois.gov. File within 2 years. Helpline: 1-877-236-7703.'},\n    {icon:'book',c:'o',b:'EEOC (federal)',s:'eeoc.gov · 1-800-669-4000. File within 300 days.'},\n    {icon:'users',c:'p',b:'Human Rights Commission or court',s:'After IDHR, your case can go to the Illinois Human Rights Commission or to court.'}],\n   deadlineQ:{q:'How long do you have to file a charge with the Illinois Department of Human Rights?',opts:['2 years','30 days','10 years'],a:0,why:'Two years. You can call the IDHR helpline at 1-877-236-7703 with questions.'}},\n ct:{name:'Connecticut',law:'the Connecticut Fair Employment Practices Act and federal Title VII',agency:'the Connecticut Commission on Human Rights and Opportunities (CHRO)',\n   extra:'Connecticut also protects ancestry, gender identity or expression, marital status, mental, intellectual and learning disabilities, veteran status and domestic violence victim status.',\n   standard:'In Connecticut, sexual harassment includes <b>unwanted sexual advances, requests for favors and any conduct of a sexual nature<\/b> that affects your job or makes work hostile.',\n   standardOk:0,\n   agencies:[\n    {icon:'scale',c:'',b:'CHRO',s:'ct.gov/chro. File within 300 days.'},\n    {icon:'book',c:'o',b:'EEOC (federal)',s:'eeoc.gov · 1-800-669-4000. File within 300 days.'},\n    {icon:'users',c:'p',b:'Court',s:'After CHRO releases your case, you can go to court.'}],\n   deadlineQ:{q:'How long do you have to file a complaint with Connecticut’s CHRO?',opts:['300 days','3 years','30 days'],a:0,why:'300 days from the harassment. Same as the EEOC. Don’t wait.'}},\n de:{name:'Delaware',law:'the Delaware Discrimination in Employment Act and federal Title VII',agency:'the Delaware Department of Labor (DDOL)',\n   extra:'Delaware also protects marital status, family responsibilities, reproductive health decisions, protective hairstyles, and victims of domestic violence, sexual offenses or stalking.',\n   standard:'In Delaware, like under federal law, it has to be <b>serious or happen often<\/b> to be illegal. But your employer’s policy can stop it much sooner, and should.',\n   standardOk:1,\n   agencies:[\n    {icon:'scale',c:'',b:'Delaware Dept. of Labor',s:'Office of Anti-Discrimination: (302) 761-8200, dia.delawareworks.com/discrimination. File within 300 days.'},\n    {icon:'book',c:'o',b:'EEOC (federal)',s:'eeoc.gov · 1-800-669-4000. File within 300 days.'},\n    {icon:'users',c:'p',b:'Court',s:'After the Department of Labor gives you a “right to sue” notice, you can go to court.'}],\n   deadlineQ:{q:'How long do you have to file a charge with the Delaware Department of Labor?',opts:['300 days','30 days','5 years'],a:0,why:'300 days from the harassment. Call the Office of Anti-Discrimination at (302) 761-8200 with questions.'}},\n me:{name:'Maine',law:'the Maine Human Rights Act and federal Title VII',agency:'the Maine Human Rights Commission (MHRC)',\n   extra:'Maine also protects ancestry, sexual orientation, gender identity, physical or mental disability, whistleblower activity, and people who filed a workers’ comp claim.',\n   standard:'In Maine, like under federal law, it has to be <b>serious or happen often<\/b> to be illegal. But your employer’s policy can stop it much sooner, and should.',\n   standardOk:1,\n   agencies:[\n    {icon:'scale',c:'',b:'Maine Human Rights Commission',s:'maine.gov/mhrc · (207) 624-6290. File within 300 days.'},\n    {icon:'book',c:'o',b:'EEOC (federal)',s:'eeoc.gov · 1-800-669-4000. File within 300 days.'},\n    {icon:'users',c:'p',b:'Court',s:'After the Commission, you can take your case to court.'}],\n   deadlineQ:{q:'How long do you have to file a complaint with the Maine Human Rights Commission?',opts:['300 days','30 days','5 years'],a:0,why:'300 days from the harassment. You can call the Commission at (207) 624-6290.'}},\n wa:{name:'Washington',law:'the Washington Law Against Discrimination and federal Title VII',agency:'the Washington State Human Rights Commission (WSHRC)',\n   extra:'Washington also protects creed, marital status, veteran and military status, citizenship or immigration status, HIV or hepatitis C status, and people who use a service animal.',\n   standard:'Under Washington and federal law, harassment has to be <b>serious or happen often<\/b> to be illegal. Sexual assault is a crime, every time. And your employer’s policy can stop harassment much sooner.',\n   standardOk:1,\n   agencies:[\n    {icon:'scale',c:'',b:'WA Human Rights Commission',s:'hum.wa.gov · 1-800-233-3247. File within 6 months. You have 3 years to go to court.'},\n    {icon:'shield',c:'o',b:'Labor and Industries (L&I)',s:'Report a missing panic button, policy or training: isolatedworkers@lni.wa.gov.'},\n    {icon:'book',c:'p',b:'EEOC (federal)',s:'eeoc.gov · 1-800-669-4000. File within 300 days.'},\n    {icon:'heartI',c:'g',b:'Local advocacy groups',s:'Sexual assault and harassment programs give free, private support. Your employer’s resource list has them.'}],\n   deadlineQ:{q:'How long do you have to file a complaint with the Washington State Human Rights Commission?',opts:['6 months','10 years','7 days'],a:0,why:'Six months, so don’t wait. You have 3 years to go to court. L&I handles panic button and training complaints.'}},\n nyc:{name:'New York City',law:'the New York City Human Rights Law, the New York State Human Rights Law and federal Title VII',agency:'the NYC Commission on Human Rights (CCHR) or the NYS Division of Human Rights (DHR)',\n   extra:'New York State and City also protect creed, citizenship or immigration status, gender identity or expression, marital and partnership status, caregiver status, height and weight, arrest or conviction record, and more.',\n   standard:'In New York City, it’s illegal if you’re <b>treated worse because of who you are<\/b>. It does not have to be severe or happen often. Only petty slights don’t count.',\n   standardOk:0,\n   agencies:[\n    {icon:'pin',c:'',b:'NYC Commission on Human Rights',s:'Call 311 or (212) 416-0197, nyc.gov/cchr. File within 1 year, or 3 years for gender-based harassment.'},\n    {icon:'scale',c:'o',b:'NYS Division of Human Rights',s:'dhr.ny.gov. File within 3 years. Free legal help: 1-800-HARASS-3 (1-800-427-2773).'},\n    {icon:'book',c:'p',b:'EEOC (federal)',s:'eeoc.gov · 1-800-669-4000. File within 300 days.'},\n    {icon:'users',c:'g',b:'Court or police',s:'You can go to court. If there was a crime, like assault, call the police.'}],\n   deadlineQ:{q:'How long do you have to file a gender-based harassment complaint with the NYC Commission on Human Rights?',opts:['3 years','30 days','90 days'],a:0,why:'Three years for gender-based harassment, and 1 year for other claims. Call 311 to reach the Commission.'}},\n chi:{name:'Chicago',law:'the Chicago Human Rights Ordinance, the Illinois Human Rights Act and federal Title VII',agency:'the Chicago Commission on Human Relations (CCHR) or the Illinois Department of Human Rights (IDHR)',\n   extra:'Chicago and Illinois also protect ancestry, marital and parental status, military discharge status, source of income, credit history, arrest record, and order of protection status.',\n   standard:'In Chicago, <b>sexual harassment is illegal on its own<\/b>, and so is <b>sexual misconduct<\/b>: sexual behavior that uses pressure or someone’s power at work. It counts online and off-site too.',\n   standardOk:0,\n   agencies:[\n    {icon:'pin',c:'',b:'Chicago Commission on Human Relations',s:'chicago.gov/cchr · (312) 744-4111. File within 365 days.'},\n    {icon:'scale',c:'o',b:'Illinois Dept. of Human Rights',s:'dhr.illinois.gov. File within 2 years. Helpline: 1-877-236-7703.'},\n    {icon:'book',c:'p',b:'EEOC (federal)',s:'eeoc.gov · 1-800-669-4000. File within 300 days.'},\n    {icon:'users',c:'g',b:'Court',s:'After an agency, your case can go to court.'}],\n   deadlineQ:{q:'How long do you have to file with the Chicago Commission on Human Relations?',opts:['365 days','30 days','10 years'],a:0,why:'365 days. You can also go to the Illinois Department of Human Rights within 2 years.'}},\n dc:{name:'DC',law:'the DC Human Rights Act and federal Title VII',agency:'the DC Office of Human Rights (OHR)',\n   extra:'DC also protects personal appearance, family responsibilities, matriculation (being a student), political affiliation, source of income, credit information, homeless status, and victims of domestic violence or sexual offenses.',\n   standard:'In DC, harassment <b>does not have to be severe or happen often<\/b> to be illegal. What matters is the whole picture of what happened.',\n   standardOk:0,\n   agencies:[\n    {icon:'scale',c:'',b:'DC Office of Human Rights',s:'ohr.dc.gov · (202) 727-4559. File within 1 year.'},\n    {icon:'book',c:'o',b:'EEOC (federal)',s:'eeoc.gov · 1-800-669-4000. File within 300 days.'},\n    {icon:'users',c:'p',b:'Court',s:'You can also go to DC Superior Court. Ask a lawyer about the deadline.'}],\n   deadlineQ:{q:'How long do you have to file a complaint with the DC Office of Human Rights?',opts:['1 year','30 days','10 years'],a:0,why:'One year from the harassment. You can call OHR at (202) 727-4559 with questions.'}},\n ma:{name:'Massachusetts',law:'Massachusetts General Laws chapter 151B and federal Title VII',agency:'the Massachusetts Commission Against Discrimination (MCAD)',\n   extra:'Massachusetts also protects ancestry, gender identity, sexual orientation, military and veteran status, and natural hairstyles.',\n   standard:'In Massachusetts, like under federal law, it has to be <b>serious or happen often<\/b> to be illegal. But your employer’s policy can stop it much sooner, and should.',\n   standardOk:1,\n   agencies:[\n    {icon:'scale',c:'',b:'MCAD',s:'mass.gov/mcad · (617) 994-6000. File within 300 days.'},\n    {icon:'book',c:'o',b:'EEOC (federal)',s:'eeoc.gov · 1-800-669-4000. File within 300 days.'},\n    {icon:'users',c:'p',b:'Court',s:'After your case has been at MCAD for 90 days, you can go to court.'}],\n   deadlineQ:{q:'How long do you have to file a complaint with the Massachusetts Commission Against Discrimination?',opts:['300 days','30 days','10 years'],a:0,why:'300 days from the harassment. Call MCAD at (617) 994-6000 with questions.'}},\n vt:{name:'Vermont',law:'the Vermont Fair Employment Practices Act and federal Title VII',agency:'the Vermont Attorney General’s Civil Rights Unit',\n   extra:'Vermont also protects ancestry, place of birth, sexual orientation, gender identity, HIV status and crime victim status.',\n   standard:'In Vermont, like under federal law, it has to be <b>serious or happen often<\/b> to be illegal. But your employer’s policy can stop it much sooner, and should.',\n   standardOk:1,\n   agencies:[\n    {icon:'scale',c:'',b:'Attorney General, Civil Rights Unit',s:'ago.vermont.gov · (802) 828-3171. Takes complaints about private employers.'},\n    {icon:'pin',c:'o',b:'Vermont Human Rights Commission',s:'hrc.vermont.gov. Takes complaints about state government employers.'},\n    {icon:'book',c:'p',b:'EEOC (federal)',s:'eeoc.gov · 1-800-669-4000. File within 300 days.'},\n    {icon:'users',c:'g',b:'Court',s:'You can also go to court. Ask a lawyer about the deadline.'}],\n   deadlineQ:{q:'How long do you usually have to file with the EEOC if you work in Vermont?',opts:['300 days','30 days','10 years'],a:0,why:'300 days. The Attorney General’s Civil Rights Unit can help too: (802) 828-3171. Don’t wait.'}},\n ri:{name:'Rhode Island',law:'the Rhode Island Fair Employment Practices Act and federal Title VII',agency:'the Rhode Island Commission for Human Rights (RICHR)',\n   extra:'Rhode Island also protects ancestry, sexual orientation, gender identity or expression, and victims of domestic abuse.',\n   standard:'In Rhode Island, like under federal law, it has to be <b>serious or happen often<\/b> to be illegal. But your employer’s policy can stop it much sooner, and should.',\n   standardOk:1,\n   agencies:[\n    {icon:'scale',c:'',b:'RI Commission for Human Rights',s:'richr.ri.gov · (401) 222-2661. File within 1 year.'},\n    {icon:'book',c:'o',b:'EEOC (federal)',s:'eeoc.gov · 1-800-669-4000. File within 300 days.'},\n    {icon:'users',c:'p',b:'Court',s:'After the Commission gives you a “right to sue” notice, you can go to court.'}],\n   deadlineQ:{q:'How long do you have to file a charge with the Rhode Island Commission for Human Rights?',opts:['1 year','30 days','10 years'],a:0,why:'One year from the harassment. Call the Commission at (401) 222-2661 with questions.'}},\n co:{name:'Colorado',law:'the Colorado Anti-Discrimination Act and federal Title VII',agency:'the Colorado Civil Rights Division (CCRD)',\n   extra:'Colorado also protects creed, ancestry, marital status, gender expression and protective hairstyles.',\n   standard:'In Colorado, harassment <b>does not have to be severe or happen often<\/b> to be illegal. Unwelcome conduct that a reasonable person would find offensive can be enough.',\n   standardOk:0,\n   agencies:[\n    {icon:'scale',c:'',b:'Colorado Civil Rights Division',s:'ccrd.colorado.gov · (303) 894-2997. File within 300 days.'},\n    {icon:'book',c:'o',b:'EEOC (federal)',s:'eeoc.gov · 1-800-669-4000. File within 300 days.'},\n    {icon:'users',c:'p',b:'Court',s:'After the Division gives you a “right to sue” notice, you can go to court.'}],\n   deadlineQ:{q:'How long do you have to file a charge with the Colorado Civil Rights Division?',opts:['300 days','30 days','10 years'],a:0,why:'300 days from the harassment. Call the Division at (303) 894-2997 with questions.'}},\n or:{name:'Oregon',law:'Oregon civil rights law (ORS chapter 659A) and federal Title VII',agency:'the Oregon Bureau of Labor and Industries (BOLI)',\n   extra:'Oregon also protects marital status, family relationships, gender identity, expunged juvenile records and protective hairstyles.',\n   standard:'In Oregon, like under federal law, it has to be <b>serious or happen often<\/b> to be illegal. But your employer’s policy can stop it much sooner, and should.',\n   standardOk:1,\n   agencies:[\n    {icon:'scale',c:'',b:'Oregon BOLI',s:'oregon.gov/boli · (971) 673-0761. File a harassment complaint within 5 years.'},\n    {icon:'book',c:'o',b:'EEOC (federal)',s:'eeoc.gov · 1-800-669-4000. File within 300 days.'},\n    {icon:'report',c:'p',b:'Your employer’s policy',s:'Oregon employers must name a person to take reports and explain your options.'},\n    {icon:'users',c:'g',b:'Court',s:'You can also go to court. Ask a lawyer about the deadline.'}],\n   deadlineQ:{q:'How long do you have to file a harassment complaint with Oregon’s BOLI?',opts:['5 years','30 days','90 days'],a:0,why:'Up to 5 years. But reporting sooner makes it easier to fix. Your employer’s policy must say who to tell.'}},\n nj:{name:'New Jersey',law:'the New Jersey Law Against Discrimination (LAD) and federal Title VII',agency:'the New Jersey Division on Civil Rights (DCR)',\n   extra:'New Jersey also protects ancestry, marital, civil union and domestic partnership status, gender identity or expression, military service, breastfeeding and genetic traits.',\n   standard:'In New Jersey, like under federal law, it has to be <b>serious or happen often<\/b> to be illegal. But your employer’s policy can stop it much sooner, and should.',\n   standardOk:1,\n   agencies:[\n    {icon:'scale',c:'',b:'NJ Division on Civil Rights',s:'njcivilrights.gov · 1-833-NJDCR4U. File within 180 days.'},\n    {icon:'book',c:'o',b:'EEOC (federal)',s:'eeoc.gov · 1-800-669-4000. File within 300 days.'},\n    {icon:'users',c:'p',b:'Court',s:'You can go straight to New Jersey Superior Court within 2 years.'}],\n   deadlineQ:{q:'How long do you have to file a complaint with the New Jersey Division on Civil Rights?',opts:['180 days','10 years','7 days'],a:0,why:'180 days. Or you can go to court within 2 years. Don’t wait.'}}\n};\nconst ST=STATES[SK];\nconst W=(cond,step)=>cond?step:null;\nconst steps=(...a)=>a.filter(Boolean);\n\nconst COURSE={\n  id:V.id, title:V.title, minutes:V.minutes, calm:true, seatMin:V.seatMin||0,\n  seatWhy:SK==='ca'?(SUP?'California requires at least 2 hours of training for supervisors.':'California requires at least 1 hour of training.'):(SK==='chi'?(SUP?'Chicago requires supervisors to complete 2 hours of harassment prevention and 1 hour of bystander training every year.':'Chicago requires 1 hour of harassment prevention and 1 hour of bystander training every year.'):'Connecticut requires at least 2 hours of training.'),\n  trainer:SK==='ca'?{note:'Send a question about this training. California requires a trainer to answer within two business days. If no trainer email is set up, ask HR.'}:(NYISH?{note:'New York requires that you can ask questions about this training. Send yours here or ask HR.'}:null),\n  motto:['Know it','Stop it','Report it'],\n  blurb:REF?'Your yearly refresher. New situations like AI images, customers filming you and “it was just a joke,” plus where to report. About 15 minutes.':((SUP?'For supervisors. What harassment is under the law, how to prevent it, and exactly what to do when someone comes to you.':'What harassment is, in person and online, how to step in, and how to report it safely.')+(SK!=='all'?` Built for ${ST.name} rules.`:'')+' Real situations, quick practice, and a certificate at the end.'),\n  share:`I just completed ${V.title}. Know it. Stop it. Report it.`,\n  care:'If something happened to you, it’s not your fault. Tell your manager, HR, or someone above them. Retaliation for reporting is illegal. You can also contact '+(SK==='all'?'the EEOC (eeoc.gov) or your state agency':ST.agency)+'. If you’re in danger, call 911. For emotional support, call or text 988.'\n};\n\n/* ---------- core lessons (everyone) ---------- */\nconst CORE=[\n {id:'c1',title:'Why this matters',icon:'shield',mins:LONG?5:3,steps:steps(\n  {t:'talk',pose:'calm',say:`Hi, I’m Lottie. This training is about one thing: <b>everyone gets to feel safe at work.<\/b> ${SUP?'As a supervisor, you have extra power and extra duties. We’ll cover both.':'We’ll keep it real and practical.'}`,rule:'<b>Three things to remember:<\/b> Know it. Stop it. Report it.'},\n  {t:'tiles',pose:'think',say:'Here’s what you’ll get out of this.',tiles:[\n    {icon:'scale',c:'',b:'Know the line',s:`What the law says, under ${ST.law}.`},\n    {icon:'users',c:'o',b:'Step in',s:'Simple ways to help when you see it.'},\n    {icon:'report',c:'p',b:'Report it',s:'Where to go and what happens next.'},\n    {icon:'shield',c:'g',b:'Know your rights',s:'Retaliation is illegal. You’re protected.'}]},\n  W(LONG||NYISH,{t:'reflect',q:'Think of a time someone at work, school or online made you feel small. What did you wish someone had done?',say:'Thanks for thinking about that. Hold onto it. A lot of this course is about being that someone.'}),\n  {t:'mc',kind:'True or false',q:'Harassment training is only for people who might harass someone.',opts:['True','False'],a:1,noShuffle:1,\n    why:'False. Most of this is about what to do when you see it or it happens to you. Everyone has a part.'}\n )},\n {id:'c2',title:'What harassment is',icon:'scale',mins:LONG?5:3,steps:steps(\n  {t:'talk',pose:'talk',say:'Harassment is <b>unwelcome behavior<\/b> because of who someone is, like their race, sex or religion. It’s illegal when it makes work hostile or when your job depends on putting up with it.',rule:`<b>Protected traits under federal law:<\/b> ${FED_TRAITS}. ${ST.extra}`},\n  {t:'flip',q:'Harassment can show up in many forms. Tap each card.',cards:[\n    {icon:'chat',c:'',front:'Said',hint:'Tap to flip',back:'<b>Jokes, slurs, nicknames, insults.<\/b>Comments about someone’s body, accent, faith or age.'},\n    {icon:'eye',c:'o',front:'Shown',hint:'Tap to flip',back:'<b>Pictures, memes, gestures, stares.<\/b>Posters, screensavers, “accidental” screen shares.'},\n    {icon:'hand',c:'p',front:'Done',hint:'Tap to flip',back:'<b>Touching, blocking, following.<\/b>Standing too close, brushing past on purpose.'},\n    {icon:'phone',c:'g',front:'Sent',hint:'Tap to flip',back:'<b>DMs, texts, group chats, comments.<\/b>Even after hours, if it’s about work people.'}]},\n  {t:'multi',q:'Which of these are protected traits? Pick all that apply.',opts:['Religion','Age (40 and over)','Disability','Favorite sports team'],a:[0,1,2],\n    why:'Religion, age and disability are protected. Sports teams aren’t, though teasing that turns cruel can still break your workplace policy.'},\n  {t:'mc',kind:ST.standardOk?'Your call':'True or false',q:ST.standardOk?'A coworker makes one offhand comment about your accent. Is that automatically illegal?':`In ${ST.name}, harassment has to be extreme or happen many times before it’s illegal.`,\n    opts:ST.standardOk?['Not always, but it can still break policy and should be reported','Yes, always illegal','No, comments never count']:['True','False'],a:ST.standardOk?0:1,noShuffle:ST.standardOk?0:1,\n    why:ST.standard},\n  W(LONG,{t:'swipe',q:'Is it about who someone is? Swipe each one.',left:'About who they are',right:'About the work',items:[\n    ['“Women can’t handle the stockroom.”','user',0],['“Your counts were off twice this week.”','check',1],['“Go back where you came from.”','pin',0],\n    ['“You missed the 9:00 meeting.”','clock',1],['“You’re too old to learn the new system.”','user',0],['“Please wear your name tag.”','user',1]],\n    why:'Feedback about the work is normal. Comments about who someone is, like sex, origin or age, cross into harassment.'})\n )},\n {id:'c3',title:'Sexual harassment',icon:'heartI',mins:LONG?5:3,steps:steps(\n  {t:'bins',q:'Sort each one: “this for that” or hostile environment?',bins:[['This for that','Job perk tied to a sexual favor'],['Hostile environment','Behavior makes work feel unsafe']],\n    items:[['“Go out with me and I’ll give you better shifts.”',0],['Constant sexual jokes in the break room',1],['“Your raise depends on how nice you are to me.”',0],['Sexual memes posted in the team chat',1],['A lead cuts your hours after you turn down a date',0],['Coworkers rating each other’s bodies',1]],\n    why:'“This for that” (quid pro quo) means a job benefit depends on a sexual favor. Hostile environment means sexual behavior makes work offensive or scary. Both are illegal.'},\n  {t:'mc',kind:'True or false',q:'Sexual harassment only counts if the harasser is attracted to the person.',opts:['True','False'],a:1,noShuffle:1,\n    why:'False. It doesn’t have to be about desire. It can be about power, humiliation or “just joking.”'},\n  {t:'swipe',q:'Who can be a harasser? Swipe each one.',left:'Can harass',right:'Can’t',items:[\n    ['A manager','crown',0],['A coworker','users',0],['A customer','cash',0],['Someone of the same sex','user',0],['A delivery driver or vendor','truck',0]],\n    why:'Anyone. Managers, coworkers, customers, vendors, and people of any gender, including the same gender as you.'},\n  W(SK==='chi',{t:'flip',q:'Chicago adds “sexual misconduct.” Tap each card.',cards:[\n    {icon:'crown',c:'',front:'Abuse of power',hint:'Tap to flip',back:'<b>Using a title to push for sexual attention.<\/b>“I make the schedule. Be nice to me.”'},\n    {icon:'alert',c:'o',front:'Pressure',hint:'Tap to flip',back:'<b>Coercion, even without words.<\/b>Hints, threats or favors that make “no” feel risky.'},\n    {icon:'key',c:'p',front:'Misusing a position',hint:'Tap to flip',back:'<b>Using access you get from the job.<\/b>Like pulling a coworker’s number from the files.'}]})\n )},\n {id:'c4',title:'Gender identity and orientation',icon:'users',mins:LONG?5:3,steps:steps(\n  {t:'talk',pose:'calm',say:`Harassment because of <b>sexual orientation, gender identity or gender expression<\/b> is illegal${SK==='all'?' under federal law':` in ${ST.name} and under federal law`}. That includes what someone wears, how they look, or the name they use.`},\n  {t:'texts',q:'The team chat after a new coworker joins.',chat:'Closing Crew',sub:'7 members',icon:'users',rounds:[\n    {msgs:[['','Thursday 9:14 PM'],['Marcus','new girl Jordan is kinda different lol'],['Kayla','wait is jordan a guy or a girl 💀'],['Marcus','idk ima just call them “it” 😂']],ask:'What do you send?',opts:[\n      {t:'Not funny. Jordan uses she/her. Just call her Jordan.',ok:1,fb:'Short and clear. You named the problem without starting a fight.',then:[['Kayla','my bad'],['Marcus','ok ok']]},\n      {t:'😂',ok:0,fb:'A laugh reads as “keep going.” And this is the kind of chat that ends up in an HR report.',then:[['Marcus','lmaooo']]},\n      {t:'(Mute the chat)',ok:0,fb:'Muting protects you, but Jordan might be in this chat, or see screenshots. A short reply, or a word to your lead, helps.',then:[['','Later: Jordan left the chat.']]}]}],\n    why:'Calling someone “it” or mocking their gender is harassment. Use the name and pronouns people ask for. If it keeps going, tell your manager.'},\n  {t:'mc',kind:'Your move',scene:'You aren’t sure which pronouns a new coworker uses.',q:'What’s the respectful thing to do?',opts:['Use their name, or ask privately: “What pronouns do you use?”','Guess based on how they look','Ask loudly in front of everyone'],a:0,\n    why:'Using someone’s name is always safe. Asking privately is respectful. If you slip up, say “sorry, she” and move on.'},\n  W(LONG||NYISH,{t:'swipe',q:'Okay, or over the line?',left:'Over the line',right:'Okay',items:[\n    ['Telling a coworker their outfit is “too gay for work”','eye',0],['Using a coworker’s new name after they ask','user',1],['Asking a trans coworker about their body','ban',0],\n    ['Including a coworker’s partner in a team invite','heartI',1],['Repeatedly using someone’s old name on purpose','chat',0]],\n    why:'Respect looks like using people’s names, pronouns and keeping questions about bodies out of work. Doing the opposite on purpose is harassment.'})\n )},\n {id:'c5',title:'Race, religion, age and more',icon:'user',mins:LONG?5:3,steps:steps(\n  {t:'post',kind:'Team chat check',q:'Your coworkers drafted these for the team chat. Post it or skip it?',items:[\n    {pic:'Meme about a coworker’s religion, with their photo',cap:'when [name] can’t eat lunch with us lol',icon:'camera',ok:0,where:'team chat',why:'Mocking someone’s faith, with their photo. That’s harassment.'},\n    {pic:'Photo of the whole crew at the team lunch',cap:'best crew 🍕',icon:'users',ok:1,where:'team chat',why:'Everyone’s in it and nobody’s the joke. Post it.'},\n    {pic:'Video imitating a coworker’s accent',cap:'customer service by [name] 😂',icon:'chat',ok:0,where:'team chat',why:'Imitating an accent targets national origin. Skip it.'},\n    {pic:'GIF of an old man struggling with a phone',cap:'Linda vs the new scheduling app',icon:'phone',ok:0,where:'team chat',why:'Jokes about a coworker’s age can be age harassment. Skip it.'}],\n    why:'If the joke is about who someone is, it doesn’t belong in the chat.'},\n  {t:'mc',kind:'Your move',scene:'A coworker uses a wheelchair. Others keep making “speed limit” jokes when she rolls by. She smiles, but she’s started taking breaks alone.',q:'What’s going on?',opts:['The jokes target her disability and are likely unwelcome','It’s fine because she smiles','It’s only a problem if she complains'],a:0,\n    why:'People often smile to get through it. Unwelcome jokes about a disability are harassment, complaint or not.'},\n  W(LONG,{t:'flip',q:'Words that sound harmless, but aren’t. Tap each card.',cards:[\n    {icon:'chat',c:'',front:'“Where are you really from?”',hint:'Tap to flip',back:'<b>Says “you don’t belong.”<\/b>Especially when asked again and again.'},\n    {icon:'clock',c:'o',front:'“OK, boomer.”',hint:'Tap to flip',back:'<b>Age jokes add up.<\/b>Workers 40 and over are protected.'},\n    {icon:'eye',c:'p',front:'“You don’t look disabled.”',hint:'Tap to flip',back:'<b>Many disabilities can’t be seen.<\/b>Don’t question someone’s needs.'},\n    {icon:'hands',c:'g',front:'“That’s so ghetto.”',hint:'Tap to flip',back:'<b>Coded words can still target race.<\/b>Drop them.'}]})\n )},\n {id:'c6',title:'Online, remote and after hours',icon:'phone',mins:LONG?5:3,steps:steps(\n  {t:'talk',pose:'think',say:'Harassment doesn’t stop at the door. It counts in <b>DMs, group chats, video calls, social media, work trips and parties<\/b>, when it involves people from work.'},\n  {t:'texts',q:'A coworker DMs you on a Saturday.',chat:'Devin (coworker)',sub:'Works your shift',icon:'user',rounds:[\n    {msgs:[['','Saturday 11:52 PM'],['Devin','u up'],['Devin','saw ur beach pics 👀👀'],['Devin','u should wear that to work lol']],ask:'You’re not into this. What do you send?',opts:[\n      {t:'Not okay. Keep it to work stuff, please.',ok:1,fb:'Clear and short. You don’t owe a nice tone or a reason.',then:[['Devin','dang ok sorry']]},\n      {t:'lol go to sleep',ok:0,fb:'Totally understandable, and it’s never your fault. But a joke back can read as “keep going.” You’re allowed to be direct.',then:[['Devin','only if ur there 😏']]},\n      {t:'(Block him without saving anything)',ok:0,fb:'Blocking is okay. But screenshot first. It’s your proof if it keeps going at work.',then:[]}]},\n    {msgs:[['','Monday'],['Devin','hey about saturday... u didn’t tell anyone right? 😬']],ask:'What now?',opts:[\n      {t:'(Screenshot the messages and tell your manager or HR)',ok:1,fb:'Screenshots are proof. You don’t have to handle it alone, and reporting is protected.',then:[['','You saved the chat.']]},\n      {t:'nah it’s fine',ok:0,fb:'It doesn’t have to be fine. You can still report it, even if you said it was okay.',then:[]}]}],\n    why:'Online counts. Say no if you feel safe, save the messages, and tell someone.'},\n  {t:'multi',q:'Which of these can count as workplace harassment? Pick all that apply.',opts:['Sexual comments at the off-site holiday party','A coworker posting your photo with a cruel caption','Repeated DMs after you said stop','A coworker posting their own vacation pics'],a:[0,1,2],\n    why:'Parties, posts and DMs involving work people all count. Someone sharing their own vacation pics is just… vacation pics.'}\n )},\n {id:'c7',title:'Customers and vendors',icon:'cash',mins:LONG?5:3,steps:steps(\n  {t:'talkback',q:'A regular customer keeps making comments to you.',who:'Customer',meter:55,start:'s',labels:['Handled','Uneasy','Unsafe'],\n    why:'You don’t have to “take it” for the tip or the sale. Set a line, get backup, and tell your manager.',nodes:{\n    s:{say:'There’s my favorite. You should smile more, gorgeous. What time do you get off?',choices:[\n      {t:'“I’ll get your order going. What can I get you?”',d:-15,to:'mid',fb:'Calm and all business. You redirected without playing along.'},\n      {t:'Laugh and say: “Wouldn’t you like to know!”',d:20,to:'worse',fb:'It’s a normal way to survive the moment. But it can read as flirting back.'},\n      {t:'Freeze and say nothing.',d:10,to:'worse',fb:'Freezing is a normal reaction. It’s okay. Next time, a plan helps.'}]},\n    worse:{act:'He leans further over the counter.',say:'Come on, I’ll wait for you. I always do.',choices:[\n      {t:'“Please stop. I’m getting my manager.”',d:-25,to:'good',fb:'Clear boundary, then backup. That’s exactly right.'},\n      {t:'Keep laughing it off.',d:20,to:'bad',fb:'He’s pushing harder. Time to get backup.'}]},\n    mid:{say:'Just a coffee. And your number.',choices:[\n      {t:'“Just the coffee. I’ll have my coworker ring you up.” Then tell your manager.',d:-25,to:'good',fb:'You set a line and got support. Your manager can ban or handle him.'},\n      {t:'Give a fake number so he leaves.',d:15,to:'bad',fb:'It might end the moment, but he’ll be back. Tell your manager.'}]},\n    good:{end:1,good:1,say:'Fine. Whatever.',title:'You held the line.',msg:'You stayed calm, didn’t play along, and got backup. Now tell your manager so it doesn’t keep happening.'},\n    bad:{end:1,good:0,act:'He comes back the next day and waits by your car.',title:'It kept going.',msg:'This is when it gets unsafe. Tell your manager right away. Your employer has to act.'}}},\n  {t:'mc',kind:'True or false',q:`Your employer has to act when a customer or vendor harasses you${NYISH?', and New York also protects contractors and vendors who are harassed at your workplace':''}.`,opts:['True','False'],a:0,noShuffle:1,\n    why:'True. Once your employer knows, it must take steps, like switching who serves that customer, warning them or banning them.'},\n  W(LONG,{t:'tiles',pose:'calm',say:'When someone outside the company crosses the line, your employer can:',tiles:[\n    {icon:'users',c:'',b:'Swap you out',s:'A coworker or manager takes over that customer.'},\n    {icon:'chat',c:'o',b:'Warn them',s:'A manager tells them to stop.'},\n    {icon:'ban',c:'p',b:'Ban them',s:'Customers and vendors can be refused service.'},\n    {icon:'report',c:'g',b:'Write it down',s:'So the next shift knows what happened.'}]})\n )},\n W(SK==='ca'||LONG,{id:'c8',title:'Abusive conduct',icon:'alert',mins:LONG?5:3,steps:steps(\n  {t:'talk',pose:'calm',say:'<b>Abusive conduct<\/b> is bullying at work. It doesn’t have to be about who you are. It’s behavior done with ill will that a reasonable person would find hostile and that has <b>nothing to do with the business<\/b>.',rule:'<b>Examples:<\/b> repeated yelling or insults, threats, humiliating someone in front of others, or sabotaging their work on purpose. One act usually isn’t enough, unless it’s really severe.'},\n  {t:'swipe',q:'Tough but fair, or abusive?',left:'Abusive',right:'Tough but fair',items:[\n    ['“Your counts were off. Let’s fix it before close.”','check',1],['Screaming “you’re useless” in front of customers','alert',0],['Hiding a coworker’s tools so they fall behind','wrench',0],\n    ['Writing someone up for being late three times','clock',1],['Calling someone “stupid” every shift','chat',0],['Assigning a fair share of closing tasks','cal',1]],\n    why:'Clear feedback and fair rules are part of work. Repeated insults, humiliation and sabotage aren’t.'},\n  {t:'mc',kind:'Your move',scene:'Your lead mocks a coworker’s mistakes in front of the whole crew, every shift. It’s not about race or sex. Just mean.',q:'Is it worth reporting?',opts:['Yes. Abusive conduct goes against policy and should be reported','No. It only counts if it’s about a protected trait','No. Leads are allowed to be harsh'],a:0,\n    why:'Bullying hurts people and breaks most workplace policies. Report it the same way you’d report harassment.'}\n )}),\n {id:'c9',title:'If you see it',icon:'users',mins:LONG?5:3,steps:steps(\n  {t:'mn',q:'Saw something? Pick one of the 5 Ds.',items:[\n    {L:'D',w:'Direct',d:'Say something: “Not cool. Stop.” Only if it feels safe.'},\n    {L:'D',w:'Distract',d:'Interrupt: “Hey, can you help me in back?” Break the moment.'},\n    {L:'D',w:'Delegate',d:'Get a manager or someone with more power to step in.'},\n    {L:'D',w:'Delay',d:'Check in after: “You okay? That wasn’t right.”'},\n    {L:'D',w:'Document',d:'Write down what you saw. Give it to the person it happened to.'}]},\n  {t:'bins',q:'Which D is it?',bins:[['Distract','Break the moment'],['Delegate','Get someone'],['Delay','Check in after']],\n    items:[['“Hey, your phone’s ringing in the back!”',0],['You get the shift manager to come over',1],['Later: “That was messed up. You okay?”',2],['You spill a box on purpose so everyone looks',0],['You text HR what you saw',1],['You walk your coworker to their car after',2]],\n    why:'There’s no wrong D. Pick the one that feels safe for you in the moment.'},\n  {t:'mc',kind:'Your move',scene:'At a team party, a coworker keeps pushing drinks on a new hire and pulling her onto his lap. She looks stuck.',q:'What’s a good move?',opts:['“Hey, come help me grab the cake!” and pull her away','Film it for proof and post it','Do nothing, it’s a party'],a:0,\n    why:'Distract and get her out of the moment. Then check in, and tell a manager. Filming and posting can hurt her more.'}\n )},\n {id:'c10',title:'If it happens to you',icon:'heartI',mins:LONG?5:3,steps:steps(\n  {t:'tiles',pose:'calm',say:'If someone crosses the line with you, <b>it’s not your fault.<\/b> Remember <b>SAFE<\/b>. Use what feels safe for you.',tiles:[\n    {icon:'chat',c:'',b:'Say it, if safe',s:'“Stop. I don’t like that.” You don’t owe a reason.'},\n    {icon:'book',c:'o',b:'Add it to your notes',s:'What, when, where, who saw. Save screenshots.'},\n    {icon:'users',c:'p',b:'Find support',s:'A coworker you trust, a friend, or 988 if you need to talk.'},\n    {icon:'report',c:'g',b:'Escalate it',s:'Report it to your manager, HR, or their boss.'}]},\n  {t:'tone',q:'Set a clear boundary. Fix this message.',to:'To: Chris (coworker)',parts:[\n    {o:['lol stop 😅','Hey, I need you to stop','idk maybe don’t'],a:1},' ',\n    {o:['touching my back when you walk by.','being like that I guess.','doing the thing.'],a:0},' ',\n    {o:['If it happens again, I’ll report it.','Sorry if that’s weird!','No big deal tho.'],a:0}],\n    why:'Clear, specific, no apology. Saying what happens next is optional, but powerful.'},\n  {t:'form',kind:'Write it down',q:'Something happened. Pick the best entry for each line of your notes.',title:'My notes',fields:[\n    {k:'When',o:['Tues, Mar 4, about 2:15 PM','Sometime last week'],a:0},\n    {k:'Where',o:['Walk-in cooler, back of store','At work'],a:0},\n    {k:'What happened',o:['Alex said “nice body” and touched my waist. I said stop.','Alex was being weird again'],a:0},\n    {k:'Who saw',o:['Priya was stocking nearby','Nobody, I guess'],a:0}],\n    why:'Exact dates, places, words and witnesses make your report clear. Keep a copy somewhere that isn’t a work device.'},\n  W(LONG,{t:'reflect',q:'If this happened to you, who at work would you feel okay telling first?',say:'Good to know now, before you need it. If that person is the problem, go to their boss or HR.'})\n )},\n {id:'c11',title:'How to report',icon:'report',mins:LONG?5:3,steps:steps(\n  {t:'order',q:'You want to report harassment. Put the steps in order.',items:['Write down what happened, with dates','Save screenshots or messages','Tell your manager, HR, or their boss','Follow up if nothing changes'],\n    why:'Write it, save it, tell someone, follow up. You can report verbally or in writing. Use your company’s complaint form if it has one.'},\n  {t:'mc',kind:'Your move',scene:'The person harassing you is your own manager.',q:'Who do you report to?',opts:['Their boss, HR, or the hotline in your policy','Nobody. You have to go through your manager','Only the police'],a:0,\n    why:'You never have to report to the person harassing you. Go around them. Your policy lists other people to tell.'},\n  {t:'multi',q:'Which are good ways to report? Pick all that apply.',opts:['Tell your manager in person','Email HR','Use the company hotline or complaint form','Post about it on social media first'],a:[0,1,2],\n    why:'Use your workplace’s reporting options first so they can act fast. Posting can make it harder to fix, and can share private info.'}\n )},\n {id:'c12',title:'After you report',icon:'book',mins:LONG?5:3,steps:steps(\n  {t:'talk',pose:'calm',say:'When you report, your employer has to <b>look into it quickly and fairly<\/b>, and stop the harassment if it happened.'},\n  {t:'flip',q:'What happens next? Tap each card.',cards:[\n    {icon:'eye',c:'',front:'Investigation',hint:'Tap to flip',back:'<b>Someone neutral looks into it.<\/b>They talk to you, the other person and witnesses.'},\n    {icon:'lockI',c:'o',front:'Privacy',hint:'Tap to flip',back:'<b>Kept as private as possible.<\/b>But not 100% secret. Some people need to know to fix it.'},\n    {icon:'shield',c:'p',front:'Safety now',hint:'Tap to flip',back:'<b>Steps to protect you.<\/b>Like changing schedules, without punishing you.'},\n    {icon:'check',c:'g',front:'Outcome',hint:'Tap to flip',back:'<b>Action if it happened.<\/b>From coaching to firing. You’ll be told it’s been handled.'}]},\n  {t:'mc',kind:'True or false',q:'HR can promise that nobody will ever know you made a report.',opts:['True','False'],a:1,noShuffle:1,\n    why:'False. HR keeps it as private as it can, but it may need to talk to the other person and witnesses to fix it. That’s called limited confidentiality.'},\n  W(LONG,{t:'swipe',q:'Fair way to handle it, or not?',left:'Not fair',right:'Fair',items:[\n    ['Moving the person who reported to worse shifts','cal',0],['Interviewing both people and the witnesses','users',1],['Telling the whole crew who complained','chat',0],\n    ['Keeping notes of every interview','book',1],['Waiting two months to start','clock',0]],\n    why:'A good investigation is quick, neutral and private, and never punishes the person who reported.'})\n )},\n {id:'c13',title:'Retaliation is illegal',icon:'shield',mins:LONG?5:3,steps:steps(\n  {t:'talk',pose:'calm',say:'<b>Retaliation<\/b> means punishing someone for reporting harassment, helping an investigation, or standing up for a coworker. It’s illegal, even if the harassment claim isn’t proven.'},\n  {t:'swipe',q:'Retaliation, or not?',left:'Retaliation',right:'Not retaliation',items:[\n    ['Cutting someone’s hours right after they report','cal',0],['Leaving a witness out of the team lunch on purpose','users',0],['Writing someone up for skipping a shift, like anyone else','check',1],\n    ['Calling the person who reported a “snitch”','chat',0],['Moving a schedule because the reporter asked for it','clock',1]],\n    why:'Any bad treatment because someone reported or helped is retaliation. Normal rules applied fairly to everyone aren’t.'},\n  {t:'mc',kind:'Your move',scene:'Since you backed up a coworker’s report, your lead keeps giving you the worst tasks and ignoring you.',q:'What do you do?',opts:['Write it down and report the retaliation too','Quit, there’s nothing you can do','Let it go, it’s normal'],a:0,\n    why:'Retaliation is its own violation. Report it the same way, to HR or someone above your lead.'}\n )},\n {id:'c14',title:'Your rights under the law',icon:'scale',mins:LONG?6:3,steps:steps(\n  {t:'tiles',pose:'think',say:`You can always report inside your workplace first. You also have the right to go outside it. Here’s where${SK!=='all'?` in ${ST.name}`:''}:`,tiles:ST.agencies},\n  {t:'mc',q:ST.deadlineQ.q,opts:ST.deadlineQ.opts,a:ST.deadlineQ.a,why:ST.deadlineQ.why},\n  {t:'multi',q:'If harassment is proven, what can a court or agency order? Pick all that apply.',opts:['Lost pay paid back','Getting your job back','Money for emotional harm','Your employer changing its policies and training'],a:[0,1,2,3],\n    why:`All of them. Remedies can also include punishing damages and attorney fees.${SK==='ca'?' In California, the harasser can be personally on the hook too.':''}`},\n  W(LONG,{t:'dial',q:'Guess: about how many people who experience harassment at work ever make a formal report?',start:3,answer:[1],stops:[\n    {v:'Almost none',fx:'Not quite that low.'},\n    {v:'About 1 in 4',fx:'Studies say <b>about 3 out of 4 people never report.<\/b> Many fear retaliation.',mark:1},\n    {v:'About half',fx:'It’s lower than that.'},\n    {v:'Most people',fx:'Sadly, no.'}],\n    why:'Most people never report, usually because they fear being punished. That’s why retaliation is illegal, and why stepping in matters.'}),\n  W(!SUP,{t:'pledge',say:'Everyone deserves respect at work. Ready to commit?',lines:['I know where the line is, in person and online.','I help stop it when I see it, in a way that’s safe.','I report it, and I back up people who do.']})\n )}\n].filter(Boolean);\n\n/* ---------- short supervisor lesson (NY, IL, CT, all) ---------- */\nconst SUP_SHORT={id:'s0',title:'If you supervise others',icon:'crown',mins:4,steps:[\n  {t:'talk',pose:'talk',say:'Lead a shift, a team or even one person? Then you have <b>extra duties<\/b>. When you learn about harassment, the company legally knows too.'},\n  {t:'mn',q:'If someone comes to you, LEAD.',items:[\n    {L:'L',w:'Listen',d:'Thank them. Don’t judge, argue or promise secrecy.'},\n    {L:'E',w:'Escalate',d:'Report it to HR or your boss right away, the same day.'},\n    {L:'A',w:'Act to protect',d:'Keep them safe. Never punish them for speaking up.'},\n    {L:'D',w:'Document',d:'Write down what they told you, in their words.'}]},\n  {t:'mc',kind:'Your move',scene:'A crew member tells you a coworker keeps touching her. She says, “Please don’t tell anyone.”',q:'What do you do?',opts:['Thank her, explain you have to report it, and tell HR today','Promise to keep it secret','Wait to see if it happens again'],a:0,\n    why:'Supervisors must report. Be honest: “I can’t keep this secret, but I’ll share it only with people who need to know.”'}\n]};\n\n/* ---------- California supervisor lessons (2-hour version) ---------- */\nconst SUPER=[\n {id:'s1',title:'Your role as a supervisor',icon:'crown',mins:7,steps:[\n  {t:'talk',pose:'calm',say:SK==='ca'?'As a supervisor, <b>you speak for the company<\/b>. In California, the company is responsible for harassment by supervisors, even if nobody higher up knew. And <b>you can be personally sued<\/b> for harassing someone.':'As a supervisor, <b>you speak for the company<\/b>. In Illinois, the company is responsible for sexual harassment by any supervisor, even if nobody higher up knew. And <b>you can be held personally responsible<\/b> for harassing someone.',rule:'<b>Who counts as a supervisor?<\/b> Anyone who can hire, fire, schedule, discipline, assign work or reward, or recommend those things.'},\n  {t:'multi',q:'Which of these people count as supervisors under the law? Pick all that apply.',opts:['A shift lead who assigns tasks and breaks','An assistant manager who can write people up','A lead who recommends who gets hired','A coworker with the same job as you'],a:[0,1,2],\n    why:'If you direct work or can recommend discipline or hiring, the law likely sees you as a supervisor.'},\n  {t:'reflect',q:'What’s one thing your best boss ever did that made you feel safe to speak up?',say:'Whatever it was, you can do it too. Your crew watches how you react to small things.'}\n ]},\n {id:'s2',title:'Set the tone',icon:'users',mins:7,steps:[\n  {t:'flip',q:'Habits that prevent harassment. Tap each card.',cards:[\n    {icon:'eye',c:'',front:'Notice',hint:'Tap to flip',back:'<b>Watch the small stuff.<\/b>Jokes, nicknames and who gets left out.'},\n    {icon:'chat',c:'o',front:'Name it',hint:'Tap to flip',back:'<b>Shut it down on the spot.<\/b>“We don’t do that here.”'},\n    {icon:'star',c:'p',front:'Model it',hint:'Tap to flip',back:'<b>Your crew copies you.<\/b>If you laugh, they think it’s fine.'},\n    {icon:'cal',c:'g',front:'Be fair',hint:'Tap to flip',back:'<b>Same rules for everyone.<\/b>Shifts, breaks, discipline.'}]},\n  {t:'swipe',q:'Good leadership, or a problem?',left:'Problem',right:'Good leadership',items:[\n    ['Laughing at a crude joke so you seem chill','smile',0],['Stopping a nickname about someone’s accent','chat',1],['Only giving good shifts to your friends','cal',0],\n    ['Reminding the team how to report problems','report',1],['Adding crew members on socials and liking their bikini pics','phone',0]],\n    why:'Leaders set the line. Laughing along, favoritism and blurry personal boundaries all invite problems.'},\n  {t:'mc',kind:'Your move',scene:'Your team’s group chat has a running joke about one coworker’s weight. You’re in the chat.',q:'What do you do?',opts:['Post: “Let’s drop the weight jokes. Not cool.” Then check in with the coworker','Say nothing, you didn’t start it','Leave the chat'],a:0,\n    why:'If you see it, you own it. Shut it down, check in, and tell HR if it continues.'}\n ]},\n {id:'s3',title:'When someone tells you',icon:'chat',mins:8,steps:[\n  {t:'mn',q:'When someone reports to you, LEAD.',items:[\n    {L:'L',w:'Listen',d:'Give them privacy and time. Thank them. Don’t judge or argue.'},\n    {L:'E',w:'Escalate',d:'Tell HR or your boss right away. You can’t decide it’s “not serious.”'},\n    {L:'A',w:'Act to protect',d:'Keep them safe now. Never punish them, even by accident.'},\n    {L:'D',w:'Document',d:'Write what they said, when, and what you did. Their words, not yours.'}]},\n  {t:'talkback',q:'A crew member comes to you after close.',who:'Crew member',meter:50,start:'s',labels:['Trusts you','Unsure','Shut down'],\n    why:'Listen, thank them, be honest that you must report, and tell them what happens next.',nodes:{\n    s:{say:'Can I talk to you? It’s about Jake. He keeps saying stuff about my body. I don’t want to make it a big deal.',choices:[\n      {t:'“Thank you for telling me. I’m glad you did. Can you tell me what he’s said?”',d:-20,to:'mid',fb:'You listened first and made it safe to keep talking.'},\n      {t:'“Jake? He jokes with everyone. Are you sure?”',d:25,to:'bad',fb:'Doubting them shuts them down, and it can count as ignoring a complaint.'},\n      {t:'“Ugh, I don’t have time for drama.”',d:30,to:'bad',fb:'This is your job now. Brushing it off can make the company liable.'}]},\n    mid:{say:'Like, every shift. And he texted me last week. Please don’t tell anyone though.',choices:[\n      {t:'“I can’t keep it secret, but I’ll only share it with HR and people who need to know. You won’t get in trouble for this.”',d:-25,to:'good',fb:'Honest about the duty to report, and clear that they’re protected.'},\n      {t:'“Okay, I won’t say anything.”',d:20,to:'bad',fb:'You can’t promise that. Once you know, the company knows.'}]},\n    good:{end:1,good:1,say:'Okay. Thanks. I was nervous to say anything.',title:'They trust you.',msg:'Now Escalate and Document: tell HR today and write down what they said.'},\n    bad:{end:1,good:0,act:'They go quiet and say “Never mind.”',title:'They shut down.',msg:'Even after “never mind,” you still have to report what you heard.'}}},\n  {t:'form',kind:'Document it',q:'Write your notes after the conversation. Pick the best entry for each line.',title:'Supervisor notes',fields:[\n    {k:'Date of talk',o:['Mon, Jun 9, 10:40 PM, after close','Monday'],a:0},\n    {k:'What they said',o:['Jake comments on her body every shift; sent a text on Jun 2','Some drama with Jake'],a:0},\n    {k:'What I did',o:['Thanked her, explained I must report, emailed HR at 11:05 PM','Told her to ignore him'],a:0}],\n    why:'Facts, dates and their words, not your opinion. Then send it to HR.'}\n ]},\n {id:'s4',title:'You must report it',icon:'report',mins:6,steps:[\n  {t:'multi',q:'When do you have to report to HR? Pick all that apply.',opts:['A crew member tells you about harassment','You see it yourself','You hear a rumor about it on another team','The person asks you to keep it secret'],a:[0,1,2,3],\n    why:'All of them. Supervisors must report any harassment they see, hear about or suspect, even from other teams.'},\n  {t:'order',q:'You saw a coworker grope a crew member. Put your steps in order.',items:['Step in and stop it, if safe','Check that the person is okay','Report it to HR right away','Write down what you saw'],\n    why:'Stop it, support the person, report it, document it. Don’t investigate on your own.'},\n  {t:'mc',kind:'True or false',q:'If the person who was harassed says it’s fine now, you don’t need to report it.',opts:['True','False'],a:1,noShuffle:1,\n    why:'False. Report it anyway. HR decides next steps, and other people may be at risk too.'}\n ]},\n {id:'s5',title:'During an investigation',icon:'book',mins:7,steps:[\n  {t:'talk',pose:'calm',say:'Your company must investigate <b>quickly, fairly and by someone neutral<\/b>. Your job is to support it, not run it or get in the way.'},\n  {t:'bins',q:'During an investigation, do or don’t?',bins:[['Do','Helps a fair process'],['Don’t','Hurts it or retaliates']],\n    items:[['Share your notes with HR',0],['Tell the crew who reported',1],['Keep the reporter’s schedule the same or better',0],['Ask the accused what they “really” did, on your own',1],['Keep it private, even from friends',0],['Hint to the reporter that they’re causing drama',1]],\n    why:'Support the process, keep it private, and protect the reporter from any bad treatment.'},\n  {t:'mc',kind:'Your move',scene:'While HR investigates, the two people still work the same shift and it’s tense.',q:'What’s the best move?',opts:['Talk to HR about changing the accused’s schedule, not the reporter’s','Move the reporter to the night shift','Do nothing until it’s over'],a:0,\n    why:'Temporary changes are okay, but they shouldn’t punish the person who reported. Work it out with HR.'},\n  {t:'tiles',pose:'think',say:SK==='ca'?'A fair investigation in California is:':'A fair investigation is:',tiles:[\n    {icon:'clock',c:'',b:'Prompt',s:'It starts right away.'},\n    {icon:'scale',c:'o',b:'Neutral',s:'Done by someone without a stake in it.'},\n    {icon:'book',c:'p',b:'Thorough',s:'Talks to everyone involved and writes it down.'},\n    {icon:'check',c:'g',b:'Closed out',s:'Reaches a conclusion and takes action if needed.'}]}\n ]},\n {id:'s6',title:'Dating, favoritism and power',icon:'heartI',mins:6,steps:[\n  {t:'talk',pose:'think',say:'Dating someone you supervise is risky. <b>Power makes “yes” hard to judge.<\/b> If it ends, it can quickly turn into a harassment or retaliation claim. Follow your company’s dating policy.'},\n  {t:'swipe',q:'Okay, or a problem?',left:'Problem',right:'Okay',items:[\n    ['Asking out someone who reports to you','heartI',0],['Telling HR about a relationship that started before your promotion','report',1],['Giving your partner the best shifts','cal',0],\n    ['Asking a crew member out again after they said no','ban',0],['Being friendly and fair to everyone','smile',1]],\n    why:'When power is involved, even a polite ask can feel like pressure. Disclose relationships and keep decisions fair.'},\n  {t:'mc',kind:'Your move',scene:'Two crew members you supervise start dating. It’s mutual, and they’re fine at work.',q:'What do you do?',opts:['Follow the dating policy and stay fair to both','Split them up on different shifts as punishment','Tease them about it at the huddle'],a:0,\n    why:'Mutual relationships between coworkers aren’t harassment. Treat them fairly and watch for problems if it ends.'}\n ]},\n {id:'s7',title:'If you are accused',icon:'alert',mins:6,steps:[\n  {t:'talk',pose:'calm',say:'Being accused is stressful. How you react matters. <b>Stay calm, cooperate, and don’t contact the person who reported.<\/b>'},\n  {t:'order',q:'HR tells you there’s a complaint about you. Put the steps in order.',items:['Stay calm and listen to HR','Answer questions honestly','Don’t talk about it with the reporter or the crew','Follow any interim steps HR sets'],\n    why:'Cooperating honestly is the best path. Reaching out to the reporter, even to apologize, can look like retaliation.'},\n  {t:'mc',kind:'Your move',scene:'You’re accused. You think it’s unfair, and you want to text the crew member to “clear things up.”',q:'Should you?',opts:['No. Tell your side to HR, and leave the crew member alone','Yes, if you’re polite','Yes, and ask the crew to back you up'],a:0,\n    why:'Contacting the reporter or lobbying the crew can be seen as pressure or retaliation. Talk only to HR.'}\n ]},\n {id:'s8',title:'Coach, don’t bully',icon:'star',mins:6,steps:[\n  {t:'tone',q:'Rewrite this feedback so it’s firm but not abusive.',to:'To: Sam (crew member)',parts:[\n    {o:['Hey, I want to talk about','Wow, you really messed up','Are you stupid or what? Look at'],a:0},' ',\n    {o:['the cooler temps you missed twice this week.','literally everything you did today.','your attitude, as usual.'],a:0},' ',\n    {o:['Let’s go over the checklist before your next shift.','Do better or you’re gone.','Everyone’s talking about it.'],a:0}],\n    why:'Be specific, about the work, and give a next step. Insults and threats are abusive conduct.'},\n  {t:'swipe',q:'Coaching, or abusive?',left:'Abusive',right:'Coaching',items:[\n    ['Private talk about a missed task','chat',1],['Yelling at someone in front of customers','alert',0],['Giving someone impossible tasks to make them quit','clock',0],\n    ['A written warning after a clear pattern','book',1],['Mocking someone’s mistakes at the huddle','users',0]],\n    why:'Coaching is private, specific and fair. Humiliation, sabotage and threats are abusive conduct.'},\n  {t:'reflect',q:'Think of a time you got tough feedback that actually helped. What made it land?',say:'Usually it’s that it was private, specific and came with help. That’s the formula.'}\n ]},\n {id:'s9',title:'What a strong policy has',icon:'doc',mins:5,steps:[\n  SK==='ca'?{t:'multi',q:'California says a strong anti-harassment policy includes which of these? Pick all that apply.',opts:['A list of all protected traits','More than one way to report, not only to your direct boss','A promise of a fair, timely investigation','A rule against retaliation'],a:[0,1,2,3],\n    why:'All of them, plus how complaints stay as private as possible and that supervisors must report. Know where your policy is.'}:\n    {t:'multi',q:'Chicago requires every employer to have a written policy. Which of these must it include? Pick all that apply.',opts:['That sexual harassment is illegal in Chicago, with examples','How to report inside the company and to the Chicago Commission on Human Relations','That every employee must complete training each year','That retaliation for reporting is illegal'],a:[0,1,2,3],\n    why:'All of them. Chicago employers must also keep training records for 5 years. Know where your policy is posted.'},\n  {t:'tiles',pose:'talk',say:'Your job with the policy:',tiles:[\n    {icon:'doc',c:'',b:'Know it',s:'Read it. Know where it’s posted.'},\n    {icon:'users',c:'o',b:'Share it',s:'Remind your team how to report.'},\n    {icon:'check',c:'p',b:'Follow it',s:'Every report, every time.'},\n    {icon:'shield',c:'g',b:'Protect',s:'No retaliation, from you or anyone.'}]},\n  {t:'mc',q:'A crew member asks how to report harassment, but you aren’t sure. What do you do?',opts:['Find the policy with them, and connect them to HR','Tell them to just talk to their friends','Say it’s probably not worth reporting'],a:0,\n    why:'You don’t need every answer. Point them to the policy and HR, and follow up.'}\n ]},\n {id:'s10',title:'Practice: tough calls',icon:'star',mins:8,steps:[\n  {t:'texts',q:'Your top performer messages you.',chat:'Ryan (crew)',sub:'Top seller · 3 years',icon:'user',rounds:[\n    {msgs:[['','Wednesday 4:10 PM'],['Ryan','yo did Maya complain about me?? 😂'],['Ryan','she can’t take a joke, u know how i am']],ask:'What do you send?',opts:[\n      {t:'I can’t talk about that. HR handles it. Please keep things professional and don’t talk to Maya about it.',ok:1,fb:'You protected the process and the reporter, without picking sides.',then:[['Ryan','ok whatever']]},\n      {t:'lol yeah she’s sensitive, don’t worry',ok:0,fb:'That takes sides and could signal retaliation is okay. It also puts you in the complaint.',then:[['Ryan','haha thx boss']]},\n      {t:'Yeah she did, said u touched her',ok:0,fb:'Never share details. It could put Maya at risk.',then:[['Ryan','WOW ok']]}]}],\n    why:'Don’t confirm, deny or discuss a complaint. Remind them to stay professional and away from the reporter.'},\n  {t:'mc',kind:'Your move',scene:'A worker tells you a vendor who delivers twice a week keeps cornering her in the stockroom.',q:'What do you do?',opts:['Report to HR, and arrange so she isn’t alone with the vendor while it’s handled','Tell her vendors aren’t your problem','Tell her to avoid the stockroom on delivery days'],a:0,\n    why:'Harassment by vendors and customers counts. Report it and protect her, without making her change her job.'},\n  {t:'pledge',say:'You set the tone for your crew. Ready to commit?',lines:['I know the line, and I hold my team to it.','I stop it when I see it, and I never retaliate.','I report every concern to HR, the same day.']}\n ]}\n];\n\n/* ---------- extended case practice (Connecticut and California supervisor versions) ---------- */\nconst PRACTICE=[\n {id:'p1',title:'Case: the closing shift',icon:'moon',mins:7,steps:[\n  {t:'talkback',q:'You’re the third coworker. You find her alone in the back.',who:'Coworker',meter:50,start:'s',labels:['Supported','Unsure','Alone'],\n    why:'Check in, believe them, offer help, and let them choose. Offer to come with them to report.',nodes:{\n    s:{say:'Ugh, sorry. I’m fine. He’s just… a lot.',choices:[\n      {t:'“I noticed too. It didn’t look okay. Want to talk?”',d:-25,to:'mid',fb:'You named what you saw. That tells her she’s not imagining it.'},\n      {t:'“Just tell him to back off.”',d:15,to:'bad',fb:'Easy to say, hard to do. Advice without support can feel like blame.'}]},\n    mid:{say:'I don’t want to get him fired or anything.',choices:[\n      {t:'“That’s not up to you. Want me to come with you to talk to the manager?”',d:-25,to:'good',fb:'You took the weight off her a
