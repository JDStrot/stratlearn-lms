20} C${x-40},${y-4} ${x-20},${y-10} ${x},${y-10} C${x+22},${y-10} ${x+40},${y-2} ${x+40},${y+20}Z\" fill=\"${PAL.stoneD}\"/><path d=\"M${x-40},${y+20} C${x-38},${y+2} ${x-18},${y-6} ${x},${y-6} C${x+10},${y-6} ${x+22},${y-2} ${x+28},${y+6} C${x+10},${y+2} ${x-20},${y+6} ${x-40},${y+20}Z\" fill=\"${PAL.stone}\"/>`;\n  return `<ellipse cx=\"${x}\" cy=\"${y+8}\" rx=\"44\" ry=\"13\" fill=\"${PAL.leafD}\"/><ellipse cx=\"${x}\" cy=\"${y+4}\" rx=\"44\" ry=\"13\" fill=\"${PAL.leaf}\"/><path d=\"M${x},${y+4} L${x+40},${y-1} L${x+40},${y+9}Z\" fill=\"${PAL.water1}\"/><path d=\"M${x-30},${y} q14,-6 30,-6\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\" fill=\"none\" opacity=\".45\"/>`;\n}\n\n/* ---------- arrangement: same frame, the pieces move (x in % of width) ---------- */\nconst ARR=[\n  {lot:28,prop:62,host:86},\n  {lot:72,prop:36,host:12},\n  {lot:50,prop:18,host:84},\n  {lot:56,prop:84,host:16}\n][T.arr%4];\nconst fam=(window.lakeFAM&&lakeFAM[LAKE.fam])||{m:'#1C9C9A',d:'#137877',l:'#BFEAE5'};\nconst icoL=(k,c)=>(window.lakeLICO&&lakeLICO[k])?lakeLICO[k](c):'';\nconst smallFam={m:PAL.main,d:PAL.deep,l:PAL.soft};\n\n/* state / yearly flag: always planted in the ground on a background mound (Jesse 2026-11-23: no flags in mid air).\n   Rock courses use the lighthouse mound; everyone else gets a small grassy mound on the far side, behind the host. */\nfunction flag(){\n  if(!T.tag)return '';\n  const long=T.tag.length>3, fw=long?50:40, right=ARR.host>50;\n  let x,base,mound='',dir;\n  if(T.setting==='rock'){x=268;base=WL-36;dir=-1}\n  else{x=right?334:26;base=WL-10;dir=right?-1:1;\n    const g=T.dusk?PAL.mid:PAL.leafD, g2=T.dusk?PAL.far:PAL.leaf;\n    mound=`<path d=\"M${x-44},${WL+4} C${x-34},${WL-16} ${x+34},${WL-16} ${x+44},${WL+4}Z\" fill=\"${g}\"/><path d=\"M${x-36},${WL+2} C${x-26},${WL-12} ${x+20},${WL-14} ${x+30},${WL-4} C${x+10},${WL-8} ${x-20},${WL-6} ${x-36},${WL+2}Z\" fill=\"${g2}\"/>`}\n  const top=base-74, cx=x+dir*(fw/2+1);\n  const cloth=dir>0?`M${x},${top} H${x+fw} L${x+fw-8},${top+13} L${x+fw},${top+26} H${x}Z`:`M${x},${top} H${x-fw} L${x-fw+8},${top+13} L${x-fw},${top+26} H${x}Z`;\n  return `${mound}<path d=\"M${x},${base+2} V${top-4}\" stroke=\"${PAL.woodD}\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"${x}\" cy=\"${top-5}\" r=\"3.5\" fill=\"${PAL.wood}\"/>\n    <path d=\"${cloth}\" fill=\"${PAL.deep}\"/><text x=\"${cx+dir*-2}\" y=\"${top+18}\" text-anchor=\"middle\" font-family=\"Fredoka,Nunito,sans-serif\" font-weight=\"600\" font-size=\"${long?11:14}\" fill=\"#fff\">${esc(T.tag)}<\/text>\n    <ellipse cx=\"${x}\" cy=\"${base+3}\" rx=\"7\" ry=\"2.5\" fill=\"#000\" opacity=\".12\"/>`;\n}\nfunction sceneSvg(){\n  const [back,front]=(SET[T.setting]||SET.commons)();\n  const px=ARR.prop/100*W, py=WL-12;\n  /* soft light behind the topic prop so it reads clearly over hills, bridges and stalls */\n  const halo=`<circle cx=\"${px}\" cy=\"${py-42}\" r=\"54\" fill=\"url(#thhalo)\"/>`;\n  return `<svg class=\"th-scene\" viewBox=\"0 0 ${W} ${Hh}\" preserveAspectRatio=\"xMidYMid slice\" aria-hidden=\"true\">\n    <defs><linearGradient id=\"thsky\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"${PAL.sky1}\"/><stop offset=\"1\" stop-color=\"${PAL.sky2}\"/><\/linearGradient>\n    <radialGradient id=\"thhalo\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\"${T.dusk?.42:.75}\"/><stop offset=\".6\" stop-color=\"#fff\" stop-opacity=\"${T.dusk?.18:.35}\"/><stop offset=\"1\" stop-color=\"#fff\" stop-opacity=\"0\"/><\/radialGradient><\/defs>\n    <rect width=\"${W}\" height=\"${Hh}\" fill=\"url(#thsky)\"/>${sunAt()}${skyLayer()}${back}${water()}${front}${flag()}${halo}\n    ${pedestal(PED[T.setting]||'lily',px,py)}<\/svg>`;\n}\nconst MAINI=[T.icon,...(T.small||[]),'shield','hearts'].find(k=>window.lakeLICO&&lakeLICO[k])||T.icon;\nfunction propsHtml(){\n  const big=`<div class=\"th-prop\" style=\"left:${ARR.prop}%\"><svg viewBox=\"0 0 64 64\" aria-hidden=\"true\"><g class=\"th-bob
