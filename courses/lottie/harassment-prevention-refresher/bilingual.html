nd offered real backup.'},\n      {t:'“Then I guess just deal with it.”',d:25,to:'bad',fb:'That leaves her alone with it.'}]},\n    good:{end:1,good:1,say:'Okay. Yeah. Tomorrow before shift?',title:'You had her back.',msg:'Delay plus Delegate: you checked in and helped her report.'},\n    bad:{end:1,good:0,act:'She shrugs and goes back to mopping.',title:'She’s on her own.',msg:'Try checking in and offering to go with her.'}}},\n  {t:'reflect',q:'What would make it hard for you to step in, in a moment like this?',say:'Fear of drama or getting it wrong is normal. That’s why “Delay” counts: checking in later is still stepping in.'}\n ]},\n {id:'p2',title:'Case: the group chat',icon:'chat',mins:6,steps:[\n  {t:'post',kind:'Group chat check',q:'Your team’s chat this week. Should these be posted?',items:[\n    {pic:'Screenshot of a coworker’s dating profile',cap:'look who’s on the apps 💀',icon:'heartI',ok:0,where:'team chat',why:'Sharing someone’s private profile to mock them is harassment and a privacy problem.'},\n    {pic:'Shift swap request',cap:'anyone want my sat close? 🙏',icon:'cal',ok:1,where:'team chat',why:'This is what the chat is for.'},\n    {pic:'Edited photo of a coworker’s face on a body',cap:'new uniform for [name] lol',icon:'camera',ok:0,where:'team chat',why:'Sexualized edits of a real person are serious harassment. Report it.'}],\n    why:'If it targets, mocks or sexualizes a coworker, it doesn’t belong anywhere.'},\n  {t:'mc',kind:'Your move',scene:'Someone posts a sexual edit of a coworker in the group chat. Ten people react with 😂.',q:'What’s the best move?',opts:['Screenshot it, say “not okay,” and report it to a manager','React with 😂 so you don’t stand out','Delete the app'],a:0,\n    why:'Save proof, say something if safe, and report. Tell the coworker gently, so they aren’t blindsided.'},\n  {t:'blank',q:'Fill in the motto.',parts:['Know it. ',0,' it. Report it.'],answer:['Stop'],bank:['Stop','Post','Ignore'],\n    why:'Know it. Stop it. Report it.'}\n ]},\n {id:'p3',title:'Case: the customer regular',icon:'cash',mins:6,steps:[\n  {t:'mc',kind:'Your move',scene:'You’re the manager. A regular customer tips big, always asks for the same young worker, and comments on her looks. She finally tells you she dreads his visits.',q:'What should you do?',opts:['Thank her, take over that customer yourself, warn or ban him, and document it','Remind her he tips well','Tell her to wear headphones'],a:0,\n    why:'Employers must act on customer harassment once they know. Big tips don’t change that.'},\n  {t:'order',q:'Put the manager’s steps in order.',items:['Thank the worker and listen','Take her off that customer right away','Tell the customer to stop, or ban him','Write it up and follow up with her'],\n    why:'Listen, protect, act on the customer, document and follow up.'}\n ]},\n {id:'p4',title:'Case: the joke that wasn’t',icon:'user',mins:6,steps:[\n  {t:'swipe',q:'Each line was said in one week. Okay, or over the line?',left:'Over the line',right:'Okay',items:[\n    ['“Can you cover my Friday?”','cal',1],['“You people always run late.”','users',0],['“Nice job on inventory.”','star',1],\n    ['“Is your husband okay with you working nights?”','user',0],['“Pray for me on this shift 😂”','smile',1],['“Your religion is weird.”','ban',0]],\n    why:'Comments that single people out for their group, marital status or faith add up fast.'},\n  {t:'reflect',q:'Have you ever said something as a joke that didn’t land? What did you do after?',say:'Everyone slips sometimes. A quick “That was out of line, sorry,” and not repeating it, goes a long way.'},\n  {t:'mc',kind:'Your move',scene:'A coworker tells you a joke you made about their accent hurt.',q:'What do you say?',opts:['“You’re right. That was out of line. I’m sorry, and I won’t do it again.”','“Relax, it was a joke.”','“Everyone else laughed.”'],a:0,\n    why:'Own it, apologize and change. Defending the joke makes it worse.'}\n ]}\n];\n\n/* ---------- Washington isolated workers (RCW 49.60.515) ---------- */\nconst WA_LESSONS=[\n {id:'w1',title:'Working alone',icon:'user',mins:5,steps:[\n  {t:'talk',pose:'calm',say:'Housekeepers, room service, janitors and security guards often <b>work alone<\/b>, behind closed doors or late at night. That can make harassment and assault easier to hide.',rule:'<b>Washington law<\/b> gives isolated workers in hotels, motels, retail, security and janitorial work extra protection: a <b>panic button<\/b>, a written policy, a list of resources, and this training.'},\n  {t:'swipe',q:'Is this person an “isolated worker”?',left:'Isolated worker',right:'Not usually',items:[\n    ['A housekeeper cleaning guest rooms alone most of the shift','bed',0],['A night janitor cleaning an office building alone','broom',0],['A security guard on a solo overnight patrol','shield',0],\n    ['A cashier with three coworkers on the floor','cash',1],['A room service attendant delivering to rooms','bell',0]],\n    why:'If you spend most of your hours with no coworker or supervisor close enough to help, you count. Ask your employer if you’re not sure.'},\n  {t:'mc',kind:'Your move',scene:'You knock and enter a room to clean. A guest is inside, closes the door behind you and stands in front of it.',q:'What do you do?',opts:['Leave right away if you can, and press your panic button if you feel unsafe','Finish cleaning fast so it’s over','Say nothing so you don’t upset the guest'],a:0,\n    why:'Your safety comes first. Get out, press the button, and report it. You will not get in trouble for leaving a room.'}\n ]},\n {id:'w2',title:'Your panic button',icon:'alert',mins:5,steps:[\n  {t:'tiles',pose:'talk',say:'Your employer must give you a panic button that:',tiles:[\n    {icon:'hand',c:'',b:'You carry it',s:'On you, all shift, in every room or area you work.'},\n    {icon:'bolt',c:'o',b:'Works in one press',s:'No password, no screens, no waiting.'},\n    {icon:'pin',c:'p',b:'Shows where you are',s:'So help can find you fast.'},\n    {icon:'users',c:'g',b:'Brings help now',s:'Someone is trained to respond, every shift.'}]},\n  {t:'multi',q:'When can you press the panic button? Pick all that apply.',opts:['A guest grabs or touches you','Someone traps you in a room','You feel threatened and want help close by','You finished early and want a ride'],a:[0,1,2],\n    why:'Use it whenever you believe you’re in danger, including harassment or assault. You don’t need to be sure. Better safe.'},\n  {t:'order',q:'You pressed the button. Put what comes next in order.',items:['Move toward a door or a public area if you can','Wait for help, and keep the button with you','Tell your supervisor what happened','Write down details, or ask for help writing them'],\n    why:'Get to safety, let help reach you, then report. Your employer can’t punish you for using the button.'},\n  {t:'mc',kind:'True or false',q:'Your employer can write you up for pressing the panic button if it turns out you were safe.',opts:['True','False'],a:1,noShuffle:1,\n    why:'False. Using the button in good faith is protected. If your button is missing or broken, tell your manager, or report it to L&I.'}\n ]},\n {id:'w3',title:'Help that’s outside work',icon:'heartI',mins:4,steps:[\n  {t:'flip',q:'Your employer must give you a list of resources. Tap each card.',cards:[\n    {icon:'scale',c:'',front:'WSHRC',hint:'Tap to flip',back:'<b>Washington State Human Rights Commission.<\/b>hum.wa.gov · 1-800-233-3247.'},\n    {icon:'book',c:'o',front:'EEOC',hint:'Tap to flip',back:'<b>Federal agency.<\/b>eeoc.gov · 1-800-669-4000.'},\n    {icon:'shield',c:'p',front:'L&I',hint:'Tap to flip',back:'<b>No panic button, policy or training?<\/b>Report it: isolatedworkers@lni.wa.gov.'},\n    {icon:'heartI',c:'g',front:'Local advocates',hint:'Tap to flip',back:'<b>Free, private support.<\/b>Sexual assault programs can help even if you don’t report.'}]},\n  {t:'reflect',q:'Where is your panic button right now, or where would you get one? Who would you call first if something happened?',say:'Knowing this before you need it is a real safety skill. If you don’t have a button yet, ask your manager today.'},\n  {t:'mc',kind:'Your move',scene:'A guest grabbed you. You got away and you’re safe, but you’re shaking.',q:'What’s a good next step?',opts:['Tell your supervisor, and call 911 if it was an assault','Keep working and forget it','Post about the guest online'],a:0,\n    why:'Sexual assault is a crime. Report it at work and to police if you choose. Advocates can support you either way.'}\n ]}\n];\n\n/* ---------- Chicago bystander hour ---------- */\nconst BYST=[\n {id:'b1',title:'Why people freeze',icon:'eye',mins:10,steps:[\n  {t:'talk',pose:'calm',say:'Chicago asks everyone to learn to be an <b>active bystander<\/b>: someone who sees harassment and does something, even something small.',rule:'<b>Why we freeze:<\/b> we think someone else will act, we’re not sure it’s “that bad,” or we’re afraid of making it worse.'},\n  {t:'flip',q:'The 3 things that stop people from helping. Tap each card.',cards:[\n    {icon:'users',c:'',front:'“Someone else will”',hint:'Tap to flip',back:'<b>The bigger the crowd, the less people act.<\/b>Assume it’s on you.'},\n    {icon:'eye',c:'o',front:'“Maybe it’s fine”',hint:'Tap to flip',back:'<b>Watch the person’s face, not the joke.<\/b>Stiff, quiet or leaving means it’s not fine.'},\n    {icon:'alert',c:'p',front:'“I’ll make it worse”',hint:'Tap to flip',back:'<b>Small moves are safe.<\/b>A distraction or a check-in rarely backfires.'}]},\n  {t:'dial',q:'Guess: when people see harassment at work, about how many do nothing?',start:0,answer:[2],stops:[\n    {v:'Almost nobody',fx:'Higher than that.'},\n    {v:'About 1 in 4',fx:'Higher than that.'},\n    {v:'About half or more',fx:'Studies say <b>most witnesses don’t step in<\/b>, usually because they don’t know what to do.',mark:1},\n    {v:'Everyone',fx:'Not quite.'}],\n    why:'Most bystanders do nothing, not because they don’t care, but because they don’t have a plan. Now you’ll have one.'},\n  {t:'reflect',q:'Think of a time you saw something wrong and didn’t act. What held you back?',say:'That’s honest, and very normal. The next lessons give you easy moves for exactly that moment.'}\n ]},\n {id:'b2',title:'Practice the 5 Ds',icon:'users',mins:12,steps:[\n  {t:'bins',q:'Match each move to its D.',bins:[['Direct','Say something now'],['Distract','Break the moment'],['Document','Record facts']],\n    items:[['“Hey, that’s not okay. Knock it off.”',0],['“Can you help me find the keys?”',1],['Writing down the time, place and words you heard',2],['“Stop. She already said no.”',0],['Asking a random question to change the subject',1],['Saving a screenshot for the person it happened to',2]],\n    why:'All five Ds work. Direct and Distract happen in the moment. Document helps later. Always ask the person before sharing anything you recorded.'},\n  {t:'texts',q:'You’re in the work group chat.',chat:'Weekend Crew',sub:'9 members',icon:'users',rounds:[\n    {msgs:[['','Sunday 8:03 PM'],['Tyler','lmao look what Ana posted 🔥🔥'],['Tyler','(photo of Ana from her page)'],['Tyler','rate her 1-10 boys']],ask:'You want to step in. What do you send?',opts:[\n      {t:'Nah. Take that down, that’s not cool.',ok:1,fb:'Direct, short and public. Others in the chat now know someone is watching.',then:[['Jay','ya fr delete that'],['Tyler','fine relax']]},\n      {t:'yo who’s covering tuesday close?',ok:1,fb:'A Distract move works too. You changed the subject. Now follow up by reporting it.',then:[['Mia','i can'],['','The photo gets buried.']]},\n      {t:'(Say nothing)',ok:0,fb:'Silence can look like agreement. A short message or a quiet report to your manager still helps.',then:[['Tyler','no one? lol']]}]}],\n    why:'In a chat, a short message or a subject change breaks the momentum. Then tell a manager, and check in with Ana.'},\n  {t:'talkback',q:'At the end of a shift, a lead keeps blocking a new worker’s path and standing too close. She looks frozen.',who:'You',meter:55,start:'s',labels:['Helped','Unsure','Ignored'],\n    why:'Any D is better than none. Distract and Delegate are the safest when the person doing it has power over you.',nodes:{\n    s:{act:'You’re 10 feet away, holding a box.',say:'(What do you do?)',choices:[\n      {t:'Walk over: “Hey, Sam, I need you up front for a sec.”',d:-25,to:'mid',fb:'Distract. You gave her a way out without a fight.'},\n      {t:'Keep stocking. It’s not your business.',d:25,to:'bad',fb:'It’s a normal reaction. But she’s stuck, and you can help with one sentence.'}]},\n    mid:{act:'She walks off with you. The lead looks annoyed.',say:'(Now what?)',choices:[\n      {t:'Quietly: “You okay? That looked uncomfortable. Want me to go with you to the manager?”',d:-25,to:'good',fb:'Delay plus Delegate. You checked in and offered backup.'},\n      {t:'Say nothing and go back to work.',d:10,to:'bad',fb:'You helped once. A check-in makes it stick.'}]},\n    good:{end:1,good:1,say:'Yeah… thank you. Can we go now?',title:'You stepped in.',msg:'You broke the moment, checked in, and helped her report. That’s an active bystander.'},\n    bad:{end:1,good:0,act:'She leaves the shift alone and quiet.',title:'She’s on her own.',msg:'Try a Distract move: a reason to pull her away. It’s small, safe and it works.'}}}\n ]},\n {id:'b3',title:'Stepping in safely',icon:'shield',mins:10,steps:[\n  {t:'swipe',q:'Safe way to help, or risky?',left:'Risky',right:'Safe way to help',items:[\n    ['Asking the person later if they’re okay','chat',1],['Getting into a shoving match with the harasser','alert',0],['Getting a manager to come over','users',1],\n    ['Filming and posting it without asking the person','camera',0],['Inviting the person to step away with you','hand',1]],\n    why:'Your safety matters too. Pick moves that don’t put you or the person in danger. Never post someone’s experience without asking.'},\n  {t:'mc',kind:'Your move',scene:'A coworker tells you, “Thanks for stepping in. But please don’t report it. I don’t want drama.”',q:'What’s the best response?',opts:['Respect their feelings, share where they can report, and tell a manager if your policy requires it','Report it to everyone','Promise you’ll never tell anyone, no matter what'],a:0,\n    why:'Respect their choice where you can. If you’re a supervisor, you must report. Either way, let them know retaliation is illegal.'},\n  {t:'order',q:'Put the active bystander steps in order.',items:['Notice something is wrong','Decide it’s your moment to help','Pick a D that feels safe','Check in with the person after'],\n    why:'Notice, decide, act, follow up. That’s it.'},\n  {t:'pledge',say:'Being a bystander who helps is a skill. Ready to commit?',lines:['I notice when something’s not okay.','I use a D that feels safe: Direct, Distract, Delegate, Delay or Document.','I check in after, and I report it.']}\n ]}\n];\n\n/* ---------- final check ---------- */\n/* ---------- tipped and hospitality work (il-rest, dc) ---------- */\nconst R_LESSONS=[\n {id:'r1',title:'Tips, regulars and power',icon:'cash',mins:6,steps:[\n  {t:'talk',pose:'calm',say:'When your pay depends on tips, customers can feel like they have power over you. But <b>a tip never buys the right to harass you.<\/b> “The customer is always right” stops at harassment.',\n    rule:SK==='il'?'<b>Illinois law<\/b> requires restaurants and bars to train everyone on harassment in this industry and on what managers must do, in English and Spanish.':'<b>DC law<\/b> requires businesses with tipped workers to train workers and managers, and to track harassment complaints and report them to the Office of Human Rights every year.'},\n  {t:'swipe',q:'Part of the job, or harassment? Swipe each one.',left:'Harassment',right:'Part of the job',items:[\n    ['A regular calls you “sweetheart” every visit after you asked him to stop','chat',0],['A guest asks to move to a different table','users',1],\n    ['A big tip with his number and “call me or no more tips”','cash',0],['A cook grabs your waist “to get by” on the line','hand',0],\n    ['A manager says “flirt a little, it’s good for tips”','crown',0],['A customer sends back a cold plate','check',1]],\n    why:'Complaints about food and service are part of the job. Sexual comments, touching and “tips for attention” aren’t, even when the customer is a regular.'},\n  {t:'mc',kind:'Your move',scene:'A big-spending regular keeps touching your arm and back. When you tell your manager, she says, “He’s our best customer. Just smile.”',q:'What’s true?',opts:['The business still has to act, even for its best customer','You have to put up with it because he tips well','Only the customer can decide to stop'],a:0,\n    why:'Once a manager knows, the business must act: swap who serves him, warn him or ban him. If your manager won’t, go to the owner, HR or the agency.'},\n  {t:'reflect',q:'What’s a line a customer has crossed with you or someone you know at work?',say:'You’re not alone. Naming it makes it easier to spot, and easier to say “that’s not okay” next time.'}\n ]},\n {id:'r2',title:'Kitchen, bar and after close',icon:'users',mins:6,steps:[\n  {t:'flip',q:'Where it shows up in restaurants and bars. Tap each card.',cards:[\n    {icon:'chat',c:'',front:'Behind the line',hint:'Tap to flip',back:'<b>“Kitchen culture” is no excuse.<\/b>Crude jokes, grabbing and slurs are harassment, even when it’s busy.'},\n    {icon:'clock',c:'o',front:'After close',hint:'Tap to flip',back:'<b>Shift drinks and after-parties count.<\/b>If it involves work people, the rules still apply.'},\n    {icon:'cal',c:'p',front:'Sections and shifts',hint:'Tap to flip',back:'<b>Good sections for a date?<\/b>Trading shifts or tables for sexual attention is “this for that” harassment.'},\n    {icon:'hands',c:'g',front:'Any language',hint:'Tap to flip',back:'<b>Harassment in Spanish or any language counts.<\/b>So do jokes about someone’s accent or English.'}]},\n  {t:'order',q:'A server tells the manager a customer grabbed her. Put the manager’s steps in order.',items:['Thank her and take her off that table right away','Talk to the customer, or ask him to leave','Write down what happened and who saw it','Report it to the owner or HR the same day'],\n    why:'Protect the worker first, then deal with the customer, write it down and pass it up. Never wait for it to happen again.'},\n  {t:'mc',kind:'True or false',q:`In ${ST.name}, a restaurant or bar can be held responsible when a manager knows about harassment by a customer or coworker and does nothing.`,opts:['True','False'],a:0,noShuffle:1,\n    why:'True. Managers speak for the business. Once a manager knows, the business must act. A manager who harasses someone can also be personally responsible.'}\n ]}\n];\n\n/* ---------- yearly refresher (refresh) ---------- */\nconst REFRESH=[\n {id:'y1',title:'Welcome back',icon:'star',mins:3,steps:[\n  {t:'talk',pose:'calm',say:'Welcome back. You’ve done this before, so we’ll skip the basics and go straight to <b>new situations<\/b>. About 15 minutes.',rule:'<b>Still the same three things:<\/b> Know it. Stop it. Report it.'},\n  {t:'swipe',q:'Myth or fact? Swipe each one.',left:'Myth',right:'Fact',items:[\n    ['“It’s only harassment if they meant it.”','chat',0],['Harassment can happen in a group chat after hours.','phone',1],['“If you didn’t report it right away, it doesn’t count.”','clock',0],\n    ['A customer can harass you.','cash',1],['Reporting a coworker is “snitching.”','ban',0]],\n    why:'Impact matters more than intent, waiting doesn’t erase it, and reporting is protected. Online and customers count too.'}\n ]},\n {id:'y2',title:'New tech, same rules',icon:'phone',mins:4,steps:[\n  {t:'talk',pose:'think',say:'Phones and AI make new kinds of harassment easy: <b>edited photos, fake videos, secret recordings and “rating” posts<\/b>. The rules don’t change. If it targets someone from work, it counts.'},\n  {t:'post',kind:'Group chat check',q:'Your coworkers want to post these in the crew chat. Post it or skip it?',items:[\n    {pic:'AI image putting a coworker’s face on a swimsuit photo',cap:'lol AI is wild 😂',icon:'camera',ok:0,where:'crew chat',why:'A fake sexual image of a real coworker is harassment, even if it’s “obviously fake.” In many states it’s also a crime.'},\n    {pic:'Group photo from the holiday party',cap:'best crew 🎉',icon:'users',ok:1,where:'crew chat',why:'Everyone’s in it and nobody’s the joke. Post it.'},\n    {pic:'Poll: “hottest new hire?” with photos',cap:'vote 🔥',icon:'eye',ok:0,where:'crew chat',why:'Rating coworkers’ looks is sexual harassment, even as a “poll.”'},\n    {pic:'Secret video of a coworker crying in the break room',cap:'she’s so dramatic 💀',icon:'camera',ok:0,where:'crew chat',why:'Filming someone’s worst moment to mock them is bullying and a privacy problem. Skip it.'}],\n    why:'If it targets a real person from work, or was taken without them knowing, don’t post it.'},\n  {t:'texts',q:'A coworker texts you late on a Friday.',chat:'Tyler (coworker)',sub:'Works your shift',icon:'user',rounds:[\n    {msgs:[['','Friday 10:31 PM'],['Tyler','look what i made of Brianna with that AI app 😂😂'],['Tyler','[image]'],['Tyler','send it to the group?']],ask:'What do you send?',opts:[\n      {t:'Bro no. Delete that. Not okay.',ok:1,fb:'Short and clear. You stopped it before it spread.',then:[['Tyler','chill it’s fake'],['Tyler','fine. deleted']]},\n      {t:'😂 do it',ok:0,fb:'That makes you part of it, and a group chat spreads it in seconds.',then:[['Tyler','sending 😈']]},\n      {t:'(Leave it on read)',ok:0,fb:'Silence can read as “okay.” A short “no” helps, and you can still tell a manager or HR.',then:[]}]},\n    {msgs:[['','Monday'],['Tyler','u didn’t tell anyone right?']],ask:'Brianna doesn’t know yet. What now?',opts:[\n      {t:'(Tell your manager or HR, without forwarding the image)',ok:1,fb:'Right. HR can act fast. Don’t pass the image around, even as proof. Just say it exists and who has it.',then:[['','You told HR.']]},\n      {t:'nah ur good',ok:0,fb:'Even if it was deleted, copies spread. Brianna deserves to know, and HR can help.',then:[]}]}],\n    why:'Fake doesn’t mean harmless. Don’t share it, say no, and report it.'},\n  {t:'mc',kind:'Your move',scene:'A customer starts filming you and making comments about your body. He says he’ll post it.',q:'What’s your best move?',opts:['Step away, get a manager, and report it','Argue with him on camera','Ignore it, customers can do what they want'],a:0,\n    why:'You don’t have to stay and be filmed. Get backup. Your employer has to act on harassment by customers.'}\n ]},\n {id:'y3',title:'“It was just a joke”',icon:'chat',mins:4,steps:[\n  {t:'talkback',q:'You told a coworker his comment about the new hire’s looks wasn’t cool. He pushes back.',who:'Andre (coworker)',meter:50,start:'s',labels:['Handled','Tense','Escalating'],\n    why:'You don’t have to win the argument. Name the impact, stay calm, and report it if it keeps going.',nodes:{\n    s:{say:'Relax, it was a joke. You’re way too sensitive.',choices:[\n      {t:'“Maybe. But it wasn’t funny to her. Let’s drop it.”',d:-20,to:'mid',fb:'Calm and short. You didn’t debate the joke. You named the impact.'},\n      {t:'“Wow, you’re disgusting.”',d:20,to:'worse',fb:'A fair feeling, but insults turn it into a fight about you.'},\n      {t:'Laugh so it’s not awkward.',d:25,to:'bad',fb:'Laughing tells him the comments are fine.'}]},\n    mid:{say:'Whatever. Everyone was laughing.',choices:[\n      {t:'“Not everyone. If it keeps happening, I’ll mention it to the manager.”',d:-25,to:'good',fb:'Clear line, clear next step.'},\n      {t:'“Yeah, okay, fair.”',d:15,to:'bad',fb:'You backed off. It’s okay, but he’ll take that as a green light.'}]},\n    worse:{act:'Andre gets louder. Others look over.',say:'Oh, so now I’m the bad guy?',choices:[\n      {t:'“I’m not trying to fight. Just drop the comments about her.” Then walk away.',d:-25,to:'good',fb:'You cooled it down and kept the point.'},\n      {t:'Keep arguing.',d:20,to:'bad',fb:'Now it’s a shouting match, and the new hire is in the middle.'}]},\n    good:{end:1,good:1,say:'Fine. Whatever.',title:'You held the line.',msg:'You named the impact, stayed calm and didn’t get pulled into a debate. Check in with the new hire, and report it if it keeps happening.'},\n    bad:{end:1,good:0,act:'The comments keep going. The new hire starts eating lunch in her car.',title:'It kept going.',msg:'Jokes that target someone add up. Check in with her, and tell a manager or HR.'}}},\n  {t:'bins',q:'Fine, check in, or report it? Sort each one.',bins:[['Fine','No issue here'],['Check in','Could be unwelcome'],['Report it','Crosses the line']],\n    items:[['Complimenting a coworker’s new haircut, once',0],['Hugging a coworker who always steps back',1],['Nicknames about someone’s accent, even if they laugh',1],\n      ['Asking out the same coworker again after they said no',2],['A lead hinting at better shifts for a date',2],['Touching someone after they said stop',2]],\n    why:'Most people don’t mean harm, but impact is what counts. When someone pulls back, stop. When it’s repeated, about who they are, or tied to power, report it.'}\n ]},\n {id:'y4',title:'Back people up',icon:'shield',mins:4,steps:[\n  {t:'mc',kind:'Your move',scene:'A coworker reported harassment last month. Now the crew leaves her out of the group chat and goes quiet when she walks in.',q:'What helps most?',opts:['Keep including her, and report the freeze-out','Stay out of it so you aren’t next','Tell her she should have kept quiet'],a:0,\n    why:'Freezing someone out for reporting can be retaliation. Backing her up, and reporting it, matters.'},\n  {t:'multi',q:'Which of these are retaliation? Pick all that apply.',opts:['Cutting hours after someone reports','Spreading rumors about the person who reported','Moving someone’s shift because they asked for it','Leaving a witness out of the group chat on purpose'],a:[0,1,3],\n    why:'Any bad treatment because someone reported or helped is retaliation. A change the person asked for isn’t.'},\n  {t:'tiles',pose:'think',say:'Where to report, this year and every year:',tiles:[\n    {icon:'crown',c:'',b:'Your manager',s:'Or any manager, if yours is the problem.'},\n    {icon:'report',c:'o',b:'HR',s:'In person, by email, or with a complaint form.'},\n    {icon:'phone',c:'p',b:'Hotline',s:'If your workplace has one. Check your policy.'},\n    {icon:'scale',c:'g',b:'Outside agency',s:'The EEOC (eeoc.gov) or your state’s civil rights agency.'}]},\n  {t:'reflect',q:'What’s one thing you’ll do differently this year if you see something?',say:'Small moves matter. One “not cool” can change how a whole crew acts.'},\n  {t:'pledge',say:'One more year of respect at work. Ready to commit?',lines:['I don’t share fake or private images of anyone.','I care about impact, not just intent.','I speak up, report it, and back up people who do.']}\n ]}\n];\n\nconst FQ={\n blank:{t:'blank',q:'Fill in the three things to remember.',parts:['Know it. ',0,' it. ',1,' it.'],answer:['Stop','Report'],bank:['Stop','Report','Ignore','Post','Hide'],why:'Know it. Stop it. Report it.'},\n who:{t:'mc',q:'Who can harass someone at work?',opts:['Managers, coworkers, customers and vendors','Only managers','Only people of the opposite sex'],a:0,why:'Anyone at or connected to work can, of any gender.'},\n online:{t:'mc',kind:'Your move',scene:'A coworker keeps DMing you sexual comments at night, after you asked them to stop.',q:'What should you do?',opts:['Save the messages and report it','Delete everything and stay quiet','Post the messages on your story'],a:0,why:'Online counts. Save proof and report it to your manager or HR.'},\n qpq:{t:'mc',q:'A lead offers better shifts if you go on a date with him. What is this called?',opts:['“This for that” (quid pro quo) harassment','A normal workplace perk','Only a problem if you say yes'],a:0,why:'Tying a job benefit to a sexual favor is quid pro quo harassment, illegal even once.'},\n ds:{t:'mc',q:'Which of the 5 Ds means checking in with the person afterward?',opts:['Delay','Direct','Distract'],a:0,why:'Delay: “You okay? That wasn’t right.”'},\n retal:{t:'mc',kind:'True or false',q:'It’s legal to cut someone’s hours because they reported harassment, if the report wasn’t proven.',opts:['True','False'],a:1,noShuffle:1,why:'False. Retaliation is illegal even if the claim isn’t proven.'},\n conf:{t:'mc',q:'What does “limited confidentiality” mean?',opts:['HR keeps it as private as possible, sharing only with people who need to know','Nobody will ever find out','Everyone at work is told'],a:0,why:'HR protects privacy, but may need to talk to others to investigate.'},\n boss:{t:'mc',kind:'Your move',scene:'Your direct manager is the one harassing you.',q:'Where can you report?',opts:['Their boss, HR, or another option in the policy','Only to your direct manager','Nowhere'],a:0,why:'You never have to report to the person harassing you.'},\n deadline:{t:'mc',q:ST.deadlineQ.q,opts:ST.deadlineQ.opts,a:ST.deadlineQ.a,why:ST.deadlineQ.why},\n abusive:{t:'mc',q:'Which is an example of abusive conduct?',opts:['Repeatedly screaming insults at a coworker','A private talk about missed tasks','A fair write-up after a pattern of lateness'],a:0,why:'Abusive conduct is hostile behavior with no business purpose, like repeated insults or humiliation.'},\n traits:{t:'multi',q:'Which are over the line? Pick all that apply.',opts:['Jokes about a coworker’s religion','Calling a coworker “it” instead of their pronouns','Offering better shifts for a date','Saying “nice work” on a project'],a:[0,1,2],why:'Targeting faith or gender identity, and trading favors, are all harassment.'},\n supReport:{t:'mc',kind:'Your move',scene:'A crew member tells you about harassment but asks you to keep it secret.',q:'As a supervisor, what do you do?',opts:['Explain you must report, and tell HR the same day','Promise to keep it secret','Wait to see if it happens again'],a:0,why:'Supervisors must report. Be honest and protect the reporter.'},\n supAccused:{t:'mc',kind:'Your move',scene:'HR tells you that you’ve been accused of harassment.',q:'What should you do?',opts:['Cooperate with HR and don’t contact the reporter','Text the reporter to clear things up','Ask the crew to back you up'],a:0,why:'Contacting the reporter or lobbying the crew can look like retaliation.'},\n supInv:{t:'mc',q:'During an investigation, which temporary change is fair?',opts:['Changing the accused person’s schedule, with HR','Moving the reporter to worse shifts','Telling the team who reported'],a:0,why:'Interim steps protect the reporter and never punish them.'},\n panic:{t:'mc',kind:'Your move',scene:'You’re alone cleaning a room and a guest won’t let you leave.',q:'What should you do?',opts:['Press your panic button and get out if you can','Wait until the guest calms down','Call your friend first'],a:0,why:'That’s exactly what the panic button is for. Then report it.'},\n bystander:{t:'mc',q:'Why do most witnesses not step in?',opts:['They don’t know what to do or think someone else will','They don’t care','It’s against the rules to help'],a:0,why:'A simple plan, like the 5 Ds, fixes that.'},\n misconduct:{t:'mc',q:'In Chicago, what is “sexual misconduct”?',opts:['Sexual behavior that uses pressure or someone’s power at work','Any friendly joke','A fair performance review'],a:0,why:'Coercion, abuse of authority or misuse of a job position, mixed with sexual behavior.'},\n supWho:{t:'mc',kind:'True or false',q:'In California, a supervisor can be personally sued for harassing someone.',opts:['True','False'],a:0,noShuffle:1,why:'True. Individual harassers are personally liable under FEHA.'},\n supLiable:{t:'mc',kind:'True or false',q:'In Illinois, a company is responsible for sexual harassment by a supervisor, even if nobody higher up knew.',opts:['True','False'],a:0,noShuffle:1,why:'True. That’s why supervisors must stop it and report it the same day.'},\n tips:{t:'mc',kind:'Your move',scene:'A regular keeps making sexual comments to you, but he tips really well.',q:'What’s true?',opts:['Your employer must act, even for a big tipper','It’s part of the job if he tips well','Only the customer can fix it'],a:0,why:'A tip never buys the right to harass. Tell your manager, and go higher if nothing changes.'},\n deepfake:{t:'mc',q:'A coworker uses AI to put another coworker’s face on a sexual photo. It’s fake. Is it harassment?',opts:['Yes. Fake sexual images of real coworkers are harassment','No, because it isn’t real','Only if it gets posted publicly'],a:0,why:'Fake doesn’t mean harmless. Don’t share it, and report it.'},\n joke:{t:'mc',q:'Someone says, “It was just a joke.” What matters most?',opts:['How it affected the person it targeted','What the joker meant','Whether other people laughed'],a:0,why:'Impact counts more than intent.'},\n filming:{t:'mc',kind:'Your move',scene:'A customer films you and makes comments about your body.',q:'What should you do?',opts:['Step away, get a manager, and report it','Stay and argue on camera','Ignore it, it’s their right'],a:0,why:'Get backup. Your employer must act on harassment by customers.'}\n};\nconst FINAL_KEYS={\n 'all':['blank','who','online','qpq','ds','retal','conf','boss','deadline','traits'],\n 'ca-staff':['blank','who','online','qpq','ds','retal','conf','abusive','deadline','traits'],\n 'ca-supervisor':['blank','qpq','retal','abusive','deadline','traits','supReport','supAccused','supInv','supWho'],\n 'ny':['blank','who','online','qpq','ds','retal','conf','boss','deadline','traits'],\n 'il':['blank','who','online','qpq','ds','retal','conf','boss','deadline','traits'],\n 'ct':['blank','who','online','qpq','ds','retal','abusive','boss','deadline','traits'],\n 'de':['blank','who','online','qpq','ds','retal','conf','boss','deadline','traits'],\n 'me':['blank','who','online','qpq','ds','retal','conf','boss','deadline','traits'],\n 'wa':['blank','who','panic','qpq','ds','retal','conf','boss','deadline','traits'],\n 'nyc':['blank','who','online','qpq','ds','retal','conf','boss','deadline','traits'],\n 'chi':['blank','misconduct','online','qpq','bystander','ds','retal','boss','deadline','traits'],\n 'chi-supervisor':['blank','misconduct','qpq','bystander','retal','deadline','traits','supReport','supAccused','supLiable'],\n 'il-rest':['blank','who','online','qpq','tips','ds','retal','boss','deadline','traits'],\n 'dc':['blank','who','online','qpq','tips','ds','retal','boss','deadline','traits'],\n 'ma':['blank','who','online','qpq','ds','retal','conf','boss','deadline','traits'],\n 'vt':['blank','who','online','qpq','ds','retal','conf','boss','deadline','traits'],\n 'ri':['blank','who','online','qpq','ds','retal','conf','boss','deadline','traits'],\n 'co':['blank','who','online','qpq','ds','retal','conf','boss','deadline','traits'],\n 'or':['blank','who','online','qpq','ds','retal','conf','boss','deadline','traits'],\n 'nj':['blank','who','online','qpq','ds','retal','conf','boss','deadline','traits'],\n 'refresh':['blank','deepfake','joke','online','qpq','ds','retal','boss','filming','traits']\n};\nconst FINAL={id:'final',title:'Final check',icon:'trophy',final:1,pass:8,steps:FINAL_KEYS[HV].map(k=>FQ[k])};\n\n/* ---------- assemble the version ---------- */\nconst LESSONS=(()=>{\n  const core=CORE.slice();\n  if(HV==='chi-supervisor') return [...core,...SUPER.slice(0,-1),...BYST,...PRACTICE,SUPER[SUPER.length-1],FINAL];  // 2 hr supervisor harassment + 1 hr bystander\n  if(SUP) return [...core,...SUPER.slice(0,-1),...PRACTICE,SUPER[SUPER.length-1],FINAL];  // case practice before the last supervisor lesson\n  if(HV==='ct') return [...core,...PRACTICE,SUP_SHORT,FINAL];\n  if(HV==='ca-staff') return [...core,FINAL];\n  if(HV==='wa') return [...core,...WA_LESSONS,SUP_SHORT,FINAL];\n  if(HV==='chi') return [...core,...BYST,...PRACTICE,SUP_SHORT,FINAL];\n  if(REF) return [...REFRESH,FINAL];\n  if(TIPS) return [...core,...R_LESSONS,SUP_SHORT,FINAL];\n  return [...core,SUP_SHORT,FINAL];\n})();\n\n/* ============ State (per learner, this device) ============ */\nconst KEY='harassment-prevention-refresher-v1';\nconst def=()=>({xp:0,done:{},streak:0,lastDay:'',name:'',mute:false,seen:false,passed:false,passedOn:''});\nlet S=(()=>{try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v)return Object.assign(def(),v)}catch(e){}return def()})();\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};\nconst app=document.getElementById('app');\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nconst dayStr=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();\nconst reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n/* ============ Sound (tiny Web Audio chimes, after a tap only) ============ */\nlet AC=null;\nfunction tone(seq){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;\n  seq.forEach(([f,t,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+t);g.gain.linearRampToValueAtTime(.18,t0+t+.01);g.gain.exponentialRampToValueAtTime(.001,t0+t+d);o.connect(g).connect(AC.destination);o.start(t0+t);o.stop(t0+t+d+.05)})}catch(e){}}\nconst sfx={good:()=>tone([[660,0,.15],[990,.09,.25]]),bad:()=>tone([[220,0,.22,'triangle'],[180,.1,.25,'triangle']]),tap:()=>tone([[520,0,.06]]),win:()=>tone([[523,0,.2],[659,.12,.2],[784,.24,.2],[1047,.36,.4]])};\n\n/* ============ Map ============ */\nfunction curIndex(){const i=LESSONS.findIndex(l=>!S.done[l.id]);return i}\nfunction hud(){\n  return `<div class=\"hud band\"><div class=\"name\">${esc(COURSE.title)}<\/div>\n    <div class=\"pill\" title=\"Day streak\">${flameSvg}<span>${S.streak}<\/span><span class=\"sr\">day streak<\/span><\/div>\n    <div class=\"pill\" title=\"XP\">${boltSvg}<span>${S.xp}<\/span><span class=\"sr\">XP<\/span><\/div>\n    <button class=\"iconbtn\" id=\"muteBtn\" aria-label=\"${S.mute?'Turn sound on':'Turn sound off'}\">${ico(S.mute?'mute':'sound')}<\/button><\/div>`;\n}\nfunction bindHud(){const m=document.getElementById('muteBtn');if(m)m.onclick=()=>{S.mute=!S.mute;save();renderMap()}}\nfunction renderMap(){\n  if(!S.seen)return renderWelcome();\n  const ci=curIndex(), doneN=LESSONS.filter(l=>S.done[l.id]).length, pct=doneN/LESSONS.length;\n  const offs=[0,62,74,10,-60,-10];\n  let nodes='';\n  LESSONS.forEach((l,i)=>{\n    const st=S.done[l.id]?'done':(i===ci?'cur':(ci===-1?'done':'lock'));\n    const icon=st==='lock'?(l.final?'trophy':'lock'):(st==='done'&&!l.final?'check':l.icon);\n    nodes+=`<div style=\"transform:translateX(${offs[i%offs.length]}px);position:relative\">\n      <button class=\"node ${st==='lock'?'':st} ${l.final?'final':''}\" data-i=\"${i}\" aria-label=\"${esc(l.title)}${st==='lock'?' (locked)':st==='done'?' (done)':''}\">\n        ${st==='cur'?`<span class=\"start\">${i===0&&!doneN?'Start':'Next'}<\/span>`:''}${ico(icon,2.6)}<\/button>\n      <div class=\"nodelabel\">${esc(l.title)}<\/div>${i===(ci===-1?LESSONS.length-1:ci)?`<div class=\"pathlottie lottie\" style=\"${offs[i%offs.length]>0?'right:96px':'left:96px'}\">${lottie(ci===-1?(COURSE.calm?'happy':'love'):'hello')}<\/div>`:''}<\/div>`;\n  });\n  app.innerHTML=`${hud()}\n  <div class=\"band\" style=\"padding-block:4px 0\">\n    <div class=\"unit\"><small>Workplace safety · ${COURSE.minutes} min<\/small><h1>${esc(COURSE.title)}<\/h1>\n      <div class=\"meta\">${doneN} of ${LESSONS.length} done<\/div>\n      <svg class=\"ring\" viewBox=\"0 0 56 56\" aria-hidden=\"true\"><circle cx=\"28\" cy=\"28\" r=\"23\" fill=\"none\" stroke=\"rgba(255,255,255,.3)\" stroke-width=\"7\"/><circle cx=\"28\" cy=\"28\" r=\"23\" fill=\"none\" stroke=\"#fff\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-dasharray=\"${(144.5*pct).toFixed(1)} 200\" transform=\"rotate(-90 28 28)\"/><text x=\"28\" y=\"33\" text-anchor=\"middle\" font-family=\"Fredoka,sans-serif\" font-weight=\"600\" font-size=\"15\" fill=\"#fff\">${Math.round(pct*100)}%<\/text><\/svg>\n    <\/div>\n    <div class=\"motto\" aria-label=\"Three things to remember\">${COURSE.motto.map(m=>`<span>${m}<\/span>`).join('')}<\/div>\n  <\/div>\n  <div class=\"band\"><div class=\"path\" id=\"path\">${nodes}<\/div><\/div>\n  ${S.passed?`<div class=\"band\" style=\"padding-block:0 28px\"><button class=\"btn sea\" id=\"seeBadge\">See my badge<\/button><\/div>`:''}`;\n  bindHud();\n  app.querySelectorAll('.node').forEach(b=>b.onclick=()=>openSheet(+b.dataset.i));\n  const sb=document.getElementById('seeBadge');if(sb)sb.onclick=renderBadge;\n  window.scrollTo(0,0);\n}\nfunction lessonMins(l){return Math.max(1,Math.round(l.steps.length*18/60))}\nfunction openSheet(i){\n  const l=LESSONS[i], ci=curIndex(), locked=ci!==-1&&i>ci, done=!!S.done[l.id];\n  const sc=document.createElement('div');sc.className='scrim';\n  sc.innerHTML=`<div class=\"sheet band\" role=\"dialog\" aria-label=\"${esc(l.title)}\">\n    <div class=\"kicker\">${l.final?'Final check':'Lesson '+(i+1)}<\/div>\n    <h2>${esc(l.title)}<\/h2>\n    <div class=\"meta\">${locked?'Finish the lessons before this one to unlock it.':(l.final?`${l.steps.length} questions · get ${l.pass} right to earn your badge`:`About ${lessonMins(l)} min · ${l.steps.length} steps`)}<\/div>\n    ${locked?`<button class=\"btn\" disabled>${ico('lock')} Locked<\/button>`:`<button class=\"btn\" id=\"go\">${done?'Practice again':(l.final?'Take the final check':'Start lesson')}<\/button>`}\n    <button class=\"link\" id=\"cl\">Close<\/button><\/div>`;\n  document.body.appendChild(sc);\n  const close=()=>sc.remove();\n  sc.onclick=e=>{if(e.target===sc)close()};\n  sc.querySelector('#cl').onclick=close;\n  const g=sc.querySelector('#go');if(g){g.onclick=()=>{close();startLesson(i)};g.focus()}\n}\nfunction renderWelcome(){\n  app.innerHTML=`<div class=\"center band\">\n    <div class=\"lottie\" style=\"width:220px\">${lottie('hello')}<\/div>\n    <div class=\"kicker\">Workplace safety · about ${COURSE.minutes} minutes<\/div>\n    <h1 style=\"font-size:34px\">${esc(COURSE.title)}<\/h1>\n    <p class=\"sub\" style=\"max-width:34ch\">${COURSE.blurb}<\/p>\n    <div class=\"motto\">${COURSE.motto.map(m=>`<span>${m}<\/span>`).join('')}<\/div>\n    <div style=\"width:100%;margin-top:8px\"><button class=\"btn\" id=\"go\">Let’s go<\/button><\/div><\/div>`;\n  document.getElementById('go').onclick=()=>{S.seen=true;save();sfx.tap();renderMap()};\n}\n\n/* ============ Lesson player ============ */\nlet P=null;\nfunction startLesson(i){\n  const L=LESSONS[i];\n  P={i,L,queue:L.steps.map((s,k)=>Object.assign({},s,{k})),total:L.steps.length,doneN:0,xp:0,first:0,right:0,qs:L.steps.filter(s=>!['video','talk','tiles','flip','mn','pledge','checkin','breathe','reflect'].includes(s.t)).length,combo:0,best:0,missed:new Set()};\n  renderStep();\n}\nfunction renderStep(){\n  if(!P.queue.length)return finishLesson();\n  const st=P.queue[0];\n  app.innerHTML=`<div class=\"ptop band\">\n      <button class=\"iconbtn\" id=\"quit\" aria-label=\"Leave lesson\">${ico('x',2.6)}<\/button>\n      <div class=\"bar\" role=\"progressbar\" aria-valuemin=\"0\" aria-valuemax=\"${P.total}\" aria-valuenow=\"${P.doneN}\"><i style=\"width:${(P.doneN/P.total*100).toFixed(1)}%\"><\/i><\/div>\n      <div class=\"combo\" aria-live=\"polite\">${P.combo>=2?flameInline()+P.combo:''}<\/div><\/div>\n    <div class=\"stage band\" id=\"stage\"><\/div>\n    <div class=\"foot band\" id=\"foot\"><\/div>`;\n  document.getElementById('quit').onclick=askQuit;\n  const stage=document.getElementById('stage'), foot=document.getElementById('foot');\n  if(st.retry)stage.insertAdjacentHTML('beforeend',`<div class=\"kicker\" style=\"color:var(--flame)\">Let’s try this one again<\/div>`);\n  const T=TYPES[st.t];\n  P.cur={st,api:null};\n  P.cur.api=T(st,stage,ready=>setReady(ready));\n  if(P.cur.api.info){foot.innerHTML=`<button class=\"btn\" id=\"cont\">${P.cur.api.label||'Continue'}<\/button>`;\n    const b=document.getElementById('cont');b.disabled=!!P.cur.api.locked;b.onclick=()=>{sfx.tap();advance(true,true)};}\n  else if(P.cur.api.auto){foot.innerHTML=`<button class=\"btn\" id=\"chk\" disabled>${P.cur.api.label||'Check'}<\/button>${P.cur.api.extra||''}`;P.cur.api.bindFoot&&P.cur.api.bindFoot(foot)}\n  else{foot.innerHTML=`<button class=\"btn\" id=\"chk\" disabled>Check<\/button>`;document.getElementById('chk').onclick=check}\n  window.scrollTo(0,0);\n}\nfunction flameInline(){return `<span style=\"display:inline-block;width:18px;vertical-align:-3px\">${flameSvg}<\/span>`}\nfunction setReady(r){const b=document.getElementById('chk')||document.getElementById('cont');if(b)b.disabled=!r}\nfunction check(){const res=P.cur.api.check();feedback(res.ok,res.why)}\nfunction feedback(ok,why){\n  const st=P.cur.st, foot=document.getElementById('foot');\n  let gained=0;\n  if(ok){P.combo++;P.best=Math.max(P.best,P.combo);P.right++;if(!st.retry&&!P.missed.has(st.k)){P.first++;gained=10}else gained=5;\n    if(P.combo>=3)gained+=5;P.xp+=gained;sfx.good();flyXp(gained)}\n  else{P.combo=0;P.missed.add(st.k);sfx.bad()}\n  const comboMsg=ok&&P.combo>=3?`${P.combo} in a row! Combo bonus.`:'';\n  const pose=ok?(COURSE.calm?(P.combo>=3?'happy':'talk'):(P.combo>=5?'love':P.combo>=3?'party':'happy')):'calm';\n  const head=ok?pick(['Nice!','Nailed it!','You got it!','Great eye!','Exactly!']):pick(['Not quite.','Almost!','Good try.']);\n  foot.className='foot band '+(ok?'good':'bad');\n  foot.innerHTML=`<div class=\"fb\"><div class=\"lottie\">${lottie(pose)}<\/div><div><h3>${head}<\/h3><p class=\"fbtext\">${comboMsg?esc(comboMsg)+' ':''}${why||''}<\/p><\/div><\/div>\n    <button class=\"btn ${ok?'good':'bad'}\" id=\"cont\">${ok?'Continue':'Got it'}<\/button>`;\n  const c=document.getElementById('cont');c.focus();c.onclick=()=>advance(ok);\n  const cb=document.querySelector('.combo');if(cb)cb.innerHTML=P.combo>=2?flameInline()+P.combo:'';\n  if(!ok){const s=document.getElementById('stage');s.classList.add('shake');}\n}\nfunction pick(a){return a[Math.floor(Math.random()*a.length)]}\nfunction flyXp(n){if(reduced)return;const d=document.createElement('div');d.className='xpfly';d.textContent='+'+n+' XP';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}\nfunction advance(ok,info){\n  const st=P.queue.shift();\n  if(ok||P.L.final){P.doneN++}\n  else{P.queue.push(Object.assign({},st,{retry:1}))}\n  if(info&&st.t!=='video'){}\n  renderStep();\n}\nfunction askQuit(){\n  const sc=document.createElement('div');sc.className='scrim';\n  sc.innerHTML=`<div class=\"sheet band\" role=\"dialog\" aria-label=\"Leave lesson\"><div style=\"display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:center\"><div class=\"lottie\">${lottie('think')}<\/div><div><h2 style=\"font-size:22px\">Leave this lesson?<\/h2><p class=\"sub\">You’ll lose your progress in this lesson.<\/p><\/div><\/div>\n    <button class=\"btn\" id=\"stay\">Keep going<\/button><button class=\"link\" id=\"leave\" style=\"color:var(--bad)\">Leave lesson<\/button><\/div>`;\n  document.body.appendChild(sc);\n  sc.querySelector('#stay').onclick=()=>sc.remove();\n  sc.querySelector('#leave').onclick=()=>{sc.remove();P=null;renderMap()};\n}\nfunction finishLesson(){\n  const L=P.L, acc=P.qs?Math.round(P.first/P.qs*100):100;\n  if(L.final){\n    const firstTry=P.first, pass=firstTry>=L.pass;\n    if(!pass){\n      app.innerHTML=`<div class=\"center band\"><div class=\"lottie\" style=\"width:200px\">${lottie('calm')}<\/div>\n        <h1 style=\"font-size:28px\">So close!<\/h1><p class=\"sub\" style=\"max-width:32ch\">You got ${firstTry} of ${P.qs}. You need ${L.pass} to pass. Take another look and try again.<\/p>\n        <div class=\"row2\"><button class=\"btn\" id=\"again\">Try again<\/button><button class=\"btn ghost\" id=\"map\">Back to lessons<\/button><\/div><\/div>`;\n      document.getElementById('again').onclick=()=>startLesson(P.i);\n      document.getElementById('map').onclick=renderMap;return;\n    }\n  }\n  const bonus=10; P.xp+=bonus;\n  S.xp+=P.xp; const was=!!S.done[L.id]; S.done[L.id]={acc,at:Date.now()};\n  const today=dayStr(new Date()), y=new Date();y.setDate(y.getDate()-1);\n  let streakUp=false;\n  if(S.lastDay!==today){S.streak=(S.lastDay===dayStr(y))?S.streak+1:1;S.lastDay=today;streakUp=true}\n  if(L.final&&!S.passed){S.passed=true;S.passedOn=new Date().toISOString()}\n  save(); sfx.win(); if(!COURSE.calm)burst();\n  const allDone=L.final;\n  app.innerHTML=`<div class=\"center band\">\n    <div class=\"lottie\" style=\"width:220px\">${lottie(allDone?'badge':(COURSE.calm?'happy':(acc===100?'love':'celebrate')))}<\/div>\n    <h1 style=\"font-size:30px\">${allDone?'You passed!':(acc===100?'Perfect lesson!':'Lesson complete!')}<\/h1>\n    <p class=\"sub\">${allDone?'You earned the ${esc(COURSE.title)} badge.':(streakUp?`Your streak is now ${S.streak} day${S.streak>1?'s':''}. Keep it going tomorrow!`:'Keep it rolling.')}<\/p>\n    <div class=\"stats\">\n      <div class=\"stat x\"><small>Total XP<\/small><b>${boltSvg}${P.xp}<\/b><\/div>\n      <div class=\"stat a\"><small>${allDone?'Score':'Accuracy'}<\/small><b>${allDone?P.first+'/'+P.qs:acc+'%'}<\/b><\/div>\n      <div class=\"stat s\"><small>Streak<\/small><b>${flameSvg}${S.streak}<\/b><\/div>\n    <\/div>\n    <div class=\"row2\" style=\"margin-top:6px\"><button class=\"btn\" id=\"next\">${allDone?'Get my badge':'Continue'}<\/button><\/div><\/div>`;\n  document.getElementById('next').onclick=allDone?renderBadge:renderMap;\n  P=null;\n}\n\n/* ============ Interaction types ============ */\nconst TYPES={};\nTYPES.talk=(st,el)=>{\n  el.innerHTML=`<div class=\"talk\"><div class=\"lottie\">${lottie(st.pose)}<\/div><div class=\"bubbl s '}${esc(st.bins[items[i][1]][0])}${ok?'':''}<\/small>`;\n    ok?sfx.good():(sfx.bad(),wrong++);\n    setTimeout(()=>{i++;busy=false;draw();if(i>=items.length){el.querySelector('.binbtns').hidden=true;ready(true)}},ok?700:1500);\n  });\n  draw();\n  return {auto:1,label:'Check',bindFoot(){document.getElementById('chk').onclick=()=>feedback(wrong===0,wrong?`You missed ${wrong}. ${st.why}`:st.why)}};\n};\n\n/* Tap where to stand on a floor plan. */\nTYPES.stand=(st,el,ready)=>{\n  let sel=-1;\n  el.innerHTML=`<div class=\"kicker\">Pick your spot<\/div><h2 class=\"q\">${esc(st.q)}<\/h2><div class=\"scene\">${st.svg}<\/div><div class=\"opts\" id=\"so\">${st.spots.map((s,i)=>`<button class=\"opt\" data-o=\"${i}\"><span class=\"k\">${esc(s.k)}<\/span>${esc(s.t)}<\/button>`).join('')}<\/div>`;\n  const bs=[...el.querySelectorAll('.opt')], marks=[...el.querySelectorAll('[data-stand]')];\n  const choose=i=>{sel=i;bs.forEach((b,j)=>b.classList.toggle('sel',j===i));marks.forEach(m=>m.classList.toggle('sel',+m.dataset.stand===i));sfx.tap();ready(true)};\n  bs.forEach(b=>b.onclick=()=>choose(+b.dataset.o));marks.forEach(m=>{m.style.cursor='pointer';m.onclick=()=>choose(+m.dataset.stand)});\n  return {check(){bs.forEach((b,j)=>{b.disabled=true;if(st.spots[j].ok)b.classList.add('right');else if(j===sel)b.classList.add('wrong')});const s=st.spots[sel];return {ok:!!s.ok,why:s.why}}};\n};\n\n/* Branching conversation with a live tension meter. */\nTYPES.talkback=(st,el,ready)=>{\n  let t=st.meter, end=null;\n  el.innerHTML=`<div class=\"kicker\">Practice scene<\/div><h2 class=\"q\">${esc(st.q)}<\/h2>\n    <div class=\"meter\"><div class=\"mlbl\"><span>Calm<\/span><span>Tense<\/span><span>Unsafe<\/span><\/div><div class=\"mtrack\"><span class=\"knob\" id=\"kn\"><\/span><\/div><\/div>\n    <div class=\"chat\" id=\"ch\"><\/div><div class=\"opts\" id=\"co\"><\/div>`;\n  const kn=el.querySelector('#kn'), ch=el.querySelector('#ch'), co=el.querySelector('#co');\n  const setT=v=>{t=Math.max <\/div><h2 class=\"q\">${esc(st.q)}<\/h2>\n    <div class=\"ladderbox\"><svg viewBox=\"0 0 320 210\" id=\"ms\" role=\"img\" aria-label=\"A machine panel with controls\"><\/svg><\/div>\n    <p class=\"tipline\" id=\"lt\" aria-live=\"polite\">Do the lockout steps in order. Tap the controls on the machine.<\/p>\n    <div class=\"ctrls\">\n      <button class=\"chip\" data-a=\"notify\">${ico('users')} Notify crew<\/button>\n      <button class=\"chip\" data-a=\"stop\">${ico('stop')} Stop<\/button>\n      <button class=\"chip\" data-a=\"isolate\">${ico('bolt')} Disconnect OFF<\/button>\n      <button class=\"chip\" data-a=\"lock\">${ico('lock')} Apply lock<\/button>\n      <button class=\"chip\" data-a=\"tag\">${ico('tag')} Hang tag<\/button>\n      <button class=\"chip\" data-a=\"bleed\">${ico('water')} Bleed air<\/button>\n      <button class=\"chip\" data-a=\"try\">${ico('play')} Try Start<\/button><\/div>`;\n  const svg=el.querySelector('#ms'), lt=el.querySelector('#lt');\n  const has=a=>S6.indexOf(a)<k;\n  function draw(){\n    const off=has('isolate');\n    svg.innerHTML=`<rect y=\"186\" width=\"320\" height=\"24\" fill=\"var(--floor)\"/>\n      <g><rect x=\"150\" y=\"36\" width=\"150\" height=\"150\" rx=\"8\" fill=\"#9FB3BE\"/><rect x=\"164\" y=\"50\" width=\"122\" height=\"70\" rx=\"6\" fill=\"#5F7682\"/>\n        <g transform=\"translate(225 85)\"><g>${running?'<animateTransform attributeName=\"transform\" type=\"rotate\" from=\"0\" to=\"360\" dur=\"1.4s\" repeatCount=\"indefinite\"/>':''}\n          <circle r=\"24\" fill=\"#C8D6DD\"/><path d=\"M0-30v60M-30 0h60M-21-21l42 42M21-21l-42 42\" stroke=\"#C8D6DD\" stroke-width=\"8\"/><circle r=\"9\" fill=\"#5F7682\"/><\/g><\/g>\n        <rect x=\"170\" y=\"134\" width=\"40\" height=\"40\" rx=\"20\" fill=\"${running?'#22B566':'#7B8C96'}\"/><text x=\"190\" y=\"158\" ${FONT} font-size=\"10\" fill=\"#fff\" text-anchor=\"middle\">START<\/text>\n        <rect x=\"222\" y=\"134\" width=\"40\" height=\"40\" rx=\"20\" fill=\"# hold for 2 seconds<\/p><\/div>`;\n  const b=el.querySelector('#hb'), c=b.querySelector('circle');let t0=0,raf=0,done=false;\n  const tick=()=>{const p=Math.min(1,(performance.now()-t0)/1600);c.setAttribute('stroke-dasharray',(p*100)+' 100');if(p>=1)commit();else raf=requestAnimationFrame(tick)};\n  const start=e=>{if(done)return;e.preventDefault();t0=performance.now();raf=requestAnimationFrame(tick)};\n  const stop=()=>{if(done)return;cancelAnimationFrame(raf);c.setAttribute('stroke-dasharray','0 100')};\n  b.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,stop));\n  b.addEventListener('click',e=>{if(e.detail===0)commit()});b.addEventListener('contextmenu',e=>e.preventDefault());\n  function commit(){if(done)return;done=true;cancelAnimationFrame(raf);c.setAttribute('stroke-dasharray','100 0');b.classList.add('done');b.querySelector('span').textContent='Committed';sfx.win();ready(true)}\n  return {info:1,locked:1,label:'Continue'};\n};\n\n/* ============ More interaction types (second set of 10 courses) ============\n   scan  : inspect equipment, call each part OK or Tag it out\n   sim   : do a hands-on procedure on a picture, in order\n   meter : read a device (gas monitor, sound meter, thermometer) and make the call, round by round\n   tempo : tap a rhythm (CPR compressions)\n   calc  : sliders with a live diagram and a custom check (forklift forks, fall clearance, wind chill...) */\nObject.assign(I,{\n  mask:'<path d=\"M5 9c2-3 12-3 14 0v4c0 4-3 7-7 7s-7-3-7-7z\"/><circle cx=\"8.5\" cy=\"14\" r=\"2\"/><circle cx=\"15.5\" cy=\"14\" r=\"2\"/><path d=\"M5 10L2 8M19 10l3-2\"/>',\n  fork:'<path d=\"M3 17V11c0-.8.7-1.5 1.5-1.5h4.3l3.2 4.5V17\"/><path d=\"M5.5 9.5V5.5h3l.8 4\"/><path d=\"M15 3v15h6.5\"/><circle cx=\"6\" cy=\"18\" r=\"1.8\"/><circle cx=\"11.5\" cy=\"18\" r=\"1.8\"/>',\n  cross:'<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"4\"/><path d=\"M12 7v10M7 12h10\"/>',\n  hole:'<ellipse cx= st.kind||'Inspect it')}<\/div><h2 class=\"q\">${esc(st.q)}<\/h2>\n    <div class=\"scene scanpic\">${st.svg}<\/div>\n    <div class=\"scanpanel\" id=\"sp\" aria-live=\"polite\"><p class=\"sub\" style=\"margin:0\">Tap each numbered spot to check it.<\/p><\/div>\n    <div class=\"scanlist\" id=\"sl\"><\/div>`;\n  const svg=el.querySelector('svg'), sp=el.querySelector('#sp'), sl=el.querySelector('#sl');\n  svg.insertAdjacentHTML('beforeend',`<g id=\"dots\">${st.parts.map((p,i)=>`<g class=\"sdot\" data-i=\"${i}\" tabindex=\"0\" role=\"button\" aria-label=\"Check ${esc(p.name)}\"><circle cx=\"${p.x}\" cy=\"${p.y}\" r=\"17\" class=\"halo\"/><circle cx=\"${p.x}\" cy=\"${p.y}\" r=\"12\" class=\"dot\"/><text x=\"${p.x}\" y=\"${p.y+4.5}\" text-anchor=\"middle\" ${FONT} font-size=\"13\" fill=\"#fff\">${i+1}<\/text><\/g>`).join('')}<\/g>`);\n  const dots=[...svg.querySelectorAll('.sdot')];\n  function list(){sl.innerHTML=st.parts.map((p,i)=>`<span class=\"${ans[i]===null?'':'y'}\">${i+1}. ${esc(p.name)}${ans[i]===null?'':ans[i]?' · Tag out':' · OK'}<\/span>`).join('')}\n  function open(i){cur=i;dots.forEach((d,j)=>d.classList.toggle('sel',j===i));const p=st.parts[i];sfx.tap();\n    sp.innerHTML=`<b class=\"sname\">${i+1}. ${esc(p.name)}<\/b><p class=\"slook\">${p.look}<\/p>\n      <div class=\"binbtns\"><button class=\"chip sok\" data-v=\"0\">${ico('check')} OK<\/button><button class=\"chip sbad\" data-v=\"1\">${ico('tag')} Tag it out<\/button><\/div>`;\n    sp.querySelectorAll('button').forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.v;dots[i].classList.add('done');sfx.tap();list();\n      const nx=ans.findIndex(a=>a===null);if(nx>=0)open(nx);else{sp.innerHTML='<p class=\"sub\" style=\"margin:0\">All checked. Tap a spot to change your call, or press Check.<\/p>';dots.forEach(d=>d.classList.remove('sel'))}\n      ready(!ans.includes(null))});\n  }\n  dots.forEach((d,i)=>{d.onclick=()=>open(i);d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(i)}}});\n  list() ead(v) a readout line, st.test(v) returns {ok,why}. */\nTYPES.calc=(st,el,ready)=>{\n  const v=st.sliders.map(s=>s.start);\n  el.innerHTML=`<div class=\"kicker\">${esc(st.kind||'Set it up')}<\/div><h2 class=\"q\">${esc(st.q)}<\/h2>\n    <div class=\"ladderbox\"><svg viewBox=\"${st.vb||'0 0 320 200'}\" id=\"cv\" role=\"img\" aria-label=\"${esc(st.alt||st.q)}\"><\/svg><\/div>\n    ${st.read?'<p class=\"tipline\" id=\"cr\" aria-live=\"polite\"><\/p>':''}\n    ${st.sliders.map((s,i)=>`<div><div class=\"readout\"><label for=\"cs${i}\">${esc(s.label)}<\/label><span id=\"cvv${i}\"><\/span><\/div><input class=\"range\" id=\"cs${i}\" type=\"range\" min=\"${s.min}\" max=\"${s.max}\" step=\"${s.step||1}\" value=\"${s.start}\"><\/div>`).join('')}`;\n  const svg=el.querySelector('#cv'), cr=el.querySelector('#cr');\n  const fmt=(s,x)=>s.fmt?s.fmt(x):x+(s.unit?' '+s.unit:'');\n  function draw(){svg.innerHTML=st.draw(v);st.sliders.forEach((s,i)=>el.querySelector('#cvv'+i).textContent=fmt(s,v[i]));if(cr)cr.innerHTML=st.read(v)}\n  st.sliders.forEach((s,i)=>el.querySelector('#cs'+i).oninput=e=>{v[i]=+e.target.value;draw();ready(true)});\n  draw();\n  return {check(){el.querySelectorAll('input').forEach(x=>x.disabled=true);return st.test(v)}};\n};\n\n/* dial, with a course-neutral \"wrong\" lead-in (st.miss) */\nTYPES.dial=(st,el,ready)=>{\n  const n=st.stops.length;let v=st.start;\n  el.innerHTML=`<div class=\"kicker\">Make a guess<\/div><h2 class=\"q\">${esc(st.q)}<\/h2>\n    <div class=\"dialbox\"><output id=\"dv\"><\/output><input class=\"range\" id=\"dr\" type=\"range\" min=\"0\" max=\"${n-1}\" step=\"1\" value=\"${v}\" aria-label=\"${esc(st.q)}\">\n    <div class=\"readout\"><small>${esc(st.stops[0].v)}<\/small><small>${esc(st.stops[n-1].v)}<\/small><\/div><\/div><ul class=\"lad\" id=\"lad\" hidden><\/ul>`;\n  const dv=el.querySelector('#dv'), r=el.querySelector('#dr');\n  const draw=()=>{dv.textContent=st.stops[v].v};\n  r.oninput=()=>{v=+r.value;draw();ready(true)};draw();ready(true);\n  return {check(){r.disabled=true;const ok=st.answer.includes(v);const lad=el.querySelector('#lad');lad.hidden=false;\n    lad.innerHTML=st.stops.map((s,i)=>`<li class=\"${st.answer.includes(i)?'hit':''} ${s.mark?'mark':''} ${i===v?'you':''}\"><b>${esc(s.v)}<\/b><span>${s.fx}${i===v?' <em>Your guess<\/em>':''}<\/span><\/li>`).join('');\n    setTimeout(()=>lad.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'}),60);\n    return {ok,why:(ok?'':(st.miss||'Not quite. '))+st.why}}};\n};\n\n/* ============ Soft skills interaction types (third set of 10 courses) ============\n   texts    : a phone chat. Read the thread, pick the reply you would send, see how the chat reacts\n   tone     : fix a draft message. Tap the highlighted bits to swap the wording, watch how it lands\n   post     : social feed cards. Post it or skip it, one by one\n   checkin  : private self check (battery / mood slider). Ungraded\n   breathe  : guided slow breathing. Ungraded\n   talkback : (override) branching talk with a live meter, now with custom meter labels and kicker */\nObject.assign(I,{\n  battery:'<rect x=\"2\" y=\"7\" width=\"18\" height=\"10\" rx=\"2.5\"/><path d=\"M22 10.5v3\"/><path d=\"M5 10v4M8 10v4\"/>',\n  heartI:'<path d=\"M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z\"/>',\n  cal:'<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2.5\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/>',\n  smile:'<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.5M15 9.5h.5\"/>',\n  frown:'<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M8.5 16a4.5 4.5 0 0 1 7 0M9 9.5h.5M15 9.5h.5\"/>',\n  camera:'<path d=\"M4 8h3l2-3h6l2 3h3v11H4z\"/><circle cx=\"12\" cy=\"13\" r=\"3.5\"/>',\n  send:'<path d=\"M3 11l18-8-8 18-2-8z\"/>',\n  idea:'<path d=\"M9 18h6M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/>',\n  crown:'<path d=\"M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z\"/>',\n  bell:'<path d=\"M6 16V11a6 6 0 0 1 12 0v5l2 2H4z\"/><path d=\"M10 20a2 2 0 0 0 4 0\"/>',\n  ban:'<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M5.6 5.6l12.8 12.8\"/>',\n  lockI:'<rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"/>',\n  moon:'<path d=\"M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z\"/>',\n  hands:'<path d=\"M3 12l4-4 4 3 3-3 4 3 3-1\"/><path d=\"M7 8l5 6 3-2 3 3\"/><path d=\"M3 12l6 7h4\"/>'\n});\n\nconst PAL=['#1C9C9A','#D2557A','#5E7CE2','#E0892B','#8A5CC2','#2F9E5B','#C2416A','#127AA0'];\nconst avatarCol=n=>{let h=0;for(const ch of String(n))h=(h*31+ch.charCodeAt(0))>>>0;return PAL[h%PAL.length]};\nconst ini=n=>esc(String(n).trim().charAt(0).toUpperCase());\n\n/* Phone chat. st: {q, chat:'Crew chat', sub:'6 people', rounds:[{msgs:[[who,text]...], opts:[{t,ok,fb,then:[[who,text]]}]}], why}\n   who 'me' = the learner, '' = a system line (someone joined, a photo, time stamp). A weak pick plays out, then you pick again. */\nTYPES.texts=(st,el,ready)=>{\n  let r=0, miss=0;const tried=st.rounds.map(()=>new Set());\n  el.innerHTML=`<div class=\"kicker\">${esc(st.kind||'Your phone')}<\/div><h2 class=\"q\">${esc(st.q)}<\/h2>\n    <div class=\"phone\"><div class=\"phead\"><span class=\"pav\" style=\"background:${avatarCol(st.chat)}\">${ico(st.icon||'users')}<\/span><div><b>${esc(st.chat)}<\/b><small>${esc(st.sub||'')}<\/small><\/div><\/div>\n    <div class=\"pbody\" id=\"pb\" aria-live=\"polite\"><\/div><\/div>\n    <div class=\"opts replies\" id=\"ro\"><\/div>`;\n  const pb=el.querySelector('#pb'), ro=el.querySelector('#ro');\n  const W=ms=>new Promise(res=>setTimeout(res,reduced?0:ms));\n  const bubble=([who,txt])=>{\n    if(who==='')return `<div class=\"psys\">${esc(txt)}<\/div>`;\n    if(who==='me')return `<div class=\"pmsg me\"><div class=\"pb\">${esc(txt)}<\/div><\/div>`;\n    return `<div class=\"pmsg\"><span class=\"pav sm\" style=\"background:${avatarCol(who)}\">${ini(who)}<\/span><div class=\"pb\"><small style=\"color:${avatarCol(who)}\">${esc(who)}<\/small>${esc(txt)}<\/div><\/div>`;\n  };\n  const scroll=()=>{pb.scrollTop=pb.scrollHeight};\n  async function play(list){\n    for(const m of list||[]){\n      if(m[0]!=='me'&&m[0]!==''){pb.insertAdjacentHTML('beforeend',`<div class=\"ptyping\"><i><\/i><i><\/i><i><\/i><\/div>`);scroll();await W(520);pb.querySelector('.ptyping')?.remove()}\n      pb.insertAdjacentHTML('beforeend',bubble(m));scroll();if(m[0]!=='me')sfx.tap&&sfx.tap();await W(260);\n    }\n  }\n  function choices(){\n    const R=st.rounds[r];\n    ro.innerHTML=`<p class=\"replyhint\">${esc(R.ask||'What do you send?')}<\/p>`+shuffle(R.opts.map((_,k)=>k)).map(k=>`<button class=\"opt\" data-c=\"${k}\">${esc(R.opts[k].t)}<\/button>`).join('');\n    ro.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickIt(+b.dataset.c));\n  }\n  async function pickIt(k){\n    const R=st.rounds[r], c=R.opts[k];ro.innerHTML='';\n    if(c.t.startsWith('(')) pb.insertAdjacentHTML('beforeend',`<div class=\"psys\">You: ${esc(c.t.replace(/^\\(|\\)$/g,''))}<\/div>`);\n    else pb.insertAdjacentHTML('beforeend',bubble(['me',c.t]));\n    scroll();\n    await W(300);await play(c.then);\n    pb.insertAdjacentHTML('beforeend',`<div class=\"pcoach ${c.ok?'good':'meh'}\"><b>${c.ok?'Lands well.':'Hmm.'}<\/b> ${c.fb||''}<\/div>`);scroll();\n    c.ok?sfx.good():sfx.bad();\n    if(!c.ok){miss++;tried[r].add(k);\n      await W(500);\n      ro.innerHTML=`<p class=\"replyhint\">Rewind. Try a different reply.<\/p>`+R.opts.map((o,j)=>tried[r].has(j)?'':`<button class=\"opt\" data-c=\"${j}\">${esc(o.t)}<\/button>`).join('');\n      ro.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickIt(+b.dataset.c));return}\n    r++;\n    if(r<st.rounds.length){await W(500);await play(st.rounds[r].msgs);choices()}\n    else{ro.innerHTML='';ready(true)}\n  }\n  (async()=>{await play(st.rounds[0].msgs);choices()})();\n  return {auto:1,label:'Check',bindFoot(){document.getElementById('chk').onclick=()=>feedback(miss===0,(miss?'You got there with a rewind. ':'')+st.why)}};\n};\n\n/* Fix a draft. st: {q, to:'To: Dana (manager)', parts:['Hi ', {o:['a','b','c'], a:1}, '...'], why}. Tap a highlighted bit to cycle it. */\nTYPES.tone=(st,el,ready)=>{\n  const ch=st.parts.map(p=>typeof p==='string'?null:p), cur=ch.map(c=>c?(c.start!=null?c.start:(c.a+1)%c.o.length):null), touched=new Set();\n  const N=ch.filter(Boolean).length;\n  el.innerHTML=`<div class=\"kicker\">${esc(st.kind||'Fix the message')}<\/div><h2 class=\"q\">${esc(st.q)}<\/h2>\n    <div class=\"draft\"><div class=\"dto\">${esc(st.to||'')}<\/div><div class=\"dmsg\" id=\"dm\"><\/div><div class=\"dsend\">${ico('send')}<\/div><\/div>\n    <p class=\"sub\" style=\"text-align:center;margin:0\">Tap each highlighted part to change the wording.<\/p>\n    <div class=\"lands\"><div class=\"mlbl\"><span>Starts drama<\/span><span>Meh<\/span><span>Lands well<\/span><\/div><div class=\"ltrack\"><i id=\"lf\"><\/i><\/div><\/div>`;\n  const dm=el.querySelector('#dm'), lf=el.querySelector('#lf');\n  function draw(){\n    dm.innerHTML=st.parts.map((p,i)=>ch[i]?`<button class=\"swap\" data-i=\"${i}\" data-v=\"${cur[i]}\" aria-label=\"Change wording: ${esc(ch[i].o[cur[i]])}\">${esc(ch[i].o[cur[i]])}<\/button>`:esc(p)).join('');\n    dm.querySelectorAll('.swap').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;cur[i]=(cur[i]+1)%ch[i].o.length;touched.add(i);sfx.tap();draw();ready(touched.size===N);dm.querySelector(`[data-i=\"${i}\"]`).focus()});\n    const good=ch.filter((c,i)=>c&&cur[i]===c.a).length;lf.style.width=(100-Math.max(8,good/N*100))+'%';\n  }\n  draw();\n  return {check(){\n    let wrong=0;dm.querySelectorAll('.swap').forEach(b=>{const i=+b.dataset.i,ok=cur[i]===ch[i].a;if(!ok)wrong++;b.classList.add(ok?'right':'wrong');b.disabled=true});\n    const fix=ch.map((c,i)=>c&&cur[i]!==c.a?`“${esc(c.o[c.a])}”`:null).filter(Boolean);\n    return {ok:!wrong,why:(wrong?`Better: ${fix.join(' · ')}. `:'')+st.why}}};\n};\n\n/* Post it or skip it. st: {q, items:[{cap, pic, icon, ok:1|0, why}], why}. ok:1 means fine to post. */\nTYPES.post=(st,el,ready)=>{\n  let i=0, wrong=0;\n  el.innerHTML=`<div class=\"kicker\">${esc(st.kind||'Post it or skip it')}<\/div><h2 class=\"q\">${esc(st.q)}<\/h2><div id=\"pf\"><\/div><div class=\"swcount\" id=\"pn\"><\/div>`;\n  const pf=el.querySelector('#pf'), pn=el.querySelector('#pn');\n  function draw(){\n    if(i>=st.items.length){pf.innerHTML=`<div class=\"feedcard done\">${ico('check')} All done!<\/div>`;pn.textContent='';ready(true);return}\n    const it=st.items[i];\n    pf.innerHTML=`<div class=\"feedcard\"><div class=\"fhead\"><span class=\"pav sm\" style=\"background:var(--pink)\">${ico('user')}<\/span><div><b>you<\/b><small>Draft · ${esc(it.where||'your story')}<\/small><\/div><\/div>\n      <div class=\"fpic\">${ico(it.icon||'camera')}<span>${esc(it.pic)}<\/span><\/div><p class=\"fcap\">${esc(it.cap)}<\/p><\/div>\n      <div class=\"binbtns\" id=\"pbtn\"><button class=\"chip binb\" data-k=\"0\"><b>Skip it<\/b><small>Don’t post<\/small><\/button><button class=\"chip binb\" data-k=\"1\"><b>Post it<\/b><small>Looks fine<\/small><\/button><\/div>`;\n    pn.textContent=`${i+1} of ${st.items.length}`;\n    pf.querySelectorAll('.binb').forEach(b=>b.onclick=()=>{\n      const k=+b.dataset.k, ok=k===it.ok;if(!ok)wrong++;ok?sfx.good():sfx.bad();\n      pf.querySelector('#pbtn').outerHTML=`<div class=\"pverd ${ok?'good':'meh'}\"><b>${it.ok?'Fine to post.':'Skip it.'}<\/b> ${esc(it.why)}<button class=\"chip\" id=\"pnext\">${i+1<st.items.length?'Next post':'Done'}<\/button><\/div>`;\n      pf.querySelector('#pnext').onclick=()=>{i++;sfx.tap();draw()};pf.querySelector('#pnext').focus();\n    });\n  }\n  draw();\n  return {auto:1,label:'Check',bindFoot(){document.getElementById('chk').onclick=()=>feedback(wrong===0,wrong?`You missed ${wrong}. ${st.why}`:st.why)}};\n};\n\n/* Private check-in. st: {q, kind, stops:[{v, say}], start, gauge:'battery'|'mood'}. Not scored. */\nTYPES.checkin=(st,el,ready)=>{\n  const n=st.stops.length;let v=st.start!=null?st.start:Math.floor(n/2), moved=false;\n  el.innerHTML=`<div class=\"kicker\">${esc(st.kind||'Check in')} · just for you<\/div><h2 class=\"q\">${esc(st.q)}<\/h2>\n    <div class=\"ckbox\"><div class=\"ckg\" id=\"cg\"><\/div><output id=\"cv\"><\/output>\n    <input class=\"range\" id=\"cr\" type=\"range\" min=\"0\" max=\"${n-1}\" step=\"1\" value=\"${v}\" aria-label=\"${esc(st.q)}\">\n    <div class=\"readout\"><small>${esc(st.stops[0].v)}<\/small><small>${esc(st.stops[n-1].v)}<\/small><\/div><\/div>\n    <div class=\"talk\"><div class=\"lottie\" id=\"cl\">${lottie('calm')}<\/div><div class=\"bubble\" id=\"cs\"><\/div><\/div>\n    <p class=\"sub\" style=\"text-align:center;margin:0\">Nothing you pick here is saved or shared.<\/p>`;\n  const cg=el.querySelector('#cg'), cv=el.querySelector('#cv'), cs=el.querySelector('#cs'), r=el.querySelector('#cr');\n  const draw=()=>{const f=v/(n-1), col=f<.34?'#E8919F':f<.67?'#FFC83D':'#1C9C9A';\n    cg.innerHTML=st.gauge==='mood'?`<svg viewBox=\"0 0 120 60\" aria-hidden=\"true\"><circle cx=\"60\" cy=\"30\" r=\"26\" fill=\"${col}\"/><circle cx=\"51\" cy=\"25\" r=\"3.5\" fill=\"#1D3540\"/><circle cx=\"69\" cy=\"25\" r=\"3.5\" fill=\"#1D3540\"/><path d=\"M47 ${40-f*4} Q60 ${34+f*16} 73 ${40-f*4}\" stroke=\"#1D3540\" stroke-width=\"3.5\" fill=\"none\" stroke-linecap=\"round\"/><\/svg>`\n      :`<svg viewBox=\"0 0 160 70\" aria-hidden=\"true\"><rect x=\"6\" y=\"8\" width=\"136\" height=\"54\" rx=\"14\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"6\"/><rect x=\"146\" y=\"25\" width=\"10\" height=\"20\" rx=\"4\" fill=\"var(--line)\"/><rect x=\"15\" y=\"17\" width=\"${Math.max(8,f*118)}\" height=\"36\" rx=\"8\" fill=\"${col}\"/><\/svg>`;\n    cv.textContent=st.stops[v].v;cs.innerHTML=st.stops[v].say};\n  r.oninput=()=>{v=+r.value;if(!moved){moved=true;ready(true)}draw()};\n  draw();\n  return {info:1,locked:1,label:'Continue'};\n};\n\n/* Slow breathing. st: {q, say, rounds, inn, out}. Not scored. */\nTYPES.breathe=(st,el,ready)=>{\n  const R=st.rounds||3, A=st.inn||4, B=st.out||6;let run=false,t=null;\n  el.innerHTML=`<div class=\"kicker\">${esc(st.kind||'Reset')}<\/div><h2 class=\"q\">${esc(st.q)}<\/h2>\n    <div class=\"brbox\"><div class=\"brc\" id=\"bc\"><span id=\"bt\">Ready?<\/span><\/div><\/div>\n    <p class=\"sub\" style=\"text-align:center;margin:0\">${st.say||`Breathe in for ${A}, out for ${B}. A long breath out tells your body it’s safe.`}<\/p>\n    <div style=\"display:grid;justify-items:center\"><button class=\"chip\" id=\"bs\">${ico('play')} Start<\/button><\/div>`;\n  const bc=el.querySelector('#bc'), bt=el.querySelector('#bt'), bs=el.querySelector('#bs');\n  bs.onclick=()=>{if(run)return;run=true;bs.hidden=true;let k=0;\n    const cycle=()=>{if(k>=R){bt.textContent='Nice. Feel that?';bc.className='brc';run=false;return}\n      k++;bc.className='brc in';bc.style.transitionDuration=A+'s';let s=A;bt.textContent=`In · ${s}`;\n      t=setInterval(()=>{s--;if(s>0){bt.textContent=`In · ${s}`;return}clearInterval(t);\n        bc.className='brc out';bc.style.transitionDuration=B+'s';let o=B;bt.textContent=`Out · ${o}`;\n        t=setInterval(()=>{o--;if(o>0){bt.textContent=`Out · ${o}`;return}clearInterval(t);cycle()},1000)},1000)};\n    cycle()};\n  return {info:1,label:'Continue'};\n};\n\n/* Branching talk with a live meter. Same data as before, plus st.labels:[left,mid,right] and st.kind. */\nTYPES.talkback=(st,el,ready)=>{\n  let t=st.meter, end=null;const L=st.labels||['Calm','Tense','Unsafe'];\n  el.innerHTML=`<div class=\"kicker\">${esc(st.kind||'Practice scene')}<\/div><h2 class=\"q\">${esc(st.q)}<\/h2>\n    <div class=\"meter\"><div class=\"mlbl\"><span>${esc(L[0])}<\/span><span>${esc(L[1])}<\/span><span>${esc(L[2])}<\/span><\/div><div class=\"mtrack\"><span class=\"knob\" id=\"kn\"><\/span><\/div><\/div>\n    <div class=\"chat\" id=\"ch\"><\/div><div class=\"opts\" id=\"co\"><\/div>`;\n  const kn=el.querySelector('#kn'), ch=el.querySelector('#ch'), co=el.querySelector('#co');\n  const setT=v=>{t=Math.max(4,Math.min(96,v));kn.style.left=t+'%'};setT(t);\n  function node(id){\n    const n=st.nodes[id];co.innerHTML=\"\";co.dataset.node=id;\n    if(n.act)ch.insertAdjacentHTML('beforeend',`<div class=\"say act\">${esc(n.act)}<\/div>`);\n    if(n.say)ch.insertAdjacentHTML('beforeend',`<div class=\"say them\"><small>${esc(n.who||st.who)}<\/small>${esc(n.say)}<\/div>`);\n    if(n.end){end=n;ch.insertAdjacentHTML('beforeend',`<div class=\"say coachnote\"><b>${esc(n.title)}<\/b> ${esc(n.msg)}<\/div>`);ready(true);return}\n    co.innerHTML=shuffle(n.choices.map((c,k)=>k)).map(k=>`<button class=\"opt\" data-c=\"${k}\">${esc(n.choices[k].t)}<\/button>`).join('');\n    co.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{\n      const c=n.choices[+b.dataset.c];co.innerHTML='';\n      ch.insertAdjacentHTML('beforeend',`<div class=\"say me\">${esc(c.t)}<\/div>`);setT(t+c.d);c.d<=0?sfx.good():sfx.bad();\n      if(c.fb)ch.insertAdjacentHTML('beforeend',`<div class=\"say coachnote\">${c.fb}<\/div>`);\n      setTimeout(()=>{node(c.to);co.scrollIntoView({behavior:reduced?'auto':'smooth',block:'nearest'})},450);\n    });\n  }\n  node(st.start);\n  return {auto:1,label:'Finish the scene',bindFoot(){document.getElementById('chk').onclick=()=>feedback(!!end.good,end.good?st.why:'Let’s run it again at the end of this lesson. '+st.why)}};\n};\n\n/* ============ Compliance set: extra player features (fourth set) ============\n   form    : fill in a short record (incident note, temp log, suspect description) by picking the right entry for each line\n   Seat time: COURSE.seatMin (minutes). Active time is counted only while the page is open and the learner has\n              interacted in the last 3 minutes. The final check unlocks once lessons are done AND the time is met.\n              Needed for state rules that set a minimum length (California 1 hr / 2 hr, Connecticut 2 hr).\n   Trainer : COURSE.tra <\/div>\n    ${st.fields.map((f,i)=>`<div class=\"frow\" data-r=\"${i}\"><div class=\"flab\">${esc(f.k)}<\/div><div class=\"fopts\">${order[i].map(k=>`<button class=\"chip fopt\" data-f=\"${i}\" data-o=\"${k}\">${esc(f.o[k])}<\/button>`).join('')}<\/div><\/div>`).join('')}<\/div>`;\n  el.querySelectorAll('.fopt').forEach(b=>b.onclick=()=>{\n    const f=+b.dataset.f, o=+b.dataset.o;sel[f]=o;sfx.tap();\n    el.querySelectorAll(`.fopt[data-f=\"${f}\"]`).forEach(x=>x.classList.toggle('sel',x===b));\n    ready(sel.every(v=>v>=0));\n  });\n  return {check(){\n    let wrong=0;\n    st.fields.forEach((f,i)=>{const ok=sel[i]===f.a;if(!ok)wrong++;\n      el.querySelectorAll(`.fopt[data-f=\"${i}\"]`).forEach(x=>{x.disabled=true;const k=+x.dataset.o;if(k===f.a)x.classList.add('right');else if(k===sel[i])x.classList.add('wrong')})});\n    return {ok:wrong===0,why:(wrong?`${wrong} line${wrong>1?'s':''} to fix. `:'')+st.why};\n  }};\n};\n\n/* ---- reflect: a private think-it-through prompt. Not scored, not saved. Unlocks after a few words. ---- */\nTYPES.reflect=(st,el,ready)=>{\n  el.innerHTML=`<div class=\"kicker\">${esc(st.kind||'Think about it')} · just for you<\/div><h2 class=\"q\">${esc(st.q)}<\/h2>\n    ${st.scene?`<div class=\"lawcard\">${st.scene}<\/div>`:''}\n    <textarea class=\"tq\" id=\"rq\" rows=\"4\" placeholder=\"${esc(st.ph||'Type a few words. Nobody else sees this.')}\"><\/textarea>\n    <div class=\"talk\" id=\"rt\" hidden><div class=\"lottie\">${lottie('talk')}<\/div><div class=\"bubble\">${st.say}<\/div><\/div>\n    <p class=\"sub\" style=\"text-align:center;margin:0\">What you type here is not saved or shared.<\/p>`;\n  const q=el.querySelector('#rq'), rt=el.querySelector('#rt');let shown=false;\n  q.oninput=()=>{if(!shown&&q.value.trim().split(/\\s+/).length>=3){shown=true;rt.hidden=false;ready(true)}};\n  return {info:1,locked:1,label:'Continue'};\n};\n\n/* ---- lesson length override ---- */\n{const _lm=lessonMins;lessonMins=l=>l.mins||_lm(l);}\n\n/* ----
