=(cond,step)=>cond?step:null;\nconst steps=(...a)=>a.filter(Boolean);\n\nconst COURSE={\n  id:V.id, title:V.title, minutes:V.minutes, calm:true, seatMin:V.seatMin||0,\n  seatWhy:SK==='ca'?(SUP?'California exige al menos 2 horas de capacitación para supervisores.':'California exige al menos 1 hora de capacitación.'):(SK==='chi'?(SUP?'Chicago exige que los supervisores completen cada año 2 horas de prevención del acoso y 1 hora de capacitación para testigos.':'Chicago exige cada año 1 hora de prevención del acoso y 1 hora de capacitación para testigos.'):'Connecticut exige al menos 2 horas de capacitación.'),\n  trainer:SK==='ca'?{note:'Manda una pregunta sobre esta capacitación. California exige que un capacitador responda en un plazo de dos días hábiles. Si no hay un correo de capacitador configurado, pregúntale a Recursos Humanos.'}:(NYISH?{note:'Nueva York exige que puedas hacer preguntas sobre esta capacitación. Manda la tuya aquí o pregúntale a Recursos Humanos.'}:null),\n  motto:['Conócelo','Detenlo','Repórtalo'],\n  blurb:REF?'Tu repaso anual. Situaciones nuevas, como imágenes hechas con IA, clientes que te graban y “era solo una broma”, más a dónde reportar. Unos 15 minutos.':((SUP?'Para supervisores. Qué es el acoso según la ley, cómo prevenirlo y exactamente qué hacer cuando alguien viene contigo.':'Qué es el acoso, en persona y en línea, cómo intervenir y cómo reportarlo de forma segura.')+(SK!=='all'?` Hecho para las reglas de ${ST.name}.`:'')+' Situaciones reales, práctica rápida y un certificado al final.'),\n  share:`Acabo de completar ${V.title}. Conócelo. Detenlo. Repórtalo.`,\n  care:'Si algo te pasó, no es tu culpa. Avísale a tu gerente, a Recursos Humanos o a alguien arriba de ellos. Las represalias por reportar son ilegales. También puedes contactar a '+(SK==='all'?'la EEOC (eeoc.gov) o a la agencia de tu estado':ST.agency)+'. Si estás en peligro, llama al 911. Para apoyo emocional, llama o manda un mensaje al 988.'\n};\n\n/* ---------- core lessons (everyone) ---------- */\nconst CORE=[\n {id:'c1',title:'Por qué importa',icon:'shield',mins:LONG?5:3,steps:steps(\n  {t:'talk',pose:'calm',say:`Hola, soy Lottie. Esta capacitación trata de una sola cosa: <b>que todos se sientan seguros en el trabajo.<\/b> ${SUP?'Como supervisor, tienes más poder y más responsabilidades. Vamos a ver las dos cosas.':'Lo vamos a mantener real y práctico.'}`,rule:'<b>Tres cosas que recordar:<\/b> Conócelo. Detenlo. Repórtalo.'},\n  {t:'tiles',pose:'think',say:'Esto es lo que vas a aprender.',tiles:[\n    {icon:'scale',c:'',b:'Conoce el límite',s:`Lo que dice la ley, según ${ST.law}.`},\n    {icon:'users',c:'o',b:'Intervén',s:'Formas sencillas de ayudar cuando lo ves.'},\n    {icon:'report',c:'p',b:'Repórtalo',s:'A dónde ir y qué pasa después.'},\n    {icon:'shield',c:'g',b:'Conoce tus derechos',s:'Las represalias son ilegales. Estás protegido.'}]},\n  W(LONG||NYISH,{t:'reflect',q:'Piensa en una vez que alguien en el trabajo, la escuela o en línea te hizo sentir menos. ¿Qué te hubiera gustado que alguien hiciera?',say:'Gracias por pensarlo. Guárdalo. Gran parte de este curso trata de ser ese alguien.'}),\n  {t:'mc',kind:'Cierto o falso',q:'La capacitación sobre acoso es solo para la gente que podría acosar a alguien.',opts:['Cierto','Falso'],a:1,noShuffle:1,\n    why:'Falso. Casi todo trata de qué hacer cuando lo ves o cuando te pasa a ti. Todos tienen un papel.'}\n )},\n {id:'c2',title:'Qué es el acoso',icon:'scale',mins:LONG?5:3,steps:steps(\n  {t:'talk',pose:'talk',say:'El acoso es una <b>conducta no deseada<\/b> por quién es alguien, como su raza, sexo o religión. Es ilegal cuando hace que el trabajo sea hostil o cuando tu trabajo depende de aguantarlo.',rule:`<b>Características protegidas por la ley federal:<\/b> ${FED_TRAITS}. ${ST.extra}`},\n  {t:'flip',q:'El acoso puede tener muchas formas. Toca cada tarjeta.',cards:[\n    {icon:'chat',c:'',front:'Dicho',hint:'Toca para voltear',back:'<b>Bromas, insultos, apodos, ofensas.<\/b>Comentarios sobre el cuerpo, el acento, la fe o la edad de alguien.'},\n    {icon:'eye',c:'o',front:'Mostrado',hint:'Toca para voltear',back:'<b>Fotos, memes, gestos, miradas.<\/b>Carteles, protectores de pantalla, pantallas compartidas “por accidente”.'},\n    {icon:'hand',c:'p',front:'Listo',hint:'Toca para voltear',back:'<b>Tocar, bloquear el paso, seguir.<\/b>Pararse demasiado cerca, rozar a propósito al pasar.'},\n    {icon:'phone',c:'g',front:'Enviado',hint:'Toca para voltear',back:'<b>Mensajes directos, textos, chats de grupo, comentarios.<\/b>Incluso fuera del horario, si se trata de gente del trabajo.'}]},\n  {t:'multi',q:'¿Cuáles de estas son características protegidas? Elige todas las que apliquen.',opts:['Religión','Edad (40 años o más)','Discapacidad','Equipo deportivo favorito'],a:[0,1,2],\n    why:'La religión, la edad y la discapacidad están protegidas. Los equipos deportivos no, aunque las burlas que se vuelven crueles pueden ir contra la política de tu trabajo.'},\n  {t:'mc',kind:ST.standardOk?'Tú decides':'Cierto o falso',q:ST.standardOk?'Un compañero hace un comentario de pasada sobre tu acento. ¿Eso es ilegal automáticamente?':`En ${ST.name}, el acoso tiene que ser extremo o pasar muchas veces para ser ilegal.`,\n    opts:ST.standardOk?['No siempre, pero puede ir contra la política y se debe reportar','Sí, siempre es ilegal','No, los comentarios nunca cuentan']:['Cierto','Falso'],a:ST.standardOk?0:1,noShuffle:ST.standardOk?0:1,\n    why:ST.standard},\n  W(LONG,{t:'swipe',q:'¿Se trata de quién es alguien? Desliza cada uno.',left:'Sobre quién es',right:'Sobre el trabajo',items:[\n    ['“Las mujeres no pueden con la bodega.”','user',0],['“Tus conteos salieron mal dos veces esta semana.”','check',1],['“Regrésate a tu país.”','pin',0],\n    ['“Faltaste a la junta de las 9:00.”','clock',1],['“Ya estás muy grande para aprender el sistema nuevo.”','user',0],['“Por favor ponte tu gafete.”','user',1]],\n    why:'Los comentarios sobre el trabajo son normales. Los comentarios sobre quién es alguien, como su sexo, origen o edad, se convierten en acoso.'})\n )},\n {id:'c3',title:'Acoso sexual',icon:'heartI',mins:LONG?5:3,steps:steps(\n  {t:'bins',q:'Clasifica cada uno: ¿“esto por aquello” o ambiente hostil?',bins:[['Esto por aquello','Un beneficio del trabajo a cambio de un favor sexual'],['Ambiente hostil','Una conducta hace que el trabajo se sienta inseguro']],\n    items:[['“Sal conmigo y te doy mejores turnos.”',0],['Bromas sexuales todo el tiempo en el cuarto de descanso',1],['“Tu aumento depende de qué tan amable seas conmigo.”',0],['Memes sexuales publicados en el chat del equipo',1],['Un líder te recorta las horas después de que rechazas una cita',0],['Compañeros calificando el cuerpo de los demás',1]],\n    why:'“Esto por aquello” (quid pro quo) significa que un beneficio del trabajo depende de un favor sexual. Ambiente hostil significa que una conducta sexual hace que el trabajo sea ofensivo o dé miedo. Las dos son ilegales.'},\n  {t:'mc',kind:'Cierto o falso',q:'El acoso sexual solo cuenta si a quien acosa le atrae la persona.',opts:['Cierto','Falso'],a:1,noShuffle:1,\n    why:'Falso. No tiene que ser por deseo. Puede ser por poder, para humillar o “nomás de broma”.'},\n  {t:'swipe',q:'¿Quién puede acosar? Desliza cada uno.',left:'Puede acosar',right:'No puede',items:[\n    ['A manager','crown',0],['A coworker','users',0],['A customer','cash',0],['Alguien del mismo sexo','user',0],['Un repartidor o proveedor','truck',0]],\n    why:'Cualquiera. Gerentes, compañeros, clientes, proveedores y personas de cualquier género, incluido el mismo género que tú.'},\n  W(SK==='chi',{t:'flip',q:'Chicago agrega la “conducta sexual indebida”. Toca cada tarjeta.',cards:[\n    {icon:'crown',c:'',front:'Abuso de poder',hint:'Toca para voltear',back:'<b>Usar un puesto para presionar por atención sexual.<\/b>“Yo hago los horarios. Sé amable conmigo.”'},\n    {icon:'alert',c:'o',front:'Presión',hint:'Toca para voltear',back:'<b>Coerción, aun sin palabras.<\/b>Indirectas, amenazas o favores que hacen que decir “no” se sienta arriesgado.'},\n    {icon:'key',c:'p',front:'Mal uso de un puesto',hint:'Toca para voltear',back:'<b>Usar el acceso que te da el trabajo.<\/b>Como sacar el número de un compañero de los archivos.'}]})\n )},\n {id:'c4',title:'Identidad de género y orientación',icon:'users',mins:LONG?5:3,steps:steps(\n  {t:'talk',pose:'calm',say:`El acoso por <b>orientación sexual, identidad de género o expresión de género<\/b> es ilegal${SK==='all'?' según la ley federal':` en ${ST.name} y según la ley federal`}. Eso incluye lo que alguien se pone, cómo se ve o el nombre que usa.`},\n  {t:'texts',q:'El chat del equipo después de que entra una compañera nueva.',chat:'Equipo de cierre',sub:'7 members',icon:'users',rounds:[\n    {msgs:[['','Thursday 9:14 PM'],['Marcus','la nueva, Jordan, está medio rara jaja'],['Kayla','espera, jordan es chavo o chava 💀'],['Marcus','ni idea, le voy a decir “eso” 😂']],ask:'¿Qué mandas?',opts:[\n      {t:'No es chistoso. Jordan usa ella. Nomás dile Jordan.',ok:1,fb:'Corto y claro. Dijiste cuál era el problema sin empezar un pleito.',then:[['Kayla','perdón'],['Marcus','ok ok']]},\n      {t:'😂',ok:0,fb:'Una risa se lee como “sigan”. Y este es el tipo de chat que termina en un reporte de Recursos Humanos.',then:[['Marcus','lmaooo']]},\n      {t:'(Silenciar el chat)',ok:0,fb:'Silenciarlo te protege a ti, pero Jordan podría estar en este chat o ver capturas de pantalla. Una respuesta corta, o hablar con tu líder, ayuda.',then:[['','Más tarde: Jordan salió del chat.']]}]}],\n    why:'Decirle “eso” a alguien o burlarse de su género es acoso. Usa el nombre y los pronombres que la gente pide. Si sigue, avísale a tu gerente.'},\n  {t:'mc',kind:'Tu decisión',scene:'No estás seguro de qué pronombres usa una persona nueva.',q:'¿Qué es lo respetuoso?',opts:['Usar su nombre, o preguntarle en privado: “¿Qué pronombres usas?”','Adivinar según cómo se ve','Preguntar en voz alta frente a todos'],a:0,\n    why:'Usar el nombre de alguien siempre es seguro. Preguntar en privado es respetuoso. Si te equivocas, di “perdón, ella” y sigue.'},\n  W(LONG||NYISH,{t:'swipe',q:'¿Está bien, o se pasa?',left:'Se pasa',right:'Está bien',items:[\n    ['Decirle a un compañero que su ropa es “demasiado gay para el trabajo”','eye',0],['Usar el nombre nuevo de un compañero después de que lo pide','user',1],['Preguntarle a un compañero trans sobre su cuerpo','ban',0],\n    ['Incluir a la pareja de un compañero en una invitación del equipo','heartI',1],['Usar a propósito y una y otra vez el nombre anterior de alguien','chat',0]],\n    why:'Respetar es usar los nombres y pronombres de la gente y dejar fuera del trabajo las preguntas sobre el cuerpo. Hacer lo contrario a propósito es acoso.'})\n )},\n {id:'c5',title:'Raza, religión, edad y más',icon:'user',mins:LONG?5:3,steps:steps(\n  {t:'post',kind:'Revisión del chat del equipo',q:'Tus compañeros escribieron esto para el chat del equipo. ¿Lo publicas o no?',items:[\n    {pic:'Meme sobre la religión de un compañero, con su foto',cap:'cuando [nombre] no puede comer con nosotros jaja',icon:'camera',ok:0,where:'chat del equipo',why:'Burlarse de la fe de alguien, con su foto. Eso es acoso.'},\n    {pic:'Foto de todo el equipo en la comida del equipo',cap:'el mejor equipo 🍕',icon:'users',ok:1,where:'chat del equipo',why:'Todos salen y nadie es el chiste. Publícala.'},\n    {pic:'Video imitando el acento de un compañero',cap:'servicio al cliente por [nombre] 😂',icon:'chat',ok:0,where:'chat del equipo',why:'Imitar un acento ataca el origen nacional. No lo publiques.'},\n    {pic:'GIF de un señor mayor batallando con un celular',cap:'Linda vs. la app nueva de horarios',icon:'phone',ok:0,where:'chat del equipo',why:'Las bromas sobre la edad de un compañero pueden ser acoso por edad. No lo publiques.'}],\n    why:'Si el chiste es sobre quién es alguien, no va en el chat.'},\n  {t:'mc',kind:'Tu decisión',scene:'Una compañera usa silla de ruedas. Otros hacen bromas de “límite de velocidad” cuando pasa. Ella sonríe, pero ya empezó a tomar sus descansos sola.',q:'¿Qué está pasando?',opts:['Las bromas atacan su discapacidad y probablemente no son bienvenidas','Está bien porque ella sonríe','Solo es un problema si se queja'],a:0,\n    why:'Mucha gente sonríe para aguantar el momento. Las bromas no deseadas sobre una discapacidad son acoso, se queje o no.'},\n  W(LONG,{t:'flip',q:'Palabras que suenan inofensivas, pero no lo son. Toca cada tarjeta.',cards:[\n    {icon:'chat',c:'',front:'“¿De dónde eres realmente?”',hint:'Toca para voltear',back:'<b>Dice “no perteneces aquí”.<\/b>Sobre todo cuando se pregunta una y otra vez.'},\n    {icon:'clock',c:'o',front:'“OK, boomer.”',hint:'Toca para voltear',back:'<b>Las bromas sobre la edad se acumulan.<\/b>Los trabajadores de 40 años o más están protegidos.'},\n    {icon:'eye',c:'p',front:'“No pareces discapacitado.”',hint:'Toca para voltear',back:'<b>Muchas discapacidades no se ven.<\/b>No cuestiones lo que alguien necesita.'},\n    {icon:'hands',c:'g',front:'“Qué naco.”',hint:'Toca para voltear',back:'<b>Las palabras en clave también pueden atacar la raza.<\/b>Déjalas.'}]})\n )},\n {id:'c6',title:'En línea, a distancia y fuera del horario',icon:'phone',mins:LONG?5:3,steps:steps(\n  {t:'talk',pose:'think',say:'El acoso no se queda en la puerta. Cuenta en <b>mensajes directos, chats de grupo, videollamadas, redes sociales, viajes de trabajo y fiestas<\/b>, cuando involucra a gente del trabajo.'},\n  {t:'texts',q:'Un compañero te manda un mensaje directo un sábado.',chat:'Devin (compañero)',sub:'Trabaja en tu turno',icon:'user',rounds:[\n    {msgs:[['','Saturday 11:52 PM'],['Devin','u up'],['Devin','vi tus fotos de la playa 👀👀'],['Devin','deberías ir así al trabajo jaja']],ask:'No te interesa. ¿Qué le mandas?',opts:[\n      {t:'No está bien. Nomás cosas del trabajo, por favor.',ok:1,fb:'Claro y corto. No le debes un tono amable ni una razón.',then:[['Devin','uy ok perdón']]},\n      {t:'jaja ya duérmete',ok:0,fb:'Es totalmente entendible, y nunca es tu culpa. Pero contestar con una broma se puede leer como “sigue”. Tienes derecho a ser directo.',then:[['Devin','solo si estás tú 😏']]},\n      {t:'(Bloquearlo sin guardar nada)',ok:0,fb:'Bloquear está bien. Pero primero toma captura de pantalla. Es tu prueba si sigue en el trabajo.',then:[]}]},\n    {msgs:[['','Lunes'],['Devin','oye lo del sábado... no le dijiste a nadie verdad? 😬']],ask:'¿Y ahora?',opts:[\n      {t:'(Tomar capturas de los mensajes y avisarle a tu gerente o a Recursos Humanos)',ok:1,fb:'Las capturas son prueba. No tienes que manejarlo solo, y reportar está protegido.',then:[['','Guardaste el chat.']]},\n      {t:'nel, todo bien',ok:0,fb:'No tiene que estar bien. Todavía puedes reportarlo, aunque hayas dicho que estaba bien.',then:[]}]}],\n    why:'Lo que pasa en línea cuenta. Di que no si te sientes seguro, guarda los mensajes y cuéntale a alguien.'},\n  {t:'multi',q:'¿Cuáles de estas pueden contar como acoso en el trabajo? Elige todas las que apliquen.',opts:['Comentarios sexuales en la posada fuera del trabajo','Un compañero publica tu foto con un comentario cruel','Mensajes directos repetidos después de que dijiste basta','Un compañero publica fotos de sus propias vacaciones'],a:[0,1,2],\n    why:'Las fiestas, publicaciones y mensajes con gente del trabajo cuentan. Alguien que comparte fotos de sus vacaciones solo está… compartiendo fotos de sus vacaciones.'}\n )},\n {id:'c7',title:'Clientes y proveedores',icon:'cash',mins:LONG?5:3,steps:steps(\n  {t:'talkback',q:'Un cliente frecuente te sigue haciendo comentarios.',who:'Cliente',meter:55,start:'s',labels:['Bien manejado','Incómodo','Peligroso'],\n    why:'No tienes que “aguantarlo” por la propina o la venta. Pon un límite, pide apoyo y avísale a tu gerente.',nodes:{\n    s:{say:'Ahí está mi favorita. Deberías sonreír más, preciosa. ¿A qué hora sales?',choices:[\n      {t:'“Ya empiezo con tu orden. ¿Qué te sirvo?”',d:-15,to:'mid',fb:'Tranquila y al grano. Cambiaste el tema sin seguirle el juego.'},\n      {t:'Reírte y decir: “¡Eso quisieras saber!”',d:20,to:'worse',fb:'Es una forma normal de sobrevivir el momento. Pero se puede leer como coqueteo.'},\n      {t:'Quedarte paralizada y no decir nada.',d:10,to:'worse',fb:'Paralizarse es una reacción normal. Está bien. La próxima vez, tener un plan ayuda.'}]},\n    worse:{act:'Se inclina más sobre el mostrador.',say:'Ándale, te espero. Siempre te espero.',choices:[\n      {t:'“Por favor ya basta. Voy por mi gerente.”',d:-25,to:'good',fb:'Un límite claro y luego apoyo. Exactamente así.'},\n      {t:'Seguir riéndote.',d:20,to:'bad',fb:'Está presionando más. Es hora de pedir apoyo.'}]},\n    mid:{say:'Nomás un café. Y tu número.',choices:[\n      {t:'“Nomás el café. Mi compañero te cobra.” Luego avísale a tu gerente.',d:-25,to:'good',fb:'Pusiste un límite y conseguiste apoyo. Tu gerente le puede prohibir la entrada o manejarlo.'},\n      {t:'Darle un número falso para que se vaya.',d:15,to:'bad',fb:'Puede que se acabe el momento, pero va a regresar. Avísale a tu gerente.'}]},\n    good:{end:1,good:1,say:'Bueno. Como sea.',title:'Mantuviste el límite.',msg:'Te mantuviste tranquila, no le seguiste el juego y pediste apoyo. Ahora avísale a tu gerente para que no siga pasando.'},\n    bad:{end:1,good:0,act:'Regresa al día siguiente y te espera junto a tu carro.',title:'Siguió pasando.',msg:'Aquí se vuelve inseguro. Avísale a tu gerente de inmediato. Tu empleador tiene que actuar.'}}},\n  {t:'mc',kind:'Cierto o falso',q:`Tu empleador tiene que actuar cuando un cliente o proveedor te acosa${NYISH?', y Nueva York también protege a contratistas y proveedores que sufren acoso en tu lugar de trabajo':''}.`,opts:['Cierto','Falso'],a:0,noShuffle:1,\n    why:'Cierto. Una vez que tu empleador lo sabe, tiene que tomar medidas, como cambiar quién atiende a ese cliente, advertirle o prohibirle la entrada.'},\n  W(LONG,{t:'tiles',pose:'calm',say:'Cuando alguien de fuera de la empresa se pasa del límite, tu empleador puede:',tiles:[\n    {icon:'users',c:'',b:'Cambiarte',s:'Un compañero o gerente atiende a ese cliente.'},\n    {icon:'chat',c:'o',b:'Advertirle',s:'Un gerente le dice que pare.'},\n    {icon:'ban',c:'p',b:'Prohibirle la entrada',s:'Se les puede negar el servicio a clientes y proveedores.'},\n    {icon:'report',c:'g',b:'Anotarlo',s:'Para que el siguiente turno sepa qué pasó.'}]})\n )},\n W(SK==='ca'||LONG,{id:'c8',title:'Conducta abusiva',icon:'alert',mins:LONG?5:3,steps:steps(\n  {t:'talk',pose:'calm',say:'La <b>conducta abusiva<\/b> es el acoso laboral o bullying. No tiene que ser por quién eres. Es una conducta con mala intención que una persona razonable vería como hostil y que <b>no tiene nada que ver con el negocio<\/b>.',rule:'<b>Ejemplos:<\/b> gritos o insultos repetidos, amenazas, humillar a alguien frente a otros o sabotear su trabajo a propósito. Un solo acto normalmente no es suficiente, a menos que sea muy grave.'},\n  {t:'swipe',q:'¿Estricto pero justo, o abusivo?',left:'Abusivo',right:'Estricto pero justo',items:[\n    ['“Tus conteos salieron mal. Arreglémoslo antes de cerrar.”','check',1],['Gritar “no sirves para nada” frente a los clientes','alert',0],['Esconder las herramientas de un compañero para que se atrase','wrench',0],\n    ['Levantarle un reporte a alguien por llegar tarde tres veces','clock',1],['Decirle “estúpido” a alguien en cada turno','chat',0],['Repartir de forma justa las tareas de cierre','cal',1]],\n    why:'Los comentarios claros y las reglas justas son parte del trabajo. Los insultos repetidos, la humillación y el sabotaje no.'},\n  {t:'mc',kind:'Tu decisión',scene:'Tu líder se burla de los errores de un compañero frente a todo el equipo, cada turno. No tiene que ver con raza ni sexo. Solo es cruel.',q:'¿Vale la pena reportarlo?',opts:['Sí. La conducta abusiva va contra la política y se debe reportar','No. Solo cuenta si es por una característica protegida','No. Los líderes pueden ser duros'],a:0,\n    why:'El bullying lastima a la gente y va contra la mayoría de las políticas de trabajo. Repórtalo igual que reportarías el acoso.'}\n )}),\n {id:'c9',title:'Si lo ves',icon:'users',mins:LONG?5:3,steps:steps(\n  {t:'mn',q:'¿Viste algo? Escoge una de las 5 D.',items:[\n    {L:'D',w:'Directo',d:'Di algo: “No está bien. Ya basta.” Solo si te sientes seguro.'},\n    {L:'D',w:'Distrae',d:'Interrumpe: “Oye, ¿me ayudas atrás?” Rompe el momento.'},\n    {L:'D',w:'Delega',d:'Busca a un gerente o a alguien con más poder para que intervenga.'},\n    {L:'D',w:'Después',d:'Pregunta después: “¿Estás bien? Eso no estuvo bien.”'},\n    {L:'D',w:'Documenta',d:'Anota lo que viste. Dáselo a la persona a quien le pasó.'}]},\n  {t:'bins',q:'¿Qué D es?',bins:[['Distrae','Rompe el momento'],['Delega','Busca a alguien'],['Después','Pregunta después']],\n    items:[['“¡Oye, está sonando tu celular atrás!”',0],['Le pides al gerente del turno que venga',1],['Después: “Eso estuvo muy mal. ¿Estás bien?”',2],['Tiras una caja a propósito para que todos volteen',0],['Le mandas un mensaje a Recursos Humanos con lo que viste',1],['Acompañas a tu compañera a su carro después',2]],\n    why:'No hay una D incorrecta. Escoge la que se sienta segura para ti en ese momento.'},\n  {t:'mc',kind:'Tu decisión',scene:'En una fiesta del equipo, un compañero le insiste con tragos a una chava nueva y la jala para sentarla en sus piernas. Ella se ve atrapada.',q:'¿Qué es una buena acción?',opts:['“¡Oye, ven a ayudarme con el pastel!” y llevártela de ahí','Grabarlo como prueba y publicarlo','No hacer nada, es una fiesta'],a:0,\n    why:'Distrae y sácala del momento. Luego pregúntale cómo está y avísale a un gerente. Grabar y publicar puede lastimarla más.'}\n )},\n {id:'c10',title:'Si te pasa a ti',icon:'heartI',mins:LONG?5:3,steps:steps(\n  {t:'tiles',pose:'calm',say:'Si alguien se pasa del límite contigo, <b>no es tu culpa.<\/b> Recuerda <b>SAFE<\/b>. Usa lo que se sienta seguro para ti.',tiles:[\n    {icon:'chat',c:'',b:'Señálalo, si es seguro',s:'“Ya basta. No me gusta.” No le debes una razón.'},\n    {icon:'book',c:'o',b:'Agrégalo a tus notas',s:'Qué, cuándo, dónde, quién vio. Guarda capturas de pantalla.'},\n    {icon:'users',c:'p',b:'Familia o amigos: busca apoyo',s:'Un compañero de confianza, un amigo, o el 988 si necesitas hablar.'},\n    {icon:'report',c:'g',b:'Escálalo',s:'Repórtalo a tu gerente, a Recursos Humanos o al jefe de tu gerente.'}]},\n  {t:'tone',q:'Pon un límite claro. Arregla este mensaje.',to:'Para: Chris (compañero)',parts:[\n    {o:['jaja ya 😅','Oye, necesito que dejes de','no sé, mejor no'],a:1},' ',\n    {o:['tocarme la espalda cuando pasas.','ser así, supongo.','hacer eso.'],a:0},' ',\n    {o:['Si vuelve a pasar, lo voy a reportar.','¡Perdón si es raro!','No es para tanto, eh.'],a:0}],\n    why:'Claro, específico y sin disculpas. Decir qué va a pasar después es opcional, pero tiene mucha fuerza.'},\n  {t:'form',kind:'Anotarlo',q:'Pasó algo. Escoge la mejor anotación para cada línea de tus notas.',title:'Mis notas',fields:[\n    {k:'Cuándo',o:['Mar, 4 de marzo, como a las 2:15 PM','Algún día de la semana pasada'],a:0},\n    {k:'Dónde',o:['Cámara fría, al fondo de la tienda','En el trabajo'],a:0},\n    {k:'Qué pasó',o:['Alex dijo “qué buen cuerpo” y me tocó la cintura. Le dije que parara.','Alex otra vez estaba raro'],a:0},\n    {k:'Quién vio',o:['Priya estaba surtiendo cerca','Nadie, creo'],a:0}],\n    why:'Fechas, lugares, palabras y testigos exactos hacen que tu reporte sea claro. Guarda una copia en algo que no sea un aparato del trabajo.'},\n  W(LONG,{t:'reflect',q:'Si esto te pasara, ¿a quién en el trabajo te sentirías bien contándole primero?',say:'Es bueno saberlo ahora, antes de necesitarlo. Si esa persona es el problema, ve con su jefe o con Recursos Humanos.'})\n )},\n {id:'c11',title:'Cómo reportar',icon:'report',mins:LONG?5:3,steps:steps(\n  {t:'order',q:'Quieres reportar acoso. Pon los pasos en orden.',items:['Anota lo que pasó, con fechas','Guarda capturas de pantalla o mensajes','Avísale a tu gerente, a Recursos Humanos o al jefe de tu gerente','Da seguimiento si nada cambia'],\n    why:'Anótalo, guárdalo, cuéntale a alguien, da seguimiento. Puedes reportar de palabra o por escrito. Usa el formulario de quejas de tu empresa si tiene uno.'},\n  {t:'mc',kind:'Tu decisión',scene:'Quien te acosa es tu propio gerente.',q:'¿A quién se lo reportas?',opts:['A su jefe, a Recursos Humanos o a la línea directa de tu política','A nadie. Tienes que pasar por tu gerente','Solo a la policía'],a:0,\n    why:'Nunca tienes que reportarle a la persona que te acosa. Pásale por encima. Tu política dice a qué otras personas puedes decirles.'},\n  {t:'multi',q:'¿Cuáles son buenas formas de reportar? Elige todas las que apliquen.',opts:['Decirle a tu gerente en persona','Mandarle un correo a Recursos Humanos','Usar la línea directa o el formulario de quejas de la empresa','Publicarlo primero en redes sociales'],a:[0,1,2],\n    why:'Usa primero las opciones para reportar de tu trabajo para que puedan actuar rápido. Publicarlo puede hacer más difícil arreglarlo y puede compartir información privada.'}\n )},\n {id:'c12',title:'Después de reportar',icon:'book',mins:LONG?5:3,steps:steps(\n  {t:'talk',pose:'calm',say:'Cuando reportas, tu empleador tiene que <b>investigarlo rápido y de forma justa<\/b>, y detener el acoso si pasó.'},\n  {t:'flip',q:'¿Qué pasa después? Toca cada tarjeta.',cards:[\n    {icon:'eye',c:'',front:'Investigación',hint:'Toca para voltear',back:'<b>Alguien neutral lo investiga.<\/b>Habla contigo, con la otra persona y con los testigos.'},\n    {icon:'lockI',c:'o',front:'Privacidad',hint:'Toca para voltear',back:'<b>Se mantiene lo más privado posible.<\/b>Pero no 100% secreto. Algunas personas tienen que saberlo para arreglarlo.'},\n    {icon:'shield',c:'p',front:'Seguridad ahora',hint:'Toca para voltear',back:'<b>Medidas para protegerte.<\/b>Como cambiar horarios, sin castigarte a ti.'},\n    {icon:'check',c:'g',front:'Resultado',hint:'Toca para voltear',back:'<b>Acción si pasó.<\/b>Desde entrenamiento hasta despido. Te van a avisar que ya se manejó.'}]},\n  {t:'mc',kind:'Cierto o falso',q:'Recursos Humanos puede prometer que nadie sabrá nunca que hiciste un reporte.',opts:['Cierto','Falso'],a:1,noShuffle:1,\n    why:'Falso. Recursos Humanos lo mantiene lo más privado que puede, pero quizás tenga que hablar con la otra persona y con los testigos para arreglarlo. Eso se llama confidencialidad limitada.'},\n  W(LONG,{t:'swipe',q:'¿Forma justa de manejarlo, o no?',left:'No es justo',right:'Justo',items:[\n    ['Pasar a quien reportó a peores turnos','cal',0],['Entrevistar a las dos personas y a los testigos','users',1],['Decirle a todo el equipo quién se quejó','chat',0],\n    ['Tomar notas de cada entrevista','book',1],['Esperar dos meses para empezar','clock',0]],\n    why:'Una buena investigación es rápida, neutral y privada, y nunca castiga a quien reportó.'})\n )},\n {id:'c13',title:'Las represalias son ilegales',icon:'shield',mins:LONG?5:3,steps:steps(\n  {t:'talk',pose:'calm',say:'Las <b>represalias<\/b> son castigar a alguien por reportar acoso, ayudar en una investigación o defender a un compañero. Son ilegales, aunque no se compruebe el acoso.'},\n  {t:'swipe',q:'¿Represalia, o no?',left:'Represalia',right:'No es represalia',items:[\n    ['Quitarle horas a alguien justo después de que reporta','cal',0],['Dejar fuera a propósito a un testigo de la comida del equipo','users',0],['Levantarle un reporte a alguien por faltar a un turno, igual que a cualquiera','check',1],\n    ['Decirle “soplón” a la persona que reportó','chat',0],['Cambiar un horario porque quien reportó lo pidió','clock',1]],\n    why:'Cualquier mal trato porque alguien reportó o ayudó es represalia. Las reglas normales aplicadas por igual a todos no lo son.'},\n  {t:'mc',kind:'Tu decisión',scene:'Desde que apoyaste el reporte de un compañero, tu líder te da las peores tareas y te ignora.',q:'¿Qué haces?',opts:['Anotarlo y reportar también la represalia','Renunciar, no hay nada que hacer','Dejarlo pasar, es normal'],a:0,\n    why:'La represalia es una violación aparte. Repórtala igual, a Recursos Humanos o a alguien arriba de tu líder.'}\n )},\n {id:'c14',title:'Tus derechos según la ley',icon:'scale',mins:LONG?6:3,steps:steps(\n  {t:'tiles',pose:'think',say:`Siempre puedes reportar primero dentro de tu trabajo. También tienes derecho a acudir afuera. Aquí te decimos a dónde${SK!=='all'?` en ${ST.name}`:''}:`,tiles:ST.agencies},\n  {t:'mc',q:ST.deadlineQ.q,opts:ST.deadlineQ.opts,a:ST.deadlineQ.a,why:ST.deadlineQ.why},\n  {t:'multi',q:'Si se comprueba el acoso, ¿qué puede ordenar un tribunal o una agencia? Elige todas las que apliquen.',opts:['Que te paguen el sueldo perdido','Que te regresen tu trabajo','Dinero por el daño emocional','Que tu empleador cambie sus políticas y capacitación'],a:[0,1,2,3],\n    why:`Todas. Las soluciones también pueden incluir daños punitivos y honorarios de abogados.${SK==='ca'?' En California, quien acosa también puede ser responsable personalmente.':''}`},\n  W(LONG,{t:'dial',q:'Adivina: ¿cuántas de las personas que sufren acoso en el trabajo llegan a hacer un reporte formal?',start:3,answer:[1],stops:[\n    {v:'Casi ninguna',fx:'No tan pocas.'},\n    {v:'Unos 1 in 4',fx:'Los estudios dicen que <b>unas 3 de cada 4 personas nunca lo reportan.<\/b> Muchas tienen miedo a las represalias.',mark:1},\n    {v:'Como la mitad',fx:'Son menos.'},\n    {v:'La mayoría',fx:'Por desgracia, no.'}],\n    why:'La mayoría nunca lo reporta, casi siempre por miedo a que las castiguen. Por eso las represalias son ilegales, y por eso intervenir importa.'}),\n  W(!SUP,{t:'pledge',say:'Todos merecen respeto en el trabajo. ¿Listo para comprometerte?',lines:['Sé dónde está el límite, en persona y en línea.','Ayudo a detenerlo cuando lo veo, de una forma segura.','Lo reporto, y apoyo a quienes lo reportan.']})\n )}\n].filter(Boolean);\n\n/* ---------- short supervisor lesson (NY, IL, CT, all) ---------- */\nconst SUP_SHORT={id:'s0',title:'Si supervisas a otros',icon:'crown',mins:4,steps:[\n  {t:'talk',pose:'talk',say:'¿Diriges un turno, un equipo o aunque sea a una persona? Entonces tienes <b>responsabilidades extra<\/b>. Cuando te enteras de un acoso, legalmente la empresa también lo sabe.'},\n  {t:'mn',q:'Si alguien viene contigo, recuerda LEAD.',items:[\n    {L:'L',w:'Escucha',d:'Dale las gracias. No juzgues, no discutas y no prometas guardar el secreto.'},\n    {L:'E',w:'Escálalo',d:'Repórtalo a Recursos Humanos o a tu jefe de inmediato, el mismo día.'},\n    {L:'A',w:'Actúa para proteger',d:'Mantén a la persona a salvo. Nunca la castigues por hablar.'},\n    {L:'D',w:'Documenta',d:'Anota lo que te dijo, con sus palabras.'}]},\n  {t:'mc',kind:'Tu decisión',scene:'Una persona del equipo te cuenta que un compañero la sigue tocando. Te dice: “Por favor no le digas a nadie.”',q:'¿Qué haces?',opts:['Darle las gracias, explicarle que tienes que reportarlo y avisar hoy a Recursos Humanos','Prometer que lo vas a guardar en secreto','Esperar a ver si vuelve a pasar'],a:0,\n    why:'Los supervisores tienen que reportar. Sé honesto: “No puedo guardar esto en secreto, pero solo lo voy a compartir con quien necesita saberlo.”'}\n]};\n\n/* ---------- California supervisor lessons (2-hour version) ---------- */\nconst SUPER=[\n {id:'s1',title:'Tu papel como supervisor',icon:'crown',mins:7,steps:[\n  {t:'talk',pose:'calm',say:SK==='ca'?'Como supervisor, <b>hablas en nombre de la empresa<\/b>. En California, la empresa es responsable del acoso de los supervisores, aunque nadie más arriba lo supiera. Y <b>te pueden demandar personalmente<\/b> por acosar a alguien.':'Como supervisor, <b>hablas en nombre de la empresa<\/b>. En Illinois, la empresa es responsable del acoso sexual de cualquier supervisor, aunque nadie más arriba lo supiera. Y <b>te pueden hacer responsable en persona<\/b> por acosar a alguien.',rule:'<b>¿Quién cuenta como supervisor?<\/b> Cualquiera que pueda contratar, despedir, hacer horarios, disciplinar, asignar trabajo o premiar, o recomendar esas cosas.'},\n  {t:'multi',q:'¿Cuáles de estas personas cuentan como supervisores según la ley? Elige todas las que apliquen.',opts:['Un líder de turno que asigna tareas y descansos','Un subgerente que puede levantar reportes','Un líder que recomienda a quién contratar','Un compañero con el mismo puesto que tú'],a:[0,1,2],\n    why:'Si diriges el trabajo o puedes recomendar disciplina o contrataciones, es probable que la ley te vea como supervisor.'},\n  {t:'reflect',q:'¿Qué hizo tu mejor jefe que te hizo sentir seguro para hablar?',say:'Sea lo que sea, tú también lo puedes hacer. Tu equipo se fija en cómo reaccionas a las cosas pequeñas.'}\n ]},\n {id:'s2',title:'Marca la pauta',icon:'users',mins:7,steps:[\n  {t:'flip',q:'Hábitos que previenen el acoso. Toca cada tarjeta.',cards:[\n    {icon:'eye',c:'',front:'Fíjate',hint:'Toca para voltear',back:'<b>Pon atención a las cosas pequeñas.<\/b>Bromas, apodos y a quién dejan fuera.'},\n    {icon:'chat',c:'o',front:'Ponle nombre',hint:'Toca para voltear',back:'<b>Páralo en el momento.<\/b>“Aquí no hacemos eso.”'},\n    {icon:'star',c:'p',front:'Pon el ejemplo',hint:'Toca para voltear',back:'<b>Tu equipo te copia.<\/b>Si te ríes, creen que está bien.'},\n    {icon:'cal',c:'g',front:'Sé justo',hint:'Toca para voltear',back:'<b>Las mismas reglas para todos.<\/b>Turnos, descansos, disciplina.'}]},\n  {t:'swipe',q:'¿Buen liderazgo, o un problema?',left:'Problema',right:'Buen liderazgo',items:[\n    ['Reírte de un chiste vulgar para parecer buena onda','smile',0],['Parar un apodo sobre el acento de alguien','chat',1],['Darles los buenos turnos solo a tus amigos','cal',0],\n    ['Recordarle al equipo cómo reportar problemas','report',1],['Agregar a gente de tu equipo en redes y darle like a sus fotos en bikini','phone',0]],\n    why:'Los líderes marcan el límite. Reírse, el favoritismo y los límites personales borrosos invitan a los problemas.'},\n  {t:'mc',kind:'Tu decisión',scene:'El chat de grupo de tu equipo tiene una broma constante sobre el peso de un compañero. Tú estás en el chat.',q:'¿Qué haces?',opts:['Publicar: “Ya basta de bromas sobre el peso. No está bien.” Luego preguntarle al compañero cómo está','No decir nada, tú no empezaste','Salirte del chat'],a:0,\n    why:'Si lo ves, te toca. Páralo, pregunta cómo está la persona y avísale a Recursos Humanos si sigue.'}\n ]},\n {id:'s3',title:'Cuando alguien te cuenta',icon:'chat',mins:8,steps:[\n  {t:'mn',q:'Cuando alguien te reporta algo, recuerda LEAD.',items:[\n    {L:'L',w:'Escucha',d:'Dale privacidad y tiempo. Dale las gracias. No juzgues ni discutas.'},\n    {L:'E',w:'Escálalo',d:'Avísale a Recursos Humanos o a tu jefe de inmediato. Tú no puedes decidir que “no es serio”.'},\n    {L:'A',w:'Actúa para proteger',d:'Mantenle a salvo ahora. Nunca le castigues, ni por accidente.'},\n    {L:'D',w:'Documenta',d:'Anota lo que dijo, cuándo y lo que hiciste. Sus palabras, no las tuyas.'}]},\n  {t:'talkback',q:'Una persona del equipo viene contigo después del cierre.',who:'Del equipo',meter:50,start:'s',labels:['Confía en ti','Insegura','Se cierra'],\n    why:'Escucha, dale las gracias, sé honesto de que tienes que reportarlo y dile qué pasa después.',nodes:{\n    s:{say:'¿Puedo hablar contigo? Es sobre Jake. Siempre dice cosas sobre mi cuerpo. No quiero hacer un drama.',choices:[\n      {t:'“Gracias por contarme. Qué bueno que lo hiciste. ¿Me puedes decir qué te ha dicho?”',d:-20,to:'mid',fb:'Primero escuchaste e hiciste que fuera seguro seguir hablando.'},\n      {t:'“¿Jake? Bromea con todos. ¿Estás segura?”',d:25,to:'bad',fb:'Dudar de ella la hace cerrarse, y puede contar como ignorar una queja.'},\n      {t:'“Ay, no tengo tiempo para dramas.”',d:30,to:'bad',fb:'Ahora esto es tu trabajo. Ignorarlo puede hacer responsable a la empresa.'}]},\n    mid:{say:'O sea, cada turno. Y me mandó un mensaje la semana pasada. Pero por favor no le digas a nadie.',choices:[\n      {t:'“No lo puedo guardar en secreto, pero solo lo voy a compartir con Recursos Humanos y con quien necesite saberlo. No te vas a meter en problemas por esto.”',d:-25,to:'good',fb:'Honesto sobre el deber de reportar, y claro en que está protegida.'},\n      {t:'“Okey, no voy a decir nada.”',d:20,to:'bad',fb:'No puedes prometer eso. Una vez que tú lo sabes, la empresa lo sabe.'}]},\n    good:{end:1,good:1,say:'Okey. Gracias. Me daba nervios decir algo.',title:'Confía en ti.',msg:'Ahora escala y documenta: avísale hoy a Recursos Humanos y anota lo que te dijo.'},\n    bad:{end:1,good:0,act:'Se queda callada y dice “Olvídalo”.',title:'Se cerró.',msg:'Aunque diga “olvídalo”, igual tienes que reportar lo que escuchaste.'}}},\n  {t:'form',kind:'Documéntalo',q:'Escribe tus notas después de la plática. Escoge la mejor anotación para cada línea.',title:'Notas del supervisor',fields:[\n    {k:'Fecha de la plática',o:['Lun, 9 de junio, 10:40 PM, después del cierre','Lunes'],a:0},\n    {k:'Lo que dijo',o:['Jake hace comentarios sobre su cuerpo cada turno; le mandó un mensaje el 2 de junio','Un drama con Jake'],a:0},\n    {k:'Lo que hice',o:['Le di las gracias, le expliqué que tengo que reportarlo, le mandé correo a Recursos Humanos a las 11:05 PM','Le dije que lo ignorara'],a:0}],\n    why:'Hechos, fechas y sus palabras, no tu opinión. Luego mándalo a Recursos Humanos.'}\n ]},\n {id:'s4',title:'Tienes que reportarlo',icon:'report',mins:6,steps:[\n  {t:'multi',q:'¿Cuándo tienes que reportarlo a Recursos Humanos? Elige todas las que apliquen.',opts:['Alguien del equipo te cuenta de un acoso','Tú mismo lo ves','Escuchas un rumor de eso en otro equipo','La persona te pide que lo guardes en secreto'],a:[0,1,2,3],\n    why:'En todas. Los supervisores tienen que reportar cualquier acoso que vean, escuchen o sospechen, incluso de otros equipos.'},\n  {t:'order',q:'Viste a un compañero manosear a alguien del equipo. Pon tus pasos en orden.',items:['Intervén y páralo, si es seguro','Revisa que la persona esté bien','Repórtalo a Recursos Humanos de inmediato','Anota lo que viste'],\n    why:'Páralo, apoya a la persona, repórtalo, documéntalo. No investigues por tu cuenta.'},\n  {t:'mc',kind:'Cierto o falso',q:'Si la persona que sufrió el acoso dice que ya está bien, no tienes que reportarlo.',opts:['Cierto','Falso'],a:1,noShuffle:1,\n    why:'Falso. Repórtalo de todos modos. Recursos Humanos decide qué sigue, y otras personas también pueden estar en riesgo.'}\n ]},\n {id:'s5',title:'Durante una investigación',icon:'book',mins:7,steps:[\n  {t:'talk',pose:'calm',say:'Tu empresa tiene que investigar <b>rápido, de forma justa y con alguien neutral<\/b>. Tu trabajo es apoyar, no dirigirla ni estorbar.'},\n  {t:'bins',q:'Durante una investigación, ¿lo haces o no?',bins:[['Sí','Ayuda a un proceso justo'],['No','Lo perjudica o es represalia']],\n    items:[['Compartir tus notas con Recursos Humanos',0],['Decirle al equipo quién reportó',1],['Mantener el horario de quien reportó igual o mejor',0],['Preguntarle por tu cuenta al acusado qué hizo “de verdad”',1],['Mantenerlo en privado, hasta con tus amigos',0],['Insinuarle a quien reportó que está haciendo un drama',1]],\n    why:'Apoya el proceso, mantenlo en privado y protege a quien reportó de cualquier mal trato.'},\n  {t:'mc',kind:'Tu decisión',scene:'Mientras Recursos Humanos investiga, las dos personas siguen en el mismo turno y hay tensión.',q:'¿Qué es lo mejor?',opts:['Hablar con Recursos Humanos para cambiar el horario del acusado, no el de quien reportó','Pasar a quien reportó al turno de noche','No hacer nada hasta que termine'],a:0,\n    why:'Los cambios temporales están bien, pero no deben castigar a quien reportó. Arréglenlo con Recursos Humanos.'},\n  {t:'tiles',pose:'think',say:SK==='ca'?'Una investigación justa en California es:':'Una investigación justa es:',tiles:[\n    {icon:'clock',c:'',b:'Rápida',s:'Empieza de inmediato.'},\n    {icon:'scale',c:'o',b:'Neutral',s:'La hace alguien que no tiene interés en el caso.'},\n    {icon:'book',c:'p',b:'Completa',s:'Habla con todos los involucrados y lo pone por escrito.'},\n    {icon:'check',c:'g',b:'Cerrada',s:'Llega a una conclusión y toma medidas si hace falta.'}]}\n ]},\n {id:'s6',title:'Citas, favoritismo y poder',icon:'heartI',mins:6,steps:[\n  {t:'talk',pose:'think',say:'Salir con alguien que supervisas es riesgoso. <b>El poder hace difícil saber si un “sí” es libre.<\/b> Si se termina, se puede convertir rápido en una queja de acoso o represalia. Sigue la política de citas de tu empresa.'},\n  {t:'swipe',q:'¿Está bien, o es un problema?',left:'Problema',right:'Está bien',items:[\n    ['Invitar a salir a alguien que te reporta a ti','heartI',0],['Avisarle a Recursos Humanos de una relación que empezó antes de tu ascenso','report',1],['Darle a tu pareja los mejores turnos','cal',0],\n    ['Volver a invitar a salir a alguien del equipo después de que dijo que no','ban',0],['Ser amable y justo con todos','smile',1]],\n    why:'Cuando hay poder de por medio, hasta una invitación amable se puede sentir como presión. Avisa de tus relaciones y toma decisiones justas.'},\n  {t:'mc',kind:'Tu decisión',scene:'Dos personas que supervisas empiezan a salir. Es mutuo y en el trabajo están bien.',q:'¿Qué haces?',opts:['Seguir la política de citas y ser justo con los dos','Separarlos en turnos diferentes como castigo','Burlarte de eso en la junta del equipo'],a:0,\n    why:'Las relaciones mutuas entre compañeros no son acoso. Trátalos de forma justa y pon atención por si hay problemas si terminan.'}\n ]},\n {id:'s7',title:'Si te acusan',icon:'alert',mins:6,steps:[\n  {t:'talk',pose:'calm',say:'Que te acusen es estresante. Cómo reaccionas importa. <b>Mantén la calma, coopera y no busques a la persona que reportó.<\/b>'},\n  {t:'order',q:'Recursos Humanos te dice que hay una queja sobre ti. Pon los pasos en orden.',items:['Mantén la calma y escucha a Recursos Humanos','Responde las preguntas con honestidad','No hables del tema con quien reportó ni con el equipo','Sigue las medidas temporales que ponga Recursos Humanos'],\n    why:'Cooperar con honestidad es el mejor camino. Buscar a quien reportó, aunque sea para disculparte, puede parecer represalia.'},\n  {t:'mc',kind:'Tu decisión',scene:'Te acusaron. Crees que es injusto y quieres mandarle un mensaje a esa persona para “aclarar las cosas”.',q:'¿Deberías?',opts:['No. Cuenta tu versión a Recursos Humanos y deja en paz a esa persona','Sí, si eres amable','Sí, y pedirle al equipo que te apoye'],a:0,\n    why:'Buscar a quien reportó o convencer al equipo se puede ver como presión o represalia. Habla solo con Recursos Humanos.'}\n ]},\n {id:'s8',title:'Entrena, no hagas bullying',icon:'star',mins:6,steps:[\n  {t:'tone',q:'Reescribe este comentario para que sea firme pero no abusivo.',to:'Para: Sam (del equipo)',parts:[\n    {o:['Oye, quiero hablar sobre','Guau, de verdad la regaste','¿Eres tonto o qué? Mira'],a:0},' ',\n    {o:['las temperaturas del refrigerador que no revisaste dos veces esta semana.','literal todo lo que hiciste hoy.','tu actitud, como siempre.'],a:0},' ',\n    {o:['Repasemos la lista antes de tu siguiente turno.','Mejora o te vas.','Todos están hablando de eso.'],a:0}],\n    why:'Sé específico, habla del trabajo y da un siguiente paso. Los insultos y las amenazas son conducta abusiva.'},\n  {t:'swipe',q:'¿Entrenamiento, o abuso?',left:'Abusivo',right:'Entrenamiento',items:[\n    ['Una plática en privado sobre una tarea que no se hizo','chat',1],['Gritarle a alguien frente a los clientes','alert',0],['Darle a alguien tareas imposibles para que renuncie','clock',0],\n    ['Una advertencia por escrito después de un patrón claro','book',1],['Burlarse de los errores de alguien en la junta','users',0]],\n    why:'Entrenar es en privado, específico y justo. La humillación, el sabotaje y las amenazas son conducta abusiva.'},\n  {t:'reflect',q:'Piensa en una vez que te dieron un comentario duro que de verdad te ayudó. ¿Qué hizo que funcionara?',say:'Casi siempre es que fue en privado, específico y con ayuda. Esa es la fórmula.'}\n ]},\n {id:'s9',title:'Lo que tiene una buena política',icon:'doc',mins:5,steps:[\n  SK==='ca'?{t:'multi',q:'Según California, ¿qué incluye una buena política contra el acoso? Elige todas las que apliquen.',opts:['Una lista de todas las características protegidas','Más de una forma de reportar, no solo con tu jefe directo','La promesa de una investigación justa y a tiempo','Una regla contra las represalias'],a:[0,1,2,3],\n    why:'Todas, y además cómo las quejas se mantienen lo más privadas posible y que los supervisores tienen que reportar. Sabe dónde está tu política.'}:\n    {t:'multi',q:'Chicago exige que todo empleador tenga una política por escrito. ¿Qué debe incluir? Elige todas las que apliquen.',opts:['Que el acoso sexual es ilegal en Chicago, con ejemplos','Cómo reportar dentro de la empresa y a la Comisión de Relaciones Humanas de Chicago','Que todo empleado debe completar la capacitación cada año','Que las represalias por reportar son ilegales'],a:[0,1,2,3],\n    why:'Todas. Los empleadores de Chicago también deben guardar los registros de capacitación por 5 años. Sabe dónde está publicada tu política.'},\n  {t:'tiles',pose:'talk',say:'Tu trabajo con la política:',tiles:[\n    {icon:'doc',c:'',b:'Conócelo',s:'Léela. Sabe dónde está publicada.'},\n    {icon:'users',c:'o',b:'Compártela',s:'Recuérdale a tu equipo cómo reportar.'},\n    {icon:'check',c:'p',b:'Síguela',s:'Cada reporte, siempre.'},\n    {icon:'shield',c:'g',b:'Protege',s:'Nada de represalias, ni tuyas ni de nadie.'}]},\n  {t:'mc',q:'Alguien del equipo te pregunta cómo reportar acoso, pero no estás seguro. ¿Qué haces?',opts:['Buscar la política con esa persona y conectarla con Recursos Humanos','Decirle que mejor hable con sus amigos','Decirle que probablemente no vale la pena reportarlo'],a:0,\n    why:'No necesitas tener todas las respuestas. Llévala a la política y a Recursos Humanos, y da seguimiento.'}\n ]},\n {id:'s10',title:'Práctica: decisiones difíciles',icon:'star',mins:8,steps:[\n  {t:'texts',q:'Tu mejor vendedor te manda un mensaje.',chat:'Ryan (equipo)',sub:'Mejor vendedor · 3 años',icon:'user',rounds:[\n    {msgs:[['','Wednesday 4:10 PM'],['Ryan','oye se quejó Maya de mí?? 😂'],['Ryan','no aguanta una broma, ya sabes cómo soy']],ask:'¿Qué mandas?',opts:[\n      {t:'No puedo hablar de eso. Recursos Humanos lo maneja. Por favor mantén todo profesional y no hables con Maya de esto.',ok:1,fb:'Protegiste el proceso y a quien reportó, sin tomar partido.',then:[['Ryan','ok como sea']]},\n      {t:'jaja sí es muy sensible, no te preocupes',ok:0,fb:'Eso es tomar partido y puede dar a entender que las represalias están bien. También te mete a ti en la queja.',then:[['Ryan','jaja grax jefe']]},\n      {t:'Sí, dijo que la tocaste',ok:0,fb:'Nunca compartas detalles. Puede poner a Maya en riesgo.',then:[['Ryan','GUAU ok']]}]}],\n    why:'No confirmes, niegues ni hables de una queja. Recuérdale que sea profesional y que se mantenga lejos de quien reportó.'},\n  {t:'mc',kind:'Tu decisión',scene:'Una trabajadora te cuenta que un proveedor que entrega dos veces por semana la sigue acorralando en la bodega.',q:'¿Qué haces?',opts:['Reportarlo a Recursos Humanos y organizar que no se quede sola con el proveedor mientras se resuelve','Decirle que los proveedores no son tu problema','Decirle que evite la bodega los días de entrega'],a:0,\n    why:'El acoso de proveedores y clientes cuenta. Repórtalo y protégela, sin hacer que ella cambie su trabajo.'},\n  {t:'pledge',say:'Tú marcas la pauta para tu equipo. ¿Listo para comprometerte?',lines:['Conozco el límite y hago que mi equipo lo respete.','Lo detengo cuando lo veo, y nunca tomo represalias.','Reporto cada preocupación a Recursos Humanos, el mismo día.']}\n ]}\n];\n\n/* ---------- extended case practice (Connecticut and California supervisor versions) ---------- */\nconst PRACTICE=[\n {id:'p1',title:'Caso: el turno de cierre',icon:'moon',mins:7,steps:[\n  {t:'talkback',q:'Eres el tercer compañero. La encuentras sola atrás.',who:'Compañera',meter:50,start:'s',labels:['Apoyada','Insegura','Sola'],\n    why:'Pregunta cómo está, créele, ofrece ayuda y deja que decida. Ofrécete a acompañarla a reportarlo.',nodes:{\n    s:{say:'Ay, perdón. Estoy bien. Es que él es… mucho.',choices:[\n      {t:'“Yo también lo noté. No se veía bien. ¿Quieres hablar?”',d:-25,to:'mid',fb:'Dijiste lo que viste. Eso le dice que no se lo está imaginando.'},\n      {t:'“Nomás dile que se aleje.”',d:15,to:'bad',fb:'Fácil de decir, difícil de hacer. Un consejo sin apoyo se puede sentir como culpa.'}]},\n    mid:{say:'No quiero que lo corran ni nada.',choices:[\n      {t:'“Eso no te toca decidirlo a ti. ¿Quieres que te acompañe a hablar con el gerente?”',d:-25,to:'good',fb:'Le quitaste el peso de encima y le ofreciste apoyo real.'},\n      {t:'“Entonces supongo que tendrás que aguantarte.”',d:25,to:'bad',fb:'Eso la deja sola con el problema.'}]},\n    good:{end:1,good:1,say:'Okey. Sí. ¿Mañana antes del turno?',title:'La apoyaste.',msg:'Después más Delega: preguntaste cómo estaba y la ayudaste a reportarlo.'},\n    bad:{end:1,good:0,act:'Se encoge de hombros y sigue trapeando.',title:'Está sola.',msg:'Intenta preguntarle cómo está y ofrecerte a acompañarla.'}}},\n  {t:'reflect',q:'¿Qué te haría difícil intervenir en un momento así?',say:'Tener miedo al drama o a equivocarte es normal. Por eso “Después” cuenta: preguntar más tarde también es intervenir.'}\n ]},\n {id:'p2',title:'Caso: el chat de grupo',icon:'chat',mins:6,steps:[\n  {t:'post',kind:'Revisión del chat de grupo',q:'El chat de tu equipo esta semana. ¿Se deberían publicar estas cosas?',items:[\n    {pic:'Captura del perfil de citas de un compañero',cap:'miren quién anda en las apps 💀',icon:'heartI',ok:0,where:'chat del equipo',why:'Compartir el perfil privado de alguien para burlarse es acoso y un problema de privacidad.'},\n    {pic:'Petición de cambio de turno',cap:'alguien quiere mi cierre del sáb? 🙏',icon:'cal',ok:1,where:'chat del equipo',why:'Para esto es el chat.'},\n    {pic:'Foto editada con la cara de un compañero en otro cuerpo',cap:'nuevo uniforme para [nombre] jaja',icon:'camera',ok:0,where:'chat del equipo',why:'Las ediciones sexuales de una persona real son acoso grave. Repórtalo.'}],\n    why:'Si ataca, se burla o sexualiza a un compañero, no va en ningún lado.'},\n  {t:'mc',kind:'Tu decisión',scene:'Alguien publica una edición sexual de una compañera en el chat de grupo. Diez personas reaccionan con 😂.',q:'¿Qué es lo mejor?',opts:['Tomar captura, decir “no está bien” y reportarlo a un gerente','Reaccionar con 😂 para no llamar la atención','Borrar la app'],a:0,\n    why:'Guarda pruebas, di algo si es seguro y repórtalo. Avísale a tu compañera con cuidado, para que no la tome por sorpresa.'},\n  {t:'blank',q:'Completa el lema.',parts:['Conócelo. ',0,'. Repórtalo.'],answer:['Detenlo'],bank:['Detenlo','Publícalo','Ignóralo'],\n    why:'Conócelo. Detenlo. Repórtalo.'}\n ]},\n {id:'p3',title:'Caso: el cliente frecuente',icon:'cash',mins:6,steps:[\n  {t:'mc',kind:'Tu decisión',scene:'Eres el gerente. Un cliente frecuente deja buenas propinas, siempre pide a la misma trabajadora joven y hace comentarios sobre su físico. Ella por fin te dice que le da pavor cuando él viene.',q:'¿Qué deberías hacer?',opts:['Darle las gracias, atender tú a ese cliente, advertirle o prohibirle la entrada, y documentarlo','Recordarle que deja buenas propinas','Decirle que se ponga audífonos'],a:0,\n    why:'Los empleadores tienen que actuar ante el acoso de clientes una vez que lo saben. Las buenas propinas no cambian eso.'},\n  {t:'order',q:'Pon en orden los pasos del gerente.',items:['Darle las gracias a la trabajadora y escucharla','Quitarla de atender a ese cliente de inmediato','Decirle al cliente que pare, o prohibirle la entrada','Hacer el reporte por escrito y darle seguimiento con ella'],\n    why:'Escucha, protege, actúa con el cliente, documenta y da seguimiento.'}\n ]},\n {id:'p4',title:'Caso: la broma que no lo era',icon:'user',mins:6,steps:[\n  {t:'swipe',q:'Cada frase se dijo en una semana. ¿Está bien, o se pasa?',left:'Se pasa',right:'Está bien',items:[\n    ['“¿Me cubres el viernes?”','cal',1],['“Ustedes siempre llegan tarde.”','users',0],['“Buen trabajo con el inventario.”','star',1],\n    ['“¿A tu esposo no le molesta que trabajes de noche?”','user',0],['“Recen por mí en este turno 😂”','smile',1],['“Tu religión es rara.”','ban',0]],\n    why:'Los comentarios que señalan a alguien por su grupo, estado civil o fe se acumulan rápido.'},\n  {t:'reflect',q:'¿Alguna vez dijiste algo de broma que cayó mal? ¿Qué hiciste después?',say:'Todos nos equivocamos a veces. Un rápido “Me pasé, perdón”, y no repetirlo, ayuda mucho.'},\n  {t:'mc',kind:'Tu decisión',scene:'Un compañero te dice que le dolió una broma que hiciste sobre su acento.',q:'¿Qué le dices?',opts:['“Tienes razón. Me pasé. Perdón, y no lo vuelvo a hacer.”','“Relájate, era broma.”','“Todos los demás se rieron.”'],a:0,\n    why:'Reconócelo, discúlpate y cambia. Defender la broma lo empeora.'}\n ]}\n];\n\n/* ---------- Washington isolated workers (RCW 49.60.515) ---------- */\nconst WA_LESSONS=[\n {id:'w1',title:'Trabajar solo',icon:'user',mins:5,steps:[\n  {t:'talk',pose:'calm',say:'Las camaristas, el servicio a cuartos, los conserjes y los guardias de seguridad muchas veces <b>trabajan solos<\/b>, detrás de puertas cerradas o de noche. Eso puede hacer más fácil esconder el acoso y la agresión.',rule:'<b>La ley de Washington<\/b> da protección extra a los trabajadores aislados de hoteles, moteles, tiendas, seguridad y limpieza: un <b>botón de pánico<\/b>, una política por escrito, una lista de recursos y esta capacitación.'},\n  {t:'swipe',q:'¿Esta persona es un “trabajador aislado”?',left:'Trabajador aislado',right:'Normalmente no',items:[\n    ['Una camarista que limpia cuartos sola la mayor parte del turno','bed',0],['Un conserje de noche que limpia una oficina solo','broom',0],['Un guardia de seguridad en una ronda nocturna solo','shield',0],\n    ['Un cajero con tres compañeros en el piso','cash',1],['Un empleado de servicio a cuartos que lleva pedidos a los cuartos','bell',0]],\n    why:'Si pasas la mayoría de tus horas sin un compañero o supervisor lo bastante cerca para ayudarte, cuentas. Pregúntale a tu empleador si no estás seguro.'},\n  {t:'mc',kind:'Tu decisión',scene:'Tocas y entras a un cuarto a limpiar. Hay un huésped adentro, cierra la puerta detrás de ti y se para enfrente.',q:'¿Qué haces?',opts:['Salir de inmediato si puedes, y apretar tu botón de pánico si te sientes en peligro','Terminar de limpiar rápido para que se acabe','No decir nada para no molestar al huésped'],a:0,\n    why:'Tu seguridad va primero. Sal, aprieta el botón y repórtalo. No te vas a meter en problemas por salir de un cuarto.'}\n ]},\n {id:'w2',title:'Tu botón de pánico',icon:'alert',mins:5,steps:[\n  {t:'tiles',pose:'talk',say:'Tu empleador te tiene que dar un botón de pánico que:',tiles:[\n    {icon:'hand',c:'',b:'Lo llevas contigo',s:'Encima, todo el turno, en cada cuarto o área donde trabajas.'},\n    {icon:'bolt',c:'o',b:'Funciona con un solo toque',s:'Sin contraseña, sin pantallas, sin esperar.'},\n    {icon:'pin',c:'p',b:'Muestra dónde estás',s:'Para que la ayuda te encuentre rápido.'},\n    {icon:'users',c:'g',b:'Trae ayuda ya',s:'Alguien está capacitado para responder, en cada turno.'}]},\n  {t:'multi',q:'¿Cuándo puedes apretar el botón de pánico? Elige todas las que apliquen.',opts:['Un huésped te agarra o te toca','Alguien te encierra en un cuarto','Te sientes amenazado y quieres ayuda cerca','Terminaste temprano y quieres que te lleven'],a:[0,1,2],\n    why:'Úsalo cada vez que creas que estás en peligro, incluido el acoso o la agresión. No tienes que estar seguro. Mejor prevenir.'},\n  {t:'order',q:'Apretaste el botón. Pon en orden lo que sigue.',items:['Ve hacia una puerta o un área pública si puedes','Espera la ayuda, y no sueltes el botón','Dile a tu supervisor lo que pasó','Anota los detalles, o pide ayuda para escribirlos'],\n    why:'Ponte a salvo, deja que la ayuda llegue y luego repórtalo. Tu empleador no te puede castigar por usar el botón.'},\n  {t:'mc',kind:'Cierto o falso',q:'Tu empleador te puede sancionar por apretar el botón de pánico si resulta que estabas a salvo.',opts:['Cierto','Falso'],a:1,noShuffle:1,\n    why:'Falso. Usar el botón de buena fe está protegido. Si tu botón falta o no funciona, avísale a tu gerente o repórtalo a L&I.'}\n ]},\n {id:'w3',title:'Ayuda fuera del trabajo',icon:'heartI',mins:4,steps:[\n  {t:'flip',q:'Tu empleador te tiene que dar una lista de recursos. Toca cada tarjeta.',cards:[\n    {icon:'scale',c:'',front:'WSHRC',hint:'Toca para voltear',back:'<b>Comisión de Derechos Humanos del Estado de Washington.<\/b>hum.wa.gov · 1-800-233-3247.'},\n    {icon:'book',c:'o',front:'EEOC',hint:'Toca para voltear',back:'<b>Agencia federal.<\/b>eeoc.gov · 1-800-669-4000.'},\n    {icon:'shield',c:'p',front:'L&I',hint:'Toca para voltear',back:'<b>¿No hay botón de pánico, política o capacitación?<\/b>Repórtalo: isolatedworkers@lni.wa.gov.'},\n    {icon:'heartI',c:'g',front:'Grupos de apoyo locales',hint:'Toca para voltear',back:'<b>Apoyo gratis y privado.<\/b>Los programas contra la agresión sexual te pueden ayudar aunque no lo reportes.'}]},\n  {t:'reflect',q:'¿Dónde está tu botón de pánico ahora mismo, o dónde conseguirías uno? ¿A quién llamarías primero si algo pasara?',say:'Saber esto antes de necesitarlo es una habilidad de seguridad de verdad. Si todavía no tienes un botón, pídeselo hoy a tu gerente.'},\n  {t:'mc',kind:'Tu decisión',scene:'Un huésped te agarró. Te soltaste y estás a salvo, pero estás temblando.',q:'¿Qué es un buen siguiente paso?',opts:['Avisarle a tu supervisor, y llamar al 911 si fue una agresión','Seguir trabajando y olvidarlo','Publicar sobre el huésped en redes'],a:0,\n    why:'La agresión sexual es un delito. Repórtala en el trabajo y a la policía si tú decides. Los grupos de apoyo te pueden ayudar en cualquier caso.'}\n ]}\n];\n\n/* ---------- Chicago bystander hour ---------- */\nconst BYST=[\n {id:'b1',title:'Por qué la gente se congela',icon:'eye',mins:10,steps:[\n  {t:'talk',pose:'calm',say:'Chicago pide que todos aprendan a ser un <b>testigo activo<\/b>: alguien que ve acoso y hace algo, aunque sea algo pequeño.',rule:'<b>Por qué nos congelamos:<\/b> pensamos que otro va a actuar, no estamos seguros de que sea “tan grave” o tenemos miedo de empeorarlo.'},\n  {t:'flip',q:'Las 3 cosas que hacen que la gente no ayude. Toca cada tarjeta.',cards:[\n    {icon:'users',c:'',front:'“Alguien más lo hará”',hint:'Toca para voltear',back:'<b>Entre más gente hay, menos actúa.<\/b>Piensa que te toca a ti.'},\n    {icon:'eye',c:'o',front:'“A lo mejor no pasa nada”',hint:'Toca para voltear',back:'<b>Mira la cara de la persona, no el chiste.<\/b>Si está tensa, callada o se va, algo pasa.'},\n    {icon:'alert',c:'p',front:'“Lo voy a empeorar”',hint:'Toca para voltear',back:'<b>Los movimientos pequeños son seguros.<\/b>Distraer o preguntar después casi nunca sale mal.'}]},\n  {t:'dial',q:'Adivina: cuando la gente ve acoso en el trabajo, ¿cuántos no hacen nada?',start:0,answer:[2],stops:[\n    {v:'Casi nadie',fx:'Más que eso.'},\n    {v:'Unos 1 in 4',fx:'Más que eso.'},\n    {v:'La mitad o más',fx:'Los estudios dicen que <b>la mayoría de los testigos no intervienen<\/b>, normalmente porque no saben qué hacer.',mark:1},\n    {v:'Todos',fx:'No exactamente.'}],\n    why:'La mayoría de los testigos no hacen nada, no porque no les importe, sino porque no tienen un plan. Ahora tú sí vas a tener uno.'},\n  {t:'reflect',q:'Piensa en una vez que viste algo mal y no actuaste. ¿Qué te detuvo?',say:'Eso es honesto, y muy normal. Las siguientes lecciones te dan movimientos fáciles justo para ese momento.'}\n ]},\n {id:'b2',title:'Practica las 5 D',icon:'users',mins:12,steps:[\n  {t:'bins',q:'Une cada movimiento con su D.',bins:[['Directo','Decir algo ya'],['Distrae','Rompe el momento'],['Documenta','Anotar los hechos']],\n    items:[['“Oye, eso no está bien. Ya párale.”',0],['“¿Me ayudas a encontrar las llaves?”',1],['Anotar la hora, el lugar y las palabras que oíste',2],['“Para. Ella ya dijo que no.”',0],['Hacer una pregunta cualquiera para cambiar el tema',1],['Guardar una captura de pantalla para la persona a la que le pasó',2]],\n    why:'Las cinco D funcionan. Directo y Distrae pasan en el momento. Documenta ayuda después. Siempre pregúntale a la persona antes de compartir lo que grabaste o anotaste.'},\n  {t:'texts',q:'Estás en el chat de grupo del trabajo.',chat:'Equipo de fin de semana',sub:'9 members',icon:'users',rounds:[\n    {msgs:[['','Sunday 8:03 PM'],['Tyler','jajaja miren lo que subió Ana 🔥🔥'],['Tyler','(foto de Ana sacada de su perfil)'],['Tyler','califíquenla del 1 al 10']],ask:'Quieres intervenir. ¿Qué mandas?',opts:[\n      {t:'Nel. Bórrala, eso no está bien.',ok:1,fb:'Directo, corto y público. Los demás en el chat ahora saben que alguien está poniendo atención.',then:[['Jay','sí neta bórrala'],['Tyler','ya, relájense']]},\n      {t:'oigan ¿quién cubre el cierre del martes?',ok:1,fb:'Distrae también funciona. Cambiaste el tema. Ahora sigue con un reporte.',then:[['Mía','i can'],['','La foto queda enterrada.']]},\n      {t:'(No decir nada)',ok:0,fb:'El silencio puede parecer que estás de acuerdo. Un mensaje corto o un reporte discreto a tu gerente igual ayuda.',then:[['Tyler','¿nadie? jaja']]}]}],\n    why:'En un chat, un mensaje corto o un cambio de tema corta la onda. Luego avísale a un gerente y pregúntale a Ana cómo está.'},\n  {t:'talkback',q:'Al final de un turno, un líder le bloquea el paso a una trabajadora nueva y se le pega demasiado. Ella se ve congelada.',who:'Tú',meter:55,start:'s',labels:['Ayudé','Insegura','Ignorada'],\n    why:'Cualquier D es mejor que nada. Distrae y Delega son lo más seguro cuando la persona que lo hace tiene poder sobre ti.',nodes:{\n    s:{act:'Estás a 10 pies, cargando una caja.',say:'(¿Qué haces?)',choices:[\n      {t:'Acercarte: “Oye, Sam, te necesito adelante un segundo.”',d:-25,to:'mid',fb:'Distrae. Le diste una salida sin pelear.'},\n      {t:'Seguir acomodando. No es tu asunto.',d:25,to:'bad',fb:'Es una reacción normal. Pero ella está atrapada, y puedes ayudar con una sola frase.'}]},\n    mid:{act:'Ella se va contigo. El líder se ve molesto.',say:'(¿Y ahora?)',choices:[\n      {t:'En voz baja: “¿Estás bien? Eso se vio incómodo. ¿Quieres que vaya contigo con el gerente?”',d:-25,to:'good',fb:'Después más Delega. Le preguntaste cómo estaba y le ofreciste apoyo.'},\n      {t:'No decir nada y volver a trabajar.',d:10,to:'bad',fb:'Ayudaste una vez. Preguntar después hace que cuente.'}]},\n    good:{end:1,good:1,say:'Sí… gracias. ¿Nos podemos ir ya?',title:'Interviniste.',msg:'Cortaste el momento, le preguntaste cómo estaba y la ayudaste a reportar. Eso es un testigo activo.'},\n    bad:{end:1,good:0,act:'Ella se va del turno sola y callada.',title:'Está sola.',msg:'Prueba Distrae: una razón para sacarla de ahí. Es algo pequeño, seguro y funciona.'}}}\n ]},\n {id:'b3',title:'Intervenir de forma segura',icon:'shield',mins:10,steps:[\n  {t:'swipe',q:'¿Forma segura de ayudar, o arriesgada?',left:'Arriesgada',right:'Forma segura de ayudar',items:[\n    ['Preguntarle a la persona después si está bien','chat',1],['Empujarte con el acosador','alert',0],['Traer a un gerente','users',1],\n    ['Grabarlo y publicarlo sin preguntarle a la persona','camera',0],['Invitar a la persona a alejarse contigo','hand',1]],\n    why:'Tu seguridad también importa. Elige movimientos que no te pongan en peligro a ti ni a la persona. Nunca publiques lo que le pasó a alguien sin preguntarle.'},\n  {t:'mc',kind:'Tu decisión',scene:'Un compañero te dice: “Gracias por meterte. Pero porfa no lo reportes. No quiero drama.”',q:'¿Cuál es la mejor respuesta?',opts:['Respetar lo que siente, decirle dónde puede reportar, y avisarle a un gerente si tu política lo exige','Contarle a todo el mundo','Prometer que nunca le vas a decir a nadie, pase lo que pase'],a:0,\n    why:'Respeta su decisión cuando puedas. Si eres supervisor, tienes que reportarlo. De cualquier forma, dile que las represalias son ilegales.'},\n  {t:'order',q:'Pon en orden los pasos del testigo activo.',items:['Notar que algo está mal','Decidir que es tu momento de ayudar','Elegir una D que se sienta segura','Preguntarle a la persona después cómo está'],\n    why:'Notar, decidir, actuar, dar seguimiento. Eso es todo.'},\n  {t:'pledge',say:'Ser un testigo que ayuda es una habilidad. ¿Listo para comprometerte?',lines:['Me doy cuenta cuando algo no está bien.','Uso una D que se sienta segura: Directo, Distrae, Delega, Después o Documenta.','Pregunto después cómo está, y lo reporto.']}\n ]}\n];\n\n/* ---------- final check ---------- */\n/* ---------- tipped and hospitality work (il-rest, dc) ---------- */\nconst R_LESSONS=[\n {id:'r1',title:'Propinas, clientes frecuentes y poder',icon:'cash',mins:6,steps:[\n  {t:'talk',pose:'calm',say:'Cuando tu pago depende de las propinas, los clientes pueden sentir que tienen poder sobre ti. Pero <b>una propina nunca compra el derecho a acosarte.<\/b> “El cliente siempre tiene la razón” no aplica al acoso.',\n    rule:SK==='il'?'<b>La ley de Illinois<\/b> exige que los restaurantes y bares capaciten a todos sobre el acoso en esta industria y sobre lo que deben hacer los gerentes, en inglés y en español.':'<b>La ley de DC<\/b> exige que los negocios con trabajadores que reciben propinas capaciten a sus trabajadores y gerentes, y que lleven un registro de las quejas de acoso y las reporten cada año a la Oficina de Derechos Humanos.'},\n  {t:'swipe',q:'¿Parte del trabajo o acoso? Desliza cada uno.',left:'Acoso',right:'Parte del trabajo',items:[\n    ['Un cliente frecuente te dice “mi amor” en cada visita, después de que le pediste que parara','chat',0],['Un cliente pide cambiarse a otra mesa','users',1],\n    ['Una propina grande con su número y “llámame o se acaban las propinas”','cash',0],['Un cocinero te agarra la cintura “para pasar” en la línea','hand',0],\n    ['Un gerente dice “coquetea un poco, es bueno para las propinas”','crown',0],['Un cliente devuelve un plato frío','check',1]],\n    why:'Las quejas sobre la comida y el servicio son parte del trabajo. Los comentarios sexuales, los toqueteos y las “propinas a cambio de atención” no lo son, aunque sea un cliente frecuente.'},\n  {t:'mc',kind:'Tu decisión',scene:'Un cliente frecuente que gasta mucho te sigue tocando el brazo y la espalda. Cuando se lo dices a tu gerente, ella dice: “Es nuestro mejor cliente. Solo sonríe”.',q:'¿Qué es cierto?',opts:['El negocio igual tiene que actuar, aunque sea su mejor cliente','Tienes que aguantarlo porque deja buenas propinas','Solo el cliente puede decidir parar'],a:0,\n    why:'Cuando un gerente lo sabe, el negocio debe actuar: cambiar quién lo atiende, advertirle o prohibirle la entrada. Si tu gerente no lo hace, acude al dueño, a Recursos Humanos o a la agencia.'},\n  {t:'reflect',q:'¿Qué límite ha cruzado un cliente contigo o con alguien que conoces en el trabajo?',say:'No estás solo. Ponerle nombre hace que sea más fácil verlo, y más fácil decir “eso no está bien” la próxima vez.'}\n ]},\n {id:'r2',title:'Cocina, bar y después del cierre',icon:'users',mins:6,steps:[\n  {t:'flip',q:'Dónde aparece en restaurantes y bares. Toca cada tarjeta.',cards:[\n    {icon:'chat',c:'',front:'Detrás de la línea',hint:'Toca para voltear',back:'<b>La “cultura de cocina” no es excusa.<\/b>Los chistes groseros, los manoseos y los insultos son acoso, aunque haya mucho trabajo.'},\n    {icon:'clock',c:'o',front:'Después del cierre',hint:'Toca para voltear',back:'<b>Los tragos del turno y las fiestas después cuentan.<\/b>Si hay gente del trabajo, las reglas siguen aplicando.'},\n    {icon:'cal',c:'p',front:'Secciones y turnos',hint:'Toca para voltear',back:'<b>¿Buenas secciones a cambio de una cita?<\/b>Cambiar turnos o mesas por atención sexual es acoso de “esto por aquello”.'},\n    {icon:'hands',c:'g',front:'Cualquier idioma',hint:'Toca para voltear',back:'<b>El acoso en español o en cualquier idioma cuenta.<\/b>También los chistes sobre el acento o el inglés de alguien.'}]},\n  {t:'order',q:'Una mesera le dice al gerente que un cliente la agarró. Pon en orden los pasos del gerente.',items:['Darle las gracias y quitarla de esa mesa de inmediato','Hablar con el cliente o pedirle que se vaya','Anotar lo que pasó y quién lo vio','Reportarlo al dueño o a Recursos Humanos ese mismo día'],\n    why:'Primero protege a la trabajadora, luego atiende al cliente, anótalo y pásalo hacia arriba. Nunca esperes a que vuelva a pasar.'},\n  {t:'mc',kind:'Cierto o falso',q:`En ${ST.name}, un restaurante o bar puede ser responsable cuando un gerente sabe del acoso de un cliente o compañero de trabajo y no hace nada.`,opts:['Cierto','Falso'],a:0,noShuffle:1,\n    why:'Cierto. Los gerentes hablan por el negocio. Cuando un gerente lo sabe, el negocio debe actuar. Un gerente que acosa a alguien también puede ser responsable en lo personal.'}\n ]}\n];\n\n/* ---------- yearly refresher (refresh) ---------- */\nconst REFRESH=[\n {id:'y1',title:'Bienvenido de nuevo',icon:'star',mins:3,steps:[\n  {t:'talk',pose:'calm',say:'Bienvenido de nuevo. Ya hiciste esto antes, así que nos saltamos lo básico y vamos directo a <b>situaciones nuevas<\/b>. Unos 15 minutos.',rule:'<b>Siguen siendo las mismas tres cosas:<\/b> Conócelo. Detenlo. Repórtalo.'},\n  {t:'swipe',q:'¿Mito o realidad? Desliza cada uno.',left:'Mito',right:'Realidad',items:[\n    ['“Solo es acoso si lo hicieron a propósito”.','chat',0],['El acoso puede pasar en un chat de grupo fuera del horario de trabajo.','phone',1],['“Si no lo reportaste enseguida, ya no cuenta”.','clock',0],\n    ['Un cliente te puede acosar.','cash',1],['Reportar a un compañero es ser “soplón”.','ban',0]],\n    why:'El impacto importa más que la intención, esperar no lo borra y reportar está protegido. Lo que pasa en línea y con clientes también cuenta.'}\n ]},\n {id:'y2',title:'Nueva tecnología, mismas reglas',icon:'phone',mins:4,steps:[\n  {t:'talk',pose:'think',say:'Los celulares y la IA hacen fáciles nuevas formas de acoso: <b>fotos editadas, videos falsos, grabaciones a escondidas y publicaciones para “calificar” a la gente<\/b>. Las reglas no cambian. Si va contra alguien del trabajo, cuenta.'},\n  {t:'post',kind:'Revisión del chat de grupo',q:'Tus compañeros quieren publicar esto en el chat del equipo. ¿Lo publicas o lo saltas?',items:[\n    {pic:'Imagen hecha con IA que pone la cara de una compañera en una foto en traje de baño',cap:'jaja la IA está loca 😂',icon:'camera',ok:0,where:'chat del equipo',why:'Una imagen sexual falsa de una compañera real es acoso, aunque sea “obviamente falsa”. En muchos estados también es un delito.'},\n    {pic:'Foto de grupo de la fiesta de fin de año',cap:'el mejor equipo 🎉',icon:'users',ok:1,where:'chat del equipo',why:'Todos salen y nadie es el chiste. Publícala.'},\n    {pic:'Encuesta: “¿quién es la nueva más guapa?” con fotos',cap:'voten 🔥',icon:'eye',ok:0,where:'chat del equipo',why:'Calificar el físico de tus compañeros es acoso sexual, aunque sea en una “encuesta”.'},\n    {pic:'Video a escondidas de una compañera llorando en la sala de descanso',cap:'qué dramática 💀',icon:'camera',ok:0,where:'chat del equipo',why:'Grabar el peor momento de alguien para burlarse es bullying y un problema de privacidad. Sáltalo.'}],\n    why:'Si va contra una persona real del trabajo, o se tomó sin que lo supiera, no lo publiques.'},\n  {t:'texts',q:'Un compañero te escribe tarde un viernes.',chat:'Tyler (compañero)',sub:'Trabaja en tu turno',icon:'user',rounds:[\n    {msgs:[['','Viernes 10:31 PM'],['Tyler','mira lo que hice de Brianna con esa app de IA 😂😂'],['Tyler','[imagen]'],['Tyler','¿lo mando al grupo?']],ask:'¿Qué mandas?',opts:[\n      {t:'No. Bórralo. No está bien.',ok:1,fb:'Corto y claro. Lo paraste antes de que se regara.',then:[['Tyler','tranqui, es falso'],['Tyler','ya. borrado']]},\n      {t:'😂 mándalo',ok:0,fb:'Así te vuelves parte de eso, y un chat de grupo lo riega en segundos.',then:[['Tyler','mandando 😈']]},\n      {t:'(Dejarlo en visto)',ok:0,fb:'El silencio se puede leer como “está bien”. Un “no” corto ayuda, y aun así puedes avisarle a un gerente o a Recursos Humanos.',then:[]}]},\n    {msgs:[['','Lunes'],['Tyler','no le dijiste a nadie, ¿verdad?']],ask:'Brianna todavía no sabe. ¿Y ahora qué?',opts:[\n      {t:'(Avisarle a tu gerente o a Recursos Humanos, sin reenviar la imagen)',ok:1,fb:'Bien. Recursos Humanos puede actuar rápido. No pases la imagen, ni siquiera como prueba. Solo di que existe y quién la tiene.',then:[['','Le avisaste a Recursos Humanos.']]},\n      {t:'no, todo bien',ok:0,fb:'Aunque la haya borrado, las copias se riegan. Brianna merece saberlo, y Recursos Humanos puede ayudar.',then:[]}]}],\n    why:'Que sea falso no significa que no haga daño. No lo compartas, di que no y repórtalo.'},\n  {t:'mc',kind:'Tu decisión',scene:'Un cliente empieza a grabarte y a hacer comentarios sobre tu cuerpo. Dice que lo va a publicar.',q:'¿Cuál es tu mejor opción?',opts:['Alejarte, buscar a un gerente y reportarlo','Discutir con él frente a la cámara','Ignorarlo, los clientes pueden hacer lo que quieran'],a:0,\n    why:'No tienes que quedarte ahí mientras te graban. Pide apoyo. Tu empleador tiene que actuar contra el acoso de los clientes.'}\n ]},\n {id:'y3',title:'“Era solo una broma”',icon:'chat',mins:4,steps:[\n  {t:'talkback',q:'Le dijiste a un compañero que su comentario sobre el físico de la nueva no estuvo bien. Él te contesta.',who:'Andre (compañero)',meter:50,start:'s',labels:['Bien manejado','Tenso','Escalando'],\n    why:'No tienes que ganar la discusión. Nombra el impacto, mantén la calma y repórtalo si sigue pasando.',nodes:{\n    s:{say:'Relájate, era una broma. Eres demasiado sensible.',choices:[\n      {t:'“Tal vez. Pero a ella no le dio risa. Ya déjalo”.',d:-20,to:'mid',fb:'Tranquilo y corto. No discutiste la broma. Nombraste el impacto.'},\n      {t:'“Qué asco das”.',d:20,to:'worse',fb:'Es un sentimiento válido, pero los insultos lo vuelven una pelea sobre ti.'},\n      {t:'Reírte para que no sea incómodo.',d:25,to:'bad',fb:'Reírte le dice que los comentarios están bien.'}]},\n    mid:{say:'Como sea. Todos se estaban riendo.',choices:[\n      {t:'“No todos. Si sigue pasando, se lo voy a decir al gerente”.',d:-25,to:'good',fb:'Límite claro, siguiente paso claro.'},\n      {t:'“Sí, bueno, está bien”.',d:15,to:'bad',fb:'Te echaste para atrás. Está bien, pero él lo va a tomar como luz verde.'}]},\n    worse:{act:'Andre sube la voz. Los demás voltean.',say:'Ah, ¿ahora yo soy el malo?',choices:[\n      {t:'“No quiero pelear. Solo deja de hacer comentarios sobre ella”. Luego te vas.',d:-25,to:'good',fb:'Calmaste las cosas y mantuviste tu punto.'},\n      {t:'Seguir discutiendo.',d:20,to:'bad',fb:'Ahora es una pelea a gritos, y la nueva está en medio.'}]},\n    good:{end:1,good:1,say:'Bueno. Como sea.',title:'Mantuviste el límite.',msg:'Nombraste el impacto, mantuviste la calma y no te metiste en un debate. Pregúntale a la nueva cómo está, y repórtalo si sigue pasando.'},\n    bad:{end:1,good:0,act:'Los comentarios siguen. La nueva empieza a comer en su carro.',title:'Siguió pasando.',msg:'Los chistes contra alguien se van sumando. Pregúntale cómo está, y avísale a un gerente o a Recursos Humanos.'}}},\n  {t:'bins',q:'¿Está bien, pregunta o repórtalo? Ordena cada uno.',bins:[['Está bien','No hay problema'],['¿Cómo estás?','Podría no ser bienvenido'],['Repórtalo','Cruza el límite']],\n    items:[['Decirle a un compañero que le queda bien su corte nuevo, u harás diferente este año si ves algo?',say:'Los pequeños pasos importan. Un “eso no está bien” puede cambiar cómo actúa todo un equipo.'},\n  {t:'pledge',say:'Un año más de respeto en el trabajo. ¿Listo para comprometerte?',lines:['No comparto imágenes falsas ni privadas de nadie.','Me importa el impacto, no solo la intención.','Hablo, lo reporto y apoyo a quienes lo reportan.']}\n ]}\n];\n\nconst FQ={\n blank:{t:'blank',q:'Completa las tres cosas que debes recordar.',parts:['Conócelo. ',0,'. ',1,'.'],answer:['Detenlo','Repórtalo'],bank:['Detenlo','Repórtalo','Ignóralo','Publícalo','Escóndelo'],why:'Conócelo. Detenlo. Repórtalo.'},\n who:{t:'mc',q:'¿Quién puede acosar a alguien en el trabajo?',opts:['Gerentes, compañeros, clientes y proveedores','Solo los gerentes','Solo personas del sexo opuesto'],a:0,why:'Cualquier persona en el trabajo o relacionada con él, de cualquier género.'},\n online:{t:'mc',kind:'Tu decisión',scene:'Un compañero te sigue mandando mensajes directos con comentarios sexuales en la noche, después de que le pediste que parara.',q:'¿Qué deberías hacer?',opts:['Guardar los mensajes y reportarlo','Borrar todo y quedarte callado','Publicar los mensajes en tu historia'],a:0,why:'Lo que pasa en línea cuenta. Guarda pruebas y repórtalo a tu gerente o a Recursos Humanos.'},\n qpq:{t:'mc',q:'Un líder te ofrece mejores turnos si sales con él. ¿Cómo se llama esto?',opts:['Acoso de “esto por aquello” (quid pro quo)','Un beneficio normal del trabajo','Solo es un problema si dices que sí'],a:0,why:'Condicionar un beneficio del trabajo a un favor sexual es acoso quid pro quo, ilegal aunque pase una sola vez.'},\n ds:{t:'mc',q:'¿Cuál de las 5 D significa preguntarle a la persona cómo está después?',opts:['Después','Directo','Distrae'],a:0,why:'Después: “¿Estás bien? Eso no estuvo bien.”'},\n retal:{t:'mc',kind:'Cierto o falso',q:'Es legal quitarle horas a alguien porque reportó acoso, si no se comprobó el reporte.',opts:['Cierto','Falso'],a:1,noShuffle:1,why:' ón',scene:'Recursos Humanos te dice que te acusaron de acoso.',q:'¿Qué deberías hacer?',opts:['Cooperar con Recursos Humanos y no buscar a quien reportó','Mandarle un mensaje a quien reportó para aclarar las cosas','Pedirle al equipo que te apoye'],a:0,why:'Buscar a quien reportó o convencer al equipo puede parecer represalia.'},\n supInv:{t:'mc',q:'Durante una investigación, ¿qué cambio temporal es justo?',opts:['Cambiar el horario de la persona acusada, con Recursos Humanos','Pasar a quien reportó a peores turnos','Decirle al equipo quién reportó'],a:0,why:'Las medidas temporales protegen a quien reportó y nunca lo castigan.'},\n panic:{t:'mc',kind:'Tu decisión',scene:'Estás limpiando un cuarto sola y un huésped no te deja salir.',q:'¿Qué deberías hacer?',opts:['Aprietas tu botón de pánico y sales si puedes','Esperas a que el huésped se calme','Primero le llamas a un amigo'],a:0,why:'Para eso es exactamente el botón de pánico. Después repórtalo.'},\n bystander:{t:'mc',q:'¿Por qué la mayoría de los testigos no intervienen?',opts:['No saben qué hacer o creen que otro lo hará','No les importa','Ayudar va contra las reglas'],a:0,why:'Un plan sencillo, como las 5 D, lo resuelve.'},\n misconduct:{t:'mc',q:'En Chicago, ¿qué es la “conducta sexual indebida”?',opts:['Conducta sexual que usa presión o el poder de alguien en el trabajo','Cualquier chiste amistoso','Una evaluación de desempeño justa'],a:0,why:'Coerción, abuso de autoridad o mal uso de un puesto de trabajo, mezclados con conducta sexual.'},\n supWho:{t:'mc',kind:'Cierto o falso',q:'En California, a un supervisor lo pueden demandar personalmente por acosar a alguien.',opts:['Cierto','Falso'],a:0,noShuffle:1,why:'Cierto. Según la FEHA, quienes acosan son responsables personalmente.'},\n supLiable:{t:'mc',kind:'Cierto o falso',q:'En Illinois, una empresa es responsable del acoso sexual de un supervisor, aunque nadie más arriba lo supiera.',opts:['Cierto','Falso'],a:0,noShuffle:1,why:'Verdadero. Por eso los superv
